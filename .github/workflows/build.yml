name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate android/
        run: flutter create --platforms=android --project-name tilawa_enhancer .


      # S19: Pillow required for icon generation in patch_android.py
      - name: Install Pillow for icon generation
        run: pip install Pillow --quiet

      - name: Patch android/ v11
        run: python3 patch_android.py

      - name: Verify INTERNET permission in manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "INTERNET permission: CONFIRMED"
          else
            echo "ERROR: INTERNET missing!"
            cat "$MANIFEST"
            exit 1
          fi
          if grep -q "networkSecurityConfig" "$MANIFEST"; then
            echo "networkSecurityConfig: CONFIRMED"
          else
            echo "ERROR: networkSecurityConfig missing!"
            exit 1
          fi
          if grep -q "queries" "$MANIFEST"; then
            echo "queries block: CONFIRMED"
          else
            echo "WARNING: queries block missing (Open in Player may fail on API30+)"
          fi

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tilawa-Enhancer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
