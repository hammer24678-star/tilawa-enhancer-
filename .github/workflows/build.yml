name: Build APK + AAB

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # S240: asset step used to hang for hours when the QEMU DeepFilter build
    # stalled (now removed) — cap the job so any future hang fails fast.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64


      - name: Build asset bundles (Alpine + Python + DeepFilter)
        run: if [ -f build_assets.sh ]; then bash build_assets.sh; else echo "build_assets.sh not found — skipping"; fi  # S151

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'  # S156: verify this exists; fallback: remove line and use channel only
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate android/
        run: flutter create --platforms=android --project-name tilawa_enhancer .

      - name: Install Pillow for icon generation
        run: pip install Pillow --quiet --break-system-packages  # S205

      - name: Patch android/ v11
        run: python3 patch_android.py
      - name: Verify INTERNET permission in manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "INTERNET permission: CONFIRMED"
          else
            echo "ERROR: INTERNET missing!"
            exit 1
          fi
          if grep -q "networkSecurityConfig" "$MANIFEST"; then
            echo "networkSecurityConfig: CONFIRMED"
          else
            echo "ERROR: networkSecurityConfig missing!"
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/tilawa_release.jks
          echo "Keystore size: $(wc -c < android/app/tilawa_release.jks) bytes"

      - name: Write key.properties
        run: |
          cat > android/key.properties << 'KEYEOF'
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=tilawa_release.jks
          KEYEOF
          echo "key.properties written"

      - name: Patch build.gradle for signing  # S156: inlined, no patch_signing.py needed
        run: |
          GRADLE="android/app/build.gradle"
          if grep -q "signingConfigs" "$GRADLE"; then
            echo "signing already configured"
          else
            # inject signingConfigs block after defaultConfig closing brace
            python3 - << 'PYEOF'
          import re, pathlib
          g = pathlib.Path("android/app/build.gradle")
          t = g.read_text()
          block = '''
              signingConfigs {
                  release {
                      storeFile file("tilawa_release.jks")
                      storePassword System.getenv("KEY_STORE_PASSWORD") ?: ""
                      keyAlias System.getenv("KEY_ALIAS") ?: ""
                      keyPassword System.getenv("KEY_PASSWORD") ?: ""
                  }
              }
          '''
          t = re.sub(r'(\s*buildTypes\s*\{)', block + r'\1', t, count=1)
          t = t.replace('signingConfig signingConfigs.debug',
                        'signingConfig signingConfigs.release')
          g.write_text(t)
          print("build.gradle signing patched")
          PYEOF
          fi

      - name: Write google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No GOOGLE_SERVICES_JSON secret — skipping"
          fi

      - name: Build APK (release)
        run: |
          flutter build apk --release --no-tree-shake-icons             -Pandroid.injected.signing.store.file=$PWD/android/app/tilawa_release.jks             -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}             -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}             -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build AAB (Play Store)
        run: |
          flutter build appbundle --release --no-tree-shake-icons             -Pandroid.injected.signing.store.file=$PWD/android/app/tilawa_release.jks             -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }}             -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}             -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK + AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tilawa Enhancer - Latest"
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            assets/alpine/python-env.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
