name: Build iOS (unsigned)

# S175: manual-trigger only — macOS runners cost 10x the Actions minutes of
# ubuntu-latest, and iOS isn't the primary target yet. Run this from the
# Actions tab when you want to verify the iOS build compiles.
#
# This produces an UNSIGNED Runner.app — it CANNOT be installed on a real
# iPhone or submitted to TestFlight/App Store as-is. Real device / TestFlight
# distribution requires an Apple Developer Program account ($99/yr) plus a
# signing certificate + provisioning profile. Once you have those, this
# workflow can be extended to a signed `flutter build ipa` job — ask and
# I'll wire it up with GitHub secrets the same way android/build.yml does.

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate ios/
        run: flutter create --platforms=ios --project-name tilawa_enhancer .

      - name: Build iOS (unsigned, release)
        run: flutter build ios --release --no-codesign

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r Runner-unsigned.app.zip Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawa-ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.app.zip
          retention-days: 14
