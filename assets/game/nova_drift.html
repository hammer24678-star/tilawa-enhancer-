<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NOVA DRIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070914;
    --bg2:#0d1226;
    --cyan:#3df0ff;
    --magenta:#ff2e88;
    --amber:#ffc24b;
    --green:#78ffaa;
    --violet:#be8cff;
    --teal:#4bffe0;
    --ink:#eaf2ff;
    --dim:#5a6a93;
    /* 8px rhythm (4px minimum) — every new panel measures itself against
       these rather than inventing one-off spacing. */
    --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:40px;
  }
  /* Colourblind-safe HUD palette. Cyan/amber/violet already avoid a red/green
     axis; this variant additionally pushes the two "danger" hues apart in
     luminance so state never rests on hue alone. Paired with shape/icon
     differences in the game layer (see STATE_GLYPH). */
  body.cbSafe{
    --magenta:#ff8fb0;
    --green:#ffe066;
    --amber:#ffd166;
    --violet:#9db4ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%; overflow:hidden;
    background:var(--bg);
    font-family:'Space Mono',monospace;
    color:var(--ink);
    user-select:none;
    touch-action:none;
    overscroll-behavior:none;
    position:fixed;
    inset:0;
  }
  #wrap{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    overscroll-behavior:none;
    background:var(--bg);
  }
  canvas{display:block; background:transparent; touch-action:none;}
  /* 2.4: the background layer is its own canvas so the nebula/parallax pass
     is not repaid on every frame of the hot gameplay canvas. */
  #bg{position:absolute; inset:0; z-index:0;}
  #game{position:absolute; inset:0; z-index:1;}
  #fx{position:absolute; inset:0; z-index:2; pointer-events:none;}

  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top, 0px) + 18px) 22px 0 22px;
    pointer-events:none;
    font-family:'Orbitron',sans-serif;
    z-index:5;
  }
  .hud .block{display:flex; flex-direction:column; gap:2px;}
  .hud .label{font-size:10px; letter-spacing:3px; color:var(--dim); font-family:'Space Mono',monospace;}
  .hud .value{font-size:22px; font-weight:700; color:var(--cyan); text-shadow:0 0 12px rgba(61,240,255,.6); letter-spacing:1px;}
  .hud .value.combo{color:var(--magenta); text-shadow:0 0 12px rgba(255,46,136,.6);}
  /* 4.2: HUD numbers pop on change instead of silently swapping. transform
     and opacity only — never a property that forces layout (2.4). */
  .hud .value.bump{animation:hudBump .26s cubic-bezier(.34,1.56,.64,1);}
  @keyframes hudBump{0%{transform:scale(1);}45%{transform:scale(1.18);}100%{transform:scale(1);}}
  #lives{display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; justify-content:flex-end; max-width:120px;}
  .life{width:10px; height:10px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .life.lost{background:#1c2340; box-shadow:none;}
  #buffs{font-size:8px; letter-spacing:1px; color:var(--dim); margin-top:5px; font-family:'Space Mono',monospace; max-width:150px; text-align:right;}
  #shardHud{font-size:9px; letter-spacing:1.5px; color:var(--green); margin-top:4px; font-family:'Orbitron',sans-serif;}
  #ultBar{
    width:110px; height:4px; margin-top:6px; border-radius:2px;
    background:rgba(90,106,147,.28); overflow:hidden;
  }
  #ultFill{height:100%; width:0%; background:var(--violet); box-shadow:0 0 8px var(--violet); transition:width .12s linear;}
  #ultBar.ready #ultFill{background:var(--amber); box-shadow:0 0 10px var(--amber);}

  #pauseBtn, #settingsBtn{
    position:absolute; top:calc(env(safe-area-inset-top, 0px) + 104px);
    width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(61,240,255,.4); background:rgba(13,18,38,.55); color:var(--cyan);
    font-family:'Orbitron',sans-serif; font-size:12px; z-index:7; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  #pauseBtn{ right:18px; }
  #settingsBtn{ left:18px; font-size:15px; }
  #pauseBtn:active, #settingsBtn:active{transform:scale(.92);}

  #wave-banner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(22px,5vw,46px);
    letter-spacing:4px;
    color:var(--ink);
    text-shadow:0 0 30px rgba(61,240,255,.5);
    opacity:0; pointer-events:none; z-index:6;
    transition:opacity .25s ease, transform .25s ease;
    text-align:center; padding:0 var(--s4); max-width:96vw;
  }
  #wave-banner.show{opacity:1; transform:translate(-50%,-50%) scale(1.05);}
  #wave-banner .sub{
    display:block; font-size:.42em; letter-spacing:3px; color:var(--dim);
    margin-top:var(--s2); font-family:'Space Mono',monospace;
  }

  #hint{
    /* Clears the dash/ultimate buttons rather than wrapping down over them. */
    position:absolute; bottom:calc(env(safe-area-inset-bottom, 0px) + 100px); left:50%; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:1.5px; color:var(--dim); z-index:5; pointer-events:none;
    text-align:center; padding:0 16px; max-width:90vw;
    transition:opacity .6s ease;
  }
  #hint.faded{ opacity:0; }
  /* 4.6: contextual one-liners for systems as they first become relevant,
     rather than one wall of instructions at launch. */
  #ctxHint{
    position:absolute; bottom:calc(env(safe-area-inset-bottom, 0px) + 150px); left:50%;
    transform:translateX(-50%) translateY(8px);
    font-size:10px; letter-spacing:1.4px; color:var(--ink);
    background:rgba(13,18,38,.92); border:1px solid rgba(61,240,255,.35);
    border-radius:3px; padding:var(--s2) var(--s3);
    z-index:6; pointer-events:none; opacity:0;
    max-width:min(320px, calc(100vw - 32px)); text-align:center;
    transition:opacity .35s ease, transform .35s cubic-bezier(.16,1,.3,1);
  }
  #ctxHint.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(13,18,38,1), rgba(7,9,20,1));
    z-index:10; text-align:center; padding:var(--s4); overflow-y:auto;
    overscroll-behavior:contain;
  }
  #overlay.hidden{display:none;}
  #menuView, #endView{display:flex; flex-direction:column; align-items:center; gap:12px; max-width:440px; margin:auto; width:100%;}
  #endView{display:none;}
  #overlay h1{
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(30px,7.5vw,54px);
    letter-spacing:6px; margin:0;
    background:linear-gradient(135deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(61,240,255,.25);
  }
  #overlay p{color:var(--dim); font-size:11.5px; max-width:380px; line-height:1.7; letter-spacing:.4px; margin:0;}
  #metaStats{font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:2px; color:var(--dim);}

  #diffRow{display:flex; gap:var(--s2); margin-top:2px; flex-wrap:wrap; justify-content:center;}
  .diffBtn{
    font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:1px; color:var(--dim);
    background:rgba(13,18,38,.5); border:1px solid rgba(90,106,147,.4); border-radius:2px;
    padding:7px 14px; cursor:pointer;
  }
  .diffBtn.selected{color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px rgba(61,240,255,.25);}
  .diffBtn:active{transform:scale(.94);}

  /* Equipped-ship summary on the menu; the full 45-ship roster lives in the
     hangar screen (4.5 — never a single unscrollable wall of rows). */
  #shipSummary{
    display:flex; align-items:center; gap:var(--s3); width:100%; max-width:300px;
    border:1px solid rgba(90,106,147,.4); border-radius:4px;
    background:rgba(13,18,38,.5); padding:10px 12px; cursor:pointer; text-align:left;
  }
  #shipSummary:active{transform:scale(.97);}
  #shipSummary .glyph{flex:0 0 auto; width:34px; height:34px;}
  #shipSummary .meta{flex:1 1 auto; min-width:0;}
  #shipSummary .shipClassTag{flex:0 0 auto; white-space:nowrap; align-self:center;}
  #shipSummary .chev{flex:0 0 auto; color:var(--dim); font-size:16px; align-self:center;}
  .shipName{font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; margin-bottom:4px;}
  .shipDesc{font-size:9px; color:var(--dim); line-height:1.4;}
  .shipStat{font-size:9px; letter-spacing:1px; color:var(--ink);}

  #leaderboardBox{font-size:10px; letter-spacing:1px; color:var(--dim); min-height:14px;}
  .lbTitle{color:var(--amber); font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:2px; margin-bottom:4px;}
  .lbRow{line-height:1.6;}

  #runSummary{font-size:11px; color:var(--dim); line-height:1.9; letter-spacing:1px;}
  .newBest{color:var(--amber); font-weight:700;}
  .score-final{
    font-family:'Orbitron',sans-serif; font-size:34px; font-weight:700; color:var(--amber);
    text-shadow:0 0 20px rgba(255,194,75,.5); display:none;
  }
  .score-final.show{display:block; animation:popIn .45s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIn{0%{transform:scale(.7); opacity:0;}100%{transform:scale(1); opacity:1;}}
  #startBtn{
    font-family:'Orbitron',sans-serif;
    font-weight:700; letter-spacing:3px; font-size:14px;
    background:transparent;
    border:2px solid var(--cyan);
    color:var(--cyan);
    padding:13px 32px;
    border-radius:2px;
    cursor:pointer;
    box-shadow:0 0 18px rgba(61,240,255,.25), inset 0 0 18px rgba(61,240,255,.05);
    transition:all .15s ease;
  }
  #overlay button:active{transform:scale(.96);}
  .menuBtn{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:.5px; font-size:9px;
    background:transparent; border:2px solid var(--dim); color:var(--dim);
    padding:11px 6px; border-radius:2px; cursor:pointer;
    flex:1 1 calc(33.333% - var(--s2)); min-width:96px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #menuBtnRow{display:flex; gap:var(--s2); width:100%; max-width:400px; flex-wrap:wrap; justify-content:center;}

  #pauseOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:rgba(7,9,20,.9); z-index:8;
  }
  #pauseOverlay h2{font-family:'Orbitron',sans-serif; letter-spacing:6px; font-size:26px; color:var(--ink); margin:0;}
  #pauseOverlay button{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:2px; font-size:13px;
    background:transparent; border:2px solid var(--cyan); color:var(--cyan);
    padding:11px 30px; border-radius:2px; cursor:pointer; width:200px;
  }
  #pauseOverlay button:active{transform:scale(.96);}

  .modal{
    position:absolute; inset:0; display:none; align-items:center; justify-content:flex-start;
    flex-direction:column; gap:10px; background:#070914; z-index:15;
    overflow-y:auto; overscroll-behavior:contain;
    padding:calc(env(safe-area-inset-top, 0px) + var(--s4)) 20px calc(env(safe-area-inset-bottom, 0px) + var(--s6)) 20px;
    /* 4.5: a visible scrollbar affordance so a long list reads as scrollable */
    scrollbar-width:thin; scrollbar-color:rgba(90,106,147,.6) transparent;
  }
  .modal::-webkit-scrollbar{width:5px;}
  .modal::-webkit-scrollbar-thumb{background:rgba(90,106,147,.6); border-radius:3px;}
  .modal.open{display:flex;}
  .modal h2{font-family:'Orbitron',sans-serif; letter-spacing:5px; font-size:20px; color:var(--ink); margin:var(--s2) 0 6px 0; text-align:center;}
  .modalSub{font-size:10px; letter-spacing:1.5px; color:var(--dim); margin-top:-6px; text-align:center; max-width:340px;}
  .settingsRow{display:flex; justify-content:space-between; align-items:center; gap:var(--s2); width:min(272px, calc(100vw - 48px)); font-size:11.5px; letter-spacing:1px; color:var(--dim); box-sizing:border-box;}
  .settingsRow span{flex:1 1 auto; min-width:0;}
  .settingsNote{font-size:9px; color:var(--dim); opacity:.75; width:min(272px, calc(100vw - 48px)); line-height:1.5; margin-top:-4px;}
  .toggleBtn{
    font-family:'Orbitron',sans-serif; font-size:10.5px; letter-spacing:1px; color:var(--cyan);
    background:rgba(61,240,255,.08); border:1px solid rgba(61,240,255,.4); border-radius:2px;
    padding:6px 12px; cursor:pointer; min-width:74px; flex:0 0 auto;
  }
  .toggleBtn:active{transform:scale(.94);}
  .modalCloseBtn{
    margin-top:var(--s2); font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:3px; font-size:13px;
    background:transparent; border:2px solid var(--dim); color:var(--dim);
    padding:11px 30px; border-radius:2px; cursor:pointer;
  }
  .modalCloseBtn:active{transform:scale(.96);}

  /* 4.5: category tabs + pagination for the long rosters */
  .tabRow{
    display:flex; gap:var(--s1); flex-wrap:wrap; justify-content:center;
    width:min(360px, calc(100vw - 40px));
  }
  .tabBtn{
    font-family:'Orbitron',sans-serif; font-size:9px; letter-spacing:1px; color:var(--dim);
    background:rgba(13,18,38,.6); border:1px solid rgba(90,106,147,.35); border-radius:2px;
    padding:6px 9px; cursor:pointer;
  }
  .tabBtn.selected{color:var(--cyan); border-color:var(--cyan);}
  .tabBtn:active{transform:scale(.94);}
  .pageRow{display:flex; gap:var(--s2); align-items:center; font-size:10px; color:var(--dim); letter-spacing:1px;}
  .pageBtn{
    font-family:'Orbitron',sans-serif; font-size:11px; color:var(--cyan);
    background:rgba(61,240,255,.08); border:1px solid rgba(61,240,255,.35);
    border-radius:2px; padding:5px 12px; cursor:pointer;
  }
  .pageBtn:disabled{opacity:.3; cursor:default;}
  .pageBtn:active{transform:scale(.94);}

  #upgradesShards{font-family:'Orbitron',sans-serif; font-size:12px; letter-spacing:2px; color:var(--amber);}
  .listBox{display:flex; flex-direction:column; gap:2px; width:100%; max-width:min(340px, calc(100vw - 40px)); box-sizing:border-box;}
  .upgradeRow{display:flex; justify-content:space-between; align-items:center; gap:var(--s2); width:100%; padding:var(--s2) 0; border-bottom:1px solid rgba(90,106,147,.15);}
  .upgradeInfo{text-align:left; flex:1 1 auto; min-width:0;}
  .upgradeName{color:var(--ink); font-family:'Orbitron',sans-serif; font-size:10.5px; letter-spacing:.5px; overflow-wrap:break-word;}
  .upgradeDesc{font-size:9px; color:var(--dim); line-height:1.4; margin-top:2px; overflow-wrap:break-word;}
  .lvlPips{display:flex; gap:2px; margin-top:4px;}
  .lvlPip{width:9px; height:3px; border-radius:1px; background:rgba(90,106,147,.35);}
  .lvlPip.on{background:var(--cyan); box-shadow:0 0 5px rgba(61,240,255,.6);}
  .upgradeBuy{
    font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:1px; color:var(--cyan);
    background:rgba(61,240,255,.08); border:1px solid rgba(61,240,255,.4); border-radius:2px;
    padding:7px 10px; cursor:pointer; min-width:66px; flex:0 0 auto;
  }
  .upgradeBuy:disabled{opacity:.35; cursor:default;}
  .upgradeBuy.maxed{color:var(--amber); border-color:var(--amber); opacity:.8;}

  /* Ship gallery — 4.4: distinct silhouette AND colour for every entry */
  #shipGrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:var(--s2);
    width:100%; max-width:min(360px, calc(100vw - 40px));
  }
  .shipCard{
    border:1px solid rgba(90,106,147,.4); border-radius:4px; padding:10px;
    cursor:pointer; background:rgba(13,18,38,.5);
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
  }
  .shipCard.selected{border-color:var(--cyan); box-shadow:0 0 14px rgba(61,240,255,.3);}
  .shipCard.locked{opacity:.5;}
  .shipCard.denied{animation:denyShake .3s;}
  .shipCard:active{transform:scale(.96);}
  @keyframes denyShake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}
  .shipCard canvas{width:44px; height:44px;}
  .shipClassTag{font-size:8px; letter-spacing:1.5px; color:var(--dim);}

  /* Bestiary */
  #bestiaryGrid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:var(--s2);
    width:100%; max-width:min(360px, calc(100vw - 40px));
  }
  .beastCard{
    border:1px solid rgba(90,106,147,.35); border-radius:4px; padding:var(--s2);
    background:rgba(13,18,38,.5); display:flex; gap:var(--s2); align-items:flex-start;
    text-align:left; min-width:0;
  }
  .beastCard.undiscovered{opacity:.45;}
  .beastCard canvas{flex:0 0 auto; width:34px; height:34px;}
  .beastMeta{flex:1 1 auto; min-width:0;}
  .beastName{font-family:'Orbitron',sans-serif; font-size:9.5px; letter-spacing:.5px; color:var(--ink); overflow-wrap:break-word;}
  .beastDesc{font-size:8.5px; color:var(--dim); line-height:1.4; margin-top:2px; overflow-wrap:break-word;}
  .beastKills{font-size:8px; color:var(--amber); letter-spacing:1px; margin-top:3px;}
  .miniBossTag{color:var(--magenta); font-size:8px; letter-spacing:1px;}

  /* Achievements */
  .achRow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    width:100%; box-sizing:border-box; padding:10px 12px;
    border:1px solid rgba(90,106,147,.3); border-radius:4px;
    background:rgba(13,18,38,.45); opacity:.5;
  }
  .achRow.unlocked{opacity:1; border-color:rgba(255,194,75,.4); background:rgba(255,194,75,.05);}
  .achRowInfo{text-align:left; flex:1 1 auto; min-width:0; overflow-wrap:break-word;}
  .achRowName{font-family:'Orbitron',sans-serif; font-size:10.5px; letter-spacing:.5px; color:var(--ink); overflow-wrap:break-word;}
  .achRowDesc{font-size:9px; color:var(--dim); line-height:1.4; margin-top:2px; overflow-wrap:break-word;}
  .achRowReward{font-family:'Orbitron',sans-serif; font-size:10px; color:var(--amber); letter-spacing:1px; flex:0 0 auto; white-space:nowrap;}
  .achProgress{height:3px; border-radius:2px; background:rgba(90,106,147,.3); margin-top:5px; overflow:hidden;}
  .achProgress > div{height:100%; background:var(--amber);}

  #relicOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:var(--s3); background:rgba(7,9,20,.96); z-index:16; padding:var(--s4);
  }
  #relicOverlay h2{font-family:'Orbitron',sans-serif; letter-spacing:4px; font-size:19px; color:var(--violet); margin:0; text-shadow:0 0 16px rgba(190,140,255,.4);}
  #relicOverlay .sub{font-size:10px; color:var(--dim); letter-spacing:1px; margin-top:-10px; text-align:center;}
  #relicOptions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:440px;}
  .relicCard{
    border:1px solid rgba(190,140,255,.45); border-radius:5px; padding:16px 14px; width:132px;
    cursor:pointer; background:rgba(13,18,38,.6); text-align:center;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .relicCard:active{transform:scale(.95); border-color:var(--violet); box-shadow:0 0 16px rgba(190,140,255,.35);}
  .relicIcon{font-size:22px; color:var(--violet); margin-bottom:var(--s2); text-shadow:0 0 10px rgba(190,140,255,.6);}
  .relicName{font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:.5px; color:var(--ink); margin-bottom:5px; line-height:1.4;}
  .relicDesc{font-size:9px; color:var(--dim); line-height:1.4;}

  #achToast{
    /* S238: anchored below the HUD and clamped to the viewport width.
       S241: z-index above every overlay so unlocks fired from inside the
       upgrades/hangar/achievement screens are not hidden behind them. */
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 58px);
    left:50%; transform:translate(-50%,-14px);
    width:max-content; max-width:min(340px, calc(100vw - 32px));
    box-sizing:border-box; overflow-wrap:break-word;
    background:rgba(13,18,38,.97); border:1px solid rgba(255,194,75,.5);
    border-radius:4px; padding:10px 20px; text-align:center;
    z-index:30;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 20px rgba(255,194,75,.25);
  }
  #achToast.show{opacity:1; transform:translate(-50%,0);}

  function sb(blur){
    if(perfLevel()==='low') return 0;
    return blur * quality.blur;
  }
  function particleMult(){
    const tier = perfLevel()==='low' ? 0.5 : (perfLevel()==='high' ? 1.25 : 1);
    return tier * quality.particles;
  }
  function bloomAlpha(){ return quality.bloom; }
  function joystickMult(){ return {small:0.75, medium:1, large:1.3}[save.settings.joystick] || 1; }
  function shakeMult(){
    const s = save.settings.shake;
    return s==='off' ? 0 : (s==='reduced' ? 0.4 : 1);
  }
  function reducedMotion(){ return save.settings.shake==='off'; }

  let W, H, DPR;
  function sizeCanvas(c){
    c.width = Math.max(1, Math.round(W * DPR));
    c.height = Math.max(1, Math.round(H * DPR));
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  }
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, quality.dprCap);
    W = window.innerWidth;
    H = window.innerHeight;
    sizeCanvas(canvas);                       // GL, or the 2D scene on fallback
    sizeCanvas(bgCanvas);
    bgCtx.setTransform(DPR,0,0,DPR,0,0);
    if(GL_ON){
      sizeCanvas(fxCanvas);                   // text overlay above the GL layer
    }
    if(ctx) ctx.setTransform(DPR,0,0,DPR,0,0);
    onResizeBuffers();
  }
  window.addEventListener('resize', () => { resize(); bgDirty = true; });

  // 1.7 / WCAG 2.3.1: a hard ceiling of three large-area luminance flashes in
  // any one-second window. This is a safety floor rather than a preference —
  // it applies no matter what `shake` or `reduceFlash` are set to. Small,
  // local effects (a bullet impact, a pickup sparkle) do not come through here.
  const flashLog = [];
  let flashAlpha = 0;
  function requestFlash(alpha){
    const now = performance.now();
    while(flashLog.length && now - flashLog[0] > 1000) flashLog.shift();
    if(flashLog.length >= 3) return false;
    flashLog.push(now);
    let a = alpha;
    if(save.settings.reduceFlash) a *= 0.35;
    if(reducedMotion()) a *= 0.5;
    flashAlpha = Math.max(flashAlpha, Math.min(a, 0.65));
    return true;
  }

  let shake = 0;
  function addShake(n){ shake = Math.min(shake + n*shakeMult(), 26); }

  function vibrate(ms){
    if(save.settings.haptics && navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
  }

  // --------------------------------------------------------------------------
  // Persistence. The host exposes window.storage; a plain localStorage
  // fallback keeps the file playable when opened directly in a browser.
  // --------------------------------------------------------------------------
  async function rawGet(key){
    if(window.storage && window.storage.get){
      const res = await window.storage.get(key, false);
      return res && res.value ? res.value : null;
    }
    try{ return window.localStorage.getItem(key); }catch(e){ return null; }
  }
  async function rawSet(key, value){
    if(window.storage && window.storage.set){ await window.storage.set(key, value, false); return; }
    try{ window.localStorage.setItem(key, value); }catch(e){}
  }
  let persistQueued = false;
  async function persistSave(){
    // Coalesce bursts (an achievement unlock can fire several writes in one
    // frame) into a single write on the next tick.
    if(persistQueued) return;
    persistQueued = true;
    setTimeout(async () => {
      persistQueued = false;
      try{ await rawSet(SAVE_KEY, JSON.stringify(save)); }catch(e){}
    }, 0);
  }

  // --------------------------------------------------------------------------
  // Audio — procedural, zero assets, and strictly no music.
  //
  // 13.2 is a hard constraint: there is no background score, no ambient drone,
  // no pad and no looping bed anywhere in this file. Every voice created below
  // is a short one-shot tied to a discrete event, with an explicit stop time,
  // so it fully decays before the next unrelated cue. Escalation is expressed
  // through the RATE and DENSITY of those one-shots (13.3), never through
  // anything that sustains between events.
  // --------------------------------------------------------------------------
  let actx = null, masterGain = null, voices = 0;
  const MAX_VOICES = 18;

  function ensureAudio(){
    if(actx) return actx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.9;
      // Keeps a dense wave of simultaneous one-shots from clipping. It is a
      // dynamics stage on discrete cues, not a sustained layer.
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 6; comp.release.value = 0.15;
      masterGain.connect(comp); comp.connect(actx.destination);
    }catch(e){ actx = null; }
    return actx;
  }

  /** 13.7 / Section 5: Android WebView inherits Chrome's autoplay policy, so a
      freshly created AudioContext stays suspended until a user gesture resumes
      it. This listens on the document in the capture phase, so the very first
      tap unlocks audio wherever it lands — the settings gear, a ship card, the
      menu background — not only the LAUNCH button. */
  function unlockAudio(){
    const c = ensureAudio();
    if(c && c.state === 'suspended'){ c.resume().catch(()=>{}); }
  }
  ['pointerdown','touchstart','mousedown','keydown','click'].forEach(ev => {
    document.addEventListener(ev, unlockAudio, {capture:true, passive:true});
  });

  /** One short, self-terminating voice. Every SFX in the game is built from
      this and stops at an explicit time. */
  function tone(opts){
    if(!actx || save.settings.muted) return;
    if(voices >= MAX_VOICES) return;
    const t0 = actx.currentTime + (opts.delay || 0);
    const dur = Math.max(0.02, opts.dur || 0.1);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(Math.max(20, opts.freq), t0);
    if(opts.slideTo){
      o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slideTo), t0 + dur);
    }
    const vol = Math.max(0.0005, (opts.vol == null ? 0.06 : opts.vol));
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.012, dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if(opts.cutoff){
      const f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(opts.cutoff, t0);
      f.Q.value = opts.q || 1;
      o.connect(f); node = f;
    }
    node.connect(g); g.connect(masterGain);
    voices++;
    o.onended = () => { voices = Math.max(0, voices - 1); };
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  /** Short filtered noise burst — used for impacts and debris so hits do not
      all read as pitched blips. Buffer is built once and reused. */
  let noiseBuf = null;
  function noise(opts){
    if(!actx || save.settings.muted) return;
    if(voices >= MAX_VOICES) return;
    if(!noiseBuf){
      const len = Math.floor(actx.sampleRate * 0.4);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    }
    const t0 = actx.currentTime + (opts.delay || 0);
    const dur = Math.max(0.02, opts.dur || 0.12);
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = opts.hp ? 'highpass' : 'lowpass';
    f.frequency.setValueAtTime(opts.cutoff || 900, t0);
    f.Q.value = opts.q || 0.8;
    const g = actx.createGain();
    const vol = Math.max(0.0005, opts.vol == null ? 0.05 : opts.vol);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    voices++;
    src.onended = () => { voices = Math.max(0, voices - 1); };
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  // 13.4 / 13.5: one voice profile per faction, combined with a role (spawn /
  // attack / death) rather than seventy bespoke sound effects. Timbre and
  // register differ per faction, not merely pitch of one shared voice.
  const FACTION_VOICE = {
    drifter_swarm: {type:'square',   base:210, glide:0.55, cut:1400, grit:0.9},
    void_cult:     {type:'sine',     base:330, glide:1.9,  cut:900,  grit:0.35},
    iron_legion:   {type:'sawtooth', base:150, glide:0.7,  cut:2600, grit:1.0},
    crystal_bloom: {type:'triangle', base:470, glide:1.35, cut:1800, grit:0.5},
    solar_wraiths: {type:'sawtooth', base:640, glide:1.6,  cut:3400, grit:0.7},
    abyssal_deep:  {type:'sine',     base:78,  glide:0.5,  cut:520,  grit:1.0},
    aberrant_prime:{type:'square',   base:390, glide:2.4,  cut:2200, grit:0.8}
  };
  function voiceOf(factionId){ return FACTION_VOICE[factionId] || FACTION_VOICE.drifter_swarm; }

  /** 13.3: escalation multiplier. Rises with wave tier, combo streak and boss
      phase; used to lift the register slightly and to allow one extra layered
      one-shot on a heavy event. Never introduces a sustained layer. */
  function sfxIntensity(){
    const tierPart = Math.min(activeTier() / 7, 1);
    const comboPart = Math.min(combo / 40, 1);
    const bossPart = (boss && boss.phase >= 2) ? 0.35 : 0;
    return Math.min(1, tierPart*0.5 + comboPart*0.35 + bossPart);
  }

  function sfxShoot(){
    const i = sfxIntensity();
    tone({freq:600 + i*180, dur:0.055, type:'square', vol:0.03, slideTo:880 + i*260});

  function sfxHit(){

  function sfxPower(){ tone({freq:440, dur:0.2, type:'sine', vol:0.075, slideTo:1120}); }
  function sfxCombo(){

  }
  function sfxDash(){ tone({freq:300, dur:0.11, type:'sine', vol:0.05, slideTo:720}); noise({dur:0.09, cutoff:2600, vol:0.03, hp:true}); }
  function sfxUI(){ tone({freq:520, dur:0.045, type:'triangle', vol:0.035, slideTo:660}); }
  function sfxDeny(){ tone({freq:180, dur:0.12, type:'square', vol:0.05, slideTo:120}); }
  function sfxUltimate(){
    tone({freq:180, dur:0.42, type:'sawtooth', vol:0.1, slideTo:900});
    tone({freq:360, dur:0.4, type:'sine', vol:0.06, slideTo:1400, delay:0.03});
    noise({dur:0.34, cutoff:1800, vol:0.07});
  }

  function sfxSpawn(factionId){
    const v = voiceOf(factionId), i = sfxIntensity();
    tone({freq:v.base*(0.85 + i*0.25), dur:0.09, type:v.type, vol:0.024,
          slideTo:v.base*v.glide, cutoff:v.cut});
  }
  function sfxAttack(factionId){
    const v = voiceOf(factionId), i = sfxIntensity();
    tone({freq:v.base*1.5*(1 + i*0.18), dur:0.07, type:v.type, vol:0.03,

  function sfxDeath(factionId, big){
    const v = voiceOf(factionId), i = sfxIntensity();
    tone({freq:v.base*(big?0.55:0.9), dur:big?0.34:0.16, type:v.type,
          vol:big?0.1:0.055, slideTo:v.base*0.3, cutoff:v.cut});
    noise({dur:big?0.3:0.13, cutoff:big?700:1500, vol:(big?0.08:0.045)*v.grit});
    // Denser wave / higher combo layers one extra one-shot rather than
    // turning anything on continuously.
    if(big || i > 0.55){
      tone({freq:v.base*1.9, dur:0.1, type:'triangle', vol:0.03,
            slideTo:v.base*0.8, delay:0.035});
    }
  }
  /** 13.3/13.6: one-shot stinger for a tier change or boss phase change, with
      the deliberate silence around it coming from the caller. */
  function sfxStinger(step){
    const f = 300 + step*90;
    tone({freq:f, dur:0.14, type:'triangle', vol:0.07, slideTo:f*2.2});
    tone({freq:f*1.5, dur:0.2, type:'sine', vol:0.05, slideTo:f*3, delay:0.07});
  }

  // --------------------------------------------------------------------------
  // 2.1 Object pools. With seventy archetypes, projectiles from both sides and
  // dense particle work, allocating fresh object literals every frame is what
  // turns into GC stutter on a mid-range phone. Everything below is
  // pre-allocated once and recycled by swapping the dead entry with the last
  // live one and shrinking the active count — never .splice() in the hot loop.
  // --------------------------------------------------------------------------
  function Pool(cap, make){
    this.items = new Array(cap);
    for(let i=0;i<cap;i++) this.items[i] = make();
    this.n = 0; this.cap = cap; this.rr = 0;
  }
  Pool.prototype.acquire = function(){
    if(this.n >= this.cap) return null;   // pool exhausted: drop the spawn
    return this.items[this.n++];
  };
  /** For entries where dropping the spawn would look worse than losing an old
      one (particles, enemy bullets): recycle round-robin instead of dropping. */
  Pool.prototype.acquireOrRecycle = function(){
    if(this.n < this.cap) return this.items[this.n++];
    if(this.n === 0) return null;
    this.rr = (this.rr + 1) % this.n;
    return this.items[this.rr];
  };
  Pool.prototype.releaseAt = function(i){
    const last = --this.n;
    if(i !== last){
      const tmp = this.items[i];
      this.items[i] = this.items[last];
      this.items[last] = tmp;
    }
  };
  Pool.prototype.clear = function(){ this.n = 0; };

  const MAX_BULLETS = 260, MAX_EBULLETS = 460, MAX_PARTICLES = 560;
  const MAX_ENEMIES = 130, MAX_POPUPS = 56, MAX_POWERUPS = 26;
  const MAX_SHOCKWAVES = 28, MAX_LIGHTS = 36;
  const TRAIL_LEN = 8;

  const bullets = new Pool(MAX_BULLETS, () => ({
    x:0,y:0,vx:0,vy:0,life:0,homing:false,pierce:0,dmg:1,r:2.6,
    fromDrone:false,splash:0,crit:false,warp:0
  }));
  const enemyBullets = new Pool(MAX_EBULLETS, () => ({
    x:0,y:0,vx:0,vy:0,life:0,r:3,color:'#ff5fb0',homing:0,curve:0,dmg:1,glyph:0
  }));
  const particles = new Pool(MAX_PARTICLES, () => ({
    x:0,y:0,vx:0,vy:0,life:0,maxLife:1,color:'#fff',r:1,drag:0.96,hot:false
  }));
  const popups = new Pool(MAX_POPUPS, () => ({x:0,y:0,text:'',life:0,color:'#eaf2ff',scale:1}));
  const powerups = new Pool(MAX_POWERUPS, () => ({x:0,y:0,vx:0,vy:0,type:'rapid',r:12,pulse:0,life:0,ttl:0}));
  const shockwaves = new Pool(MAX_SHOCKWAVES, () => ({x:0,y:0,r:0,maxR:1,life:0,maxLife:1,color:'#fff',width:2}));
  // 3.2 Dynamic point lights: each explosion or heavy impact registers one of
  // these, drawn as an additive radial gradient under the gameplay layer so
  // nearby silhouettes tint toward the blast for a couple of frames.
  const lights = new Pool(MAX_LIGHTS, () => ({x:0,y:0,r:0,color:'#fff',intensity:0,decay:0.08}));

  const enemies = new Pool(MAX_ENEMIES, () => ({
    active:false, def:null, faction:'drifter_swarm',
    x:0, y:0, vx:0, vy:0, r:10, hp:1, maxHp:1, hue:200,
    rot:0, vr:0, verts:null, scale:1, squash:0, flash:0,
    t:0, fireTimer:0, phase:0, seed:0, state:0, stateTimer:0,
    shieldHp:0, maxShieldHp:0, cloak:0, alpha:1, telegraph:0,
    ax:0, ay:0, anchorX:0, anchorY:0, linkTo:null, ownerId:0, spawnT:0,
    trailX:null, trailY:null, trailN:0,
    growth:0, tag:0, auraBuff:0, ringCount:0, grazed:0, dmgMul:1, immuneTo:0,
    isBoss:false, phaseIdx:0
  }));

  function particleCap(){
    return Math.max(80, Math.round(MAX_PARTICLES * (perfLevel()==='low' ? 0.4 : 1) * quality.particles));
  }

  // --------------------------------------------------------------------------
  // 2.2 Broad-phase collision via a uniform spatial grid, rebuilt each frame.
  // Buckets are pre-allocated and reused; a generation stamp avoids clearing
  // the whole structure every frame. Cells are sized to roughly twice the
  // largest hitbox in play.
  // --------------------------------------------------------------------------
  const grid = { cell:96, cols:0, rows:0, buckets:[], stamp:[], gen:0, w:0, h:0 };
  // Rotating query buffers: nearEnemies() can legitimately be re-entered
  // (a kill inside a bullet's own iteration runs a chain-relic query), and a
  // single shared scratch array would corrupt the outer loop's list.
  const GRID_BUFS = [[],[],[],[],[],[]];
  let gridBufI = 0;
  const GRID_MIN_ENTITIES = 20;   // below this, pairwise is cheaper than bucketing
  let gridActive = false;

  function gridEnsure(){
    const cols = Math.max(1, Math.ceil(W / grid.cell)) + 2;
    const rows = Math.max(1, Math.ceil(H / grid.cell)) + 2;
    if(cols === grid.cols && rows === grid.rows) return;
    grid.cols = cols; grid.rows = rows;
    const total = cols*rows;
    grid.buckets = new Array(total);
    grid.stamp = new Int32Array(total);
    for(let i=0;i<total;i++) grid.buckets[i] = [];
    grid.gen = 1;
  }
  function cellX(x){ const c = Math.floor(x/grid.cell) + 1; return c < 0 ? 0 : (c >= grid.cols ? grid.cols-1 : c); }
  function cellY(y){ const c = Math.floor(y/grid.cell) + 1; return c < 0 ? 0 : (c >= grid.rows ? grid.rows-1 : c); }

  function gridBuild(){
    gridActive = enemies.n > GRID_MIN_ENTITIES;
    if(!gridActive) return;
    // Retune the cell to the largest live hitbox so a wave of Leviathan Spawn
    // does not spill across a dozen cells each.
    let maxR = 24;
    for(let i=0;i<enemies.n;i++){ const e = enemies.items[i]; if(e.r > maxR) maxR = e.r; }
    const want = Math.max(64, Math.min(220, Math.round(maxR*2)));
    if(Math.abs(want - grid.cell) > 24){ grid.cell = want; grid.cols = 0; }
    gridEnsure();
    grid.gen++;
    for(let i=0;i<enemies.n;i++){
      const e = enemies.items[i];
      const k = cellY(e.y)*grid.cols + cellX(e.x);
      if(grid.stamp[k] !== grid.gen){ grid.stamp[k] = grid.gen; grid.buckets[k].length = 0; }
      grid.buckets[k].push(e);
    }
  }
  /** Single call site for "which enemies are near this point". Uses the grid
      once concurrent counts justify it and falls back to a direct scan below
      that threshold, so there is one collision entry point rather than two. */
  function nearEnemies(x, y, r){
    gridBufI = (gridBufI + 1) % GRID_BUFS.length;
    const out = GRID_BUFS[gridBufI];
    out.length = 0;
    if(!gridActive){
      for(let i=0;i<enemies.n;i++) out.push(enemies.items[i]);
      return out;
    }
    const x0 = cellX(x-r), x1 = cellX(x+r), y0 = cellY(y-r), y1 = cellY(y+r);
    for(let gy=y0; gy<=y1; gy++){
      const row = gy*grid.cols;
      for(let gx=x0; gx<=x1; gx++){
        const k = row + gx;
        if(grid.stamp[k] !== grid.gen) continue;
        const b = grid.buckets[k];
        for(let i=0;i<b.length;i++) out.push(b[i]);
      }
    }
    return out;
  }

  // --------------------------------------------------------------------------
  // Entity utilities
  // --------------------------------------------------------------------------
  function onScreen(x, y, pad){
    const p = pad || 0;
    return x > -p && x < W + p && y > -p && y < H + p;
  }
  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
  function angDiff(a, b){
    let d = a - b;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    return d;
  }
  function rand(a, b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

  function spawnParticles(x, y, color, n, spd, life, hot){
    n = Math.max(1, Math.round(n * particleMult()));
    const cap = particleCap();
    for(let i=0;i<n;i++){
      if(particles.n >= cap) break;
      const p = particles.acquireOrRecycle();
      if(!p) break;
      const ang = Math.random()*Math.PI*2;
      const v = Math.random()*(spd||3) + 0.5;
      p.x = x; p.y = y;
      p.vx = Math.cos(ang)*v; p.vy = Math.sin(ang)*v;
      p.life = p.maxLife = (life || 40);
      p.color = color; p.r = Math.random()*2.5 + 1;
      p.drag = 0.96; p.hot = !!hot;
    }
  }
  function spawnShockwave(x, y, maxR, color, life, width){
    const s = shockwaves.acquire();
    if(!s) return;
    s.x = x; s.y = y; s.r = 0; s.maxR = maxR;
    s.life = s.maxLife = life || 22;
    s.color = color; s.width = width || 2;
  }
  function addLight(x, y, color, intensity, radius, decay){
    if(bloomAlpha() <= 0) return;
    const l = lights.acquireOrRecycle();
    if(!l) return;
    l.x = x; l.y = y; l.color = color;
    l.intensity = intensity; l.r = radius; l.decay = decay || 0.09;
  }
  function popup(x, y, text, color, scale){
    const p = popups.acquireOrRecycle();
    if(!p) return;
    p.x = x; p.y = y; p.text = text; p.life = 50;
    p.color = color || '#eaf2ff'; p.scale = scale || 1;
  }

  // --------------------------------------------------------------------------
  // 2.9 / Section 6: content is DATA. Seventy enemies, forty-five ships, sixty
  // upgrades and fifty achievements are config objects that key into a small
  // number of shared library functions — never one hardcoded branch each.
  // --------------------------------------------------------------------------

  // Appendix A palette. Each faction owns a wave-tier band, a colour identity,
  // a background atmosphere (3.4) and a sonic identity (13.4).
  const FACTIONS = [
    {id:'drifter_swarm',  name:'DRIFTER SWARM',  nameAr:'سرب الطوّافين', tiers:[1,2],

     nebula:['#2a1c08','#3a2410'], star:'#ffe0a8', motif:'rock'},
    {id:'void_cult',      name:'VOID CULT',      nameAr:'طائفة الخواء', tiers:[2,3],
     hue:272, ink:'#be8cff', grade:'rgba(150,90,255,0.06)',
     nebula:['#1a0b2e','#25123f'], star:'#e0c8ff', motif:'portal'},
    {id:'iron_legion',    name:'IRON LEGION',    nameAr:'الفيلق الحديدي', tiers:[3,4],
     hue:189, ink:'#3df0ff', grade:'rgba(60,190,255,0.05)',
     nebula:['#08202a','#0d2f3d'], star:'#cfe9ff', motif:'plate'},
    {id:'crystal_bloom',  name:'CRYSTAL BLOOM',  nameAr:'الإزهار البلوري', tiers:[4,5],
     hue:150, ink:'#78ffaa', grade:'rgba(80,255,180,0.05)',
     nebula:['#07281c','#0b3a2a'], star:'#c8ffe4', motif:'spore'},
    {id:'solar_wraiths',  name:'SOLAR WRAITHS',  nameAr:'أشباح الشمس', tiers:[5,6],
     hue:44,  ink:'#ffd98a', grade:'rgba(255,210,120,0.07)',
     nebula:['#3a2a05','#4d3a10'], star:'#fff4d8', motif:'flare'},
    {id:'abyssal_deep',   name:'ABYSSAL DEEP',   nameAr:'العمق السحيق', tiers:[6,7],
     hue:214, ink:'#6fa0ff', grade:'rgba(20,40,110,0.10)',
     nebula:['#050a1a','#0a1230'], star:'#8fb4ff', motif:'pressure'},
    {id:'aberrant_prime', name:'ABERRANT PRIME', nameAr:'الشاذّ الأعظم', tiers:[7,99],
     hue:-1,  ink:'#ff6fd8', grade:'rgba(255,90,200,0.06)',
     nebula:['#180a22','#2a0f28'], star:'#ffd0f4', motif:'glitch'}
  ];
  const FACTION_BY_ID = {};
  FACTIONS.forEach(f => { FACTION_BY_ID[f.id] = f; });
  function factionOf(id){ return FACTION_BY_ID[id] || FACTIONS[0]; }

  // Shape vocabulary (4.4 / 1.7): every faction reads as a distinct silhouette
  // as well as a distinct hue, so colour is never the only signal.
  const SILHOUETTE = {
    rock:0, portal:1, plate:2, spore:3, flare:4, pressure:5, glitch:6
  };

  // ==========================================================================
  // Movement library. Every entry is dt-scaled (2.3) — nothing here advances
  // by a bare frame count, so a 90Hz panel plays the same game as a 60Hz one.
  // ==========================================================================
  const MOVEMENTS = {
    drift(e, dt){
      e.x += e.vx*dt; e.y += e.vy*dt;
      wrapEnemy(e);
    },
    tumble(e, dt){
      e.x += e.vx*dt; e.y += e.vy*dt;
      e.rot += e.vr*dt;
      wrapEnemy(e);
    },
    seek(e, dt){
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      const cur = Math.atan2(e.vy, e.vx);
      const turn = 0.045*dt;
      const na = cur + clamp(angDiff(a, cur), -turn, turn);
      const sp = Math.hypot(e.vx, e.vy) || e.def.speed;
      e.vx = Math.cos(na)*sp; e.vy = Math.sin(na)*sp;
      e.x += e.vx*dt; e.y += e.vy*dt;
      e.rot = na;
      wrapEnemy(e);
    },
    chase_slow(e, dt){
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      e.vx += Math.cos(a)*0.012*dt; e.vy += Math.sin(a)*0.012*dt;
      const sp = Math.hypot(e.vx, e.vy), mx = e.def.speed;
      if(sp > mx){ e.vx = e.vx/sp*mx; e.vy = e.vy/sp*mx; }
      e.x += e.vx*dt; e.y += e.vy*dt;
      e.rot += e.vr*0.3*dt;
      wrapEnemy(e);
    },
    erratic_dart(e, dt){
      e.stateTimer -= dt;
      if(e.stateTimer <= 0){
        const a = Math.atan2(player.y-e.y, player.x-e.x) + rand(-1.5, 1.5);
        const burst = e.def.speed*2.6;
        e.vx = Math.cos(a)*burst; e.vy = Math.sin(a)*burst;
        e.stateTimer = rand(16, 34);
        e.squash = 0.5;
      }
      e.vx *= Math.pow(0.93, dt); e.vy *= Math.pow(0.93, dt);
      e.x += e.vx*dt; e.y += e.vy*dt;
      wrapEnemy(e);
    },
    stationary(e, dt){
      e.rot += e.vr*dt;
      // Stationary units still get nudged out of the very edge so they are
      // never unreachable behind the HUD.
      e.x = clamp(e.x, e.r+6, W-e.r-6);
      e.y = clamp(e.y, e.r+40, H-e.r-6);
    },
    spin_in_place(e, dt){
      e.rot += (e.vr + 0.02)*dt;
      e.x += e.vx*0.15*dt; e.y += e.vy*0.15*dt;
      wrapEnemy(e);
    },
    flock(e, dt){
      // Cheap boids: cohesion toward the swarm centre + separation from the
      // nearest neighbour + attraction to the player. Neighbours come from the
      // spatial grid, so this stays local rather than all-pairs.
      let cx=0, cy=0, n=0, sx=0, sy=0;
      const near = nearEnemies(e.x, e.y, 70);
      for(let i=0;i<near.length;i++){
        const o = near[i];
        if(o === e || o.faction !== e.faction) continue;
        const dx = o.x-e.x, dy = o.y-e.y;
        const d2 = dx*dx + dy*dy;
        if(d2 > 4900) continue;
        cx += o.x; cy += o.y; n++;
        if(d2 < 640 && d2 > 0.01){ const d = Math.sqrt(d2); sx -= dx/d; sy -= dy/d; }
      }
      if(n > 0){
        const ax = (cx/n - e.x)*0.0012, ay = (cy/n - e.y)*0.0012;
        e.vx += ax*dt; e.vy += ay*dt;
      }
      e.vx += sx*0.05*dt; e.vy += sy*0.05*dt;
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      e.vx += Math.cos(a)*0.022*dt; e.vy += Math.sin(a)*0.022*dt;
      e.vx += rand(-0.12,0.12)*dt; e.vy += rand(-0.12,0.12)*dt;
      const sp = Math.hypot(e.vx,e.vy), mx = e.def.speed*1.7;
      if(sp > mx){ e.vx = e.vx/sp*mx; e.vy = e.vy/sp*mx; }
      e.x += e.vx*dt; e.y += e.vy*dt;
      wrapEnemy(e);
    },
    orbit_cluster(e, dt){
      e.t += 0.03*dt;
      e.anchorX += e.vx*dt; e.anchorY += e.vy*dt;
      const rad = 26 + e.phase*3;
      e.x = e.anchorX + Math.cos(e.t + e.phase*2.1)*rad;
      e.y = e.anchorY + Math.sin(e.t + e.phase*2.1)*rad;
      if(e.anchorX < -80) e.anchorX = W+80; if(e.anchorX > W+80) e.anchorX = -80;
      if(e.anchorY < -80) e.anchorY = H+80; if(e.anchorY > H+80) e.anchorY = -80;
    },
    orbit_player(e, dt){
      e.t += 0.016*dt;
      const want = 190 + Math.sin(e.t*0.6 + e.seed)*40;
      const dx = e.x-player.x, dy = e.y-player.y;
      let d = Math.hypot(dx,dy) || 1;
      const a = Math.atan2(dy,dx) + (0.011*dt)*(e.seed > 0.5 ? 1 : -1);
      d += (want - d)*0.035*dt;
      e.x = player.x + Math.cos(a)*d;
      e.y = player.y + Math.sin(a)*d;
      e.x = clamp(e.x, e.r, W-e.r); e.y = clamp(e.y, e.r+30, H-e.r);
      e.rot = a + Math.PI;
    },
    blink(e, dt){
      e.stateTimer -= dt;
      if(e.state === 0){
        e.alpha = Math.min(1, e.alpha + 0.06*dt);
        if(e.stateTimer <= 0){ e.state = 1; e.stateTimer = 14; e.telegraph = 1; }
      } else {
        e.alpha = Math.max(0.05, e.alpha - 0.09*dt);
        if(e.stateTimer <= 0){
          const a = Math.atan2(player.y-e.y, player.x-e.x) + rand(-1.2,1.2);
          const hop = rand(90, 180);
          e.x = clamp(e.x + Math.cos(a)*hop, e.r, W-e.r);
          e.y = clamp(e.y + Math.sin(a)*hop, e.r+40, H-e.r);
          e.state = 0; e.stateTimer = rand(50, 90); e.telegraph = 0;
          e.squash = 0.6;
          spawnParticles(e.x, e.y, 'rgba(190,140,255,0.8)', 8, 2.4, 22);
        }
      }
    },
    dive(e, dt){
      if(e.state === 0){
        // 1.3 anticipation: hold and flare before committing.
        e.telegraph += dt;
        e.x += e.vx*0.25*dt; e.y += e.vy*0.25*dt;
        if(e.telegraph > 34){
          const a = Math.atan2(player.y-e.y, player.x-e.x);
          const sp = e.def.speed*3.4;
          e.vx = Math.cos(a)*sp; e.vy = Math.sin(a)*sp;
          e.rot = a; e.state = 1; e.telegraph = 0; e.squash = 0.8;
          sfxAttack(e.faction);
        }
      } else {
        e.x += e.vx*dt; e.y += e.vy*dt;
        pushTrail(e);
        if(!onScreen(e.x, e.y, 140)){ e.state = 0; e.telegraph = 0; wrapEnemy(e); }
      }
    },
    hover_advance(e, dt){
      const line = 120 + (e.seed*0.5)*H*0.35;
      if(e.y < line){ e.y += e.def.speed*dt; }
      else { e.y += Math.sin(e.t*0.04)*0.3*dt; }
      e.t += dt;
      e.x += Math.sin(e.t*0.02 + e.seed*6)*e.def.speed*0.5*dt;
      e.x = clamp(e.x, e.r, W-e.r);
      e.rot = Math.PI/2;
    },
    strafe(e, dt){
      e.t += dt;
      e.y += e.def.speed*0.35*dt;
      e.x += Math.cos(e.t*0.05 + e.seed*6)*e.def.speed*1.4*dt;
      if(e.y > H + 60){ e.y = -60; e.x = rand(40, W-40); }
      e.x = clamp(e.x, e.r, W-e.r);
    },
    wander(e, dt){
      e.t += dt;
      e.vx += Math.cos(e.t*0.03 + e.seed*7)*0.02*dt;
      e.vy += Math.sin(e.t*0.026 + e.seed*4)*0.02*dt;
      const sp = Math.hypot(e.vx,e.vy), mx = e.def.speed;
      if(sp > mx){ e.vx = e.vx/sp*mx; e.vy = e.vy/sp*mx; }
      e.x += e.vx*dt; e.y += e.vy*dt;
      wrapEnemy(e);
    },
    trail_drift(e, dt){
      e.x += e.vx*dt; e.y += e.vy*dt;
      e.rot += e.vr*dt;
      pushTrail(e);
      e.t += dt;
      if(e.t > 12){
        e.t = 0;
        // A lingering hazard left along its own flight path.
        spawnHazard(e.x, e.y, e.def.hue, 130, e.def.contactDmg);
      }
      wrapEnemy(e);
    },
    mirror_twin(e, dt){
      const twin = e.linkTo;
      if(twin && twin.active && twin.hp > 0){
        // The pair mirrors across the arena's vertical centre line.
        MOVEMENTS.strafe(e, dt);
        twin.x = W - e.x; twin.y = e.y; twin.rot = -e.rot;
      } else {
        MOVEMENTS.strafe(e, dt);
      }
    },
    escort(e, dt){
      // Repair Drones and Bathyspheres spawn alone as often as they spawn in a
      // group, so an escort with no host adopts the nearest same-faction unit
      // instead of quietly degrading into a plain chaser.
      if((!e.linkTo || !e.linkTo.active) && e.stateTimer <= 0){
        e.stateTimer = 40;
        const near = nearEnemies(e.x, e.y, 260);
        let best = null, bd = Infinity;
        for(let i=0;i<near.length;i++){
          const o = near[i];
          if(o === e || !o.active || o.faction !== e.faction) continue;
          if(o.def.movement === 'escort') continue;
          const d = Math.hypot(o.x-e.x, o.y-e.y);
          if(d < bd){ bd = d; best = o; }
        }
        if(best) e.linkTo = best;
      }
      e.stateTimer -= dt;
      const host = e.linkTo;
      if(host && host.active && host.hp > 0){
        const a = Math.atan2(player.y-host.y, player.x-host.x);
        const tx = host.x + Math.cos(a)*(host.r + e.r + 10);
        const ty = host.y + Math.sin(a)*(host.r + e.r + 10);
        e.x += (tx-e.x)*0.08*dt; e.y += (ty-e.y)*0.08*dt;
        e.rot = a;
      } else {
        MOVEMENTS.seek(e, dt);
      }
    },
    vine_grow(e, dt){
      // Extends from its anchor over time, walling off a lane.
      e.growth = Math.min(1, e.growth + 0.0035*dt);
      e.r = e.def.radius * (0.4 + e.growth*0.6);
      e.t += dt;
      e.x = e.anchorX + Math.sin(e.t*0.014)*30*e.growth;
      e.y = e.anchorY + e.growth*Math.min(210, H*0.3);
    },
    cloak_stalk(e, dt){
      const d = Math.hypot(player.x-e.x, player.y-e.y);
      if(d > e.def.radius*8 && e.state === 0){
        e.alpha = Math.max(0.06, e.alpha - 0.05*dt);
        MOVEMENTS.wander(e, dt);
      } else {
        if(e.state === 0){
          e.state = 1; e.telegraph = 0; e.squash = 0.9;
          sfxAttack(e.faction);
        }
        e.alpha = Math.min(1, e.alpha + 0.12*dt);
        e.telegraph += dt;
        if(e.telegraph > 18){
          const a = Math.atan2(player.y-e.y, player.x-e.x);
          e.vx += Math.cos(a)*0.18*dt; e.vy += Math.sin(a)*0.18*dt;
          const sp = Math.hypot(e.vx,e.vy), mx = e.def.speed*3;
          if(sp > mx){ e.vx = e.vx/sp*mx; e.vy = e.vy/sp*mx; }
        }
        e.x += e.vx*dt; e.y += e.vy*dt;
        pushTrail(e);
        wrapEnemy(e);
      }
    },
    phase_shift(e, dt){
      // Readable rhythm: fully solid, then fully untargetable, on a fixed beat
      // the player can learn — never a random dodge of your damage.
      e.t += dt;
      const cyc = (e.t % 190) / 190;
      const solid = cyc < 0.58;
      e.state = solid ? 0 : 1;
      e.alpha = solid ? 1 : 0.22;
      MOVEMENTS.strafe(e, dt);
    },
    glitch_hop(e, dt){
      e.stateTimer -= dt;
      if(e.stateTimer <= 0){
        e.x = clamp(e.x + rand(-200,200), e.r, W-e.r);
        e.y = clamp(e.y + rand(-160,160), e.r+40, H-e.r);
        e.stateTimer = rand(26, 58);
        e.squash = 0.7;
        spawnParticles(e.x, e.y, 'rgba(255,110,216,0.85)', 6, 3, 16);
      }
      e.rot += 0.08*dt;
    },
    anchor_edge(e, dt){
      // Tethers to the nearest arena edge and stays there.
      if(e.state === 0){
        e.anchorX = e.x < W/2 ? e.r+4 : W-e.r-4;
        e.anchorY = clamp(e.y, e.r+60, H-e.r-20);
        e.state = 1;
      }
      e.x += (e.anchorX-e.x)*0.04*dt;
      e.y += (e.anchorY-e.y)*0.04*dt;
      e.rot += e.vr*0.5*dt;
    }
  };

  function wrapEnemy(e){
    if(e.x < -70) e.x = W+70; else if(e.x > W+70) e.x = -70;
    if(e.y < -70) e.y = H+70; else if(e.y > H+70) e.y = -70;
  }
  /** 3.5 motion trail: a short ring buffer of recent positions, capped, drawn
      as a tapering ribbon. Allocated once with the entity, never per frame. */
  function pushTrail(e){
    if(perfLevel()==='low') return;
    if(!e.trailX){ e.trailX = new Float32Array(TRAIL_LEN); e.trailY = new Float32Array(TRAIL_LEN); }
    e.trailN = (e.trailN + 1) % TRAIL_LEN;
    e.trailX[e.trailN] = e.x; e.trailY[e.trailN] = e.y;
  }

  // Lingering area hazards (ember trails, spore clouds, pollen). Pooled like
  // everything else; they are area-denial, not projectiles.
  const MAX_HAZARDS = 40;
  const hazards = new Pool(MAX_HAZARDS, () => ({x:0,y:0,r:0,life:0,maxLife:1,hue:0,dmg:1,tick:0}));
  function spawnHazard(x, y, hue, life, dmg){
    const h = hazards.acquireOrRecycle();
    if(!h) return;
    h.x = x; h.y = y; h.r = 22; h.life = h.maxLife = life; h.hue = hue;
    h.dmg = dmg || 1; h.tick = 0;
  }

  function fireEnemyBullet(e, ang, speed, opts){
    const b = enemyBullets.acquireOrRecycle();
    if(!b) return null;
    const o = opts || EMPTY;
    b.x = e.x; b.y = e.y;
    b.vx = Math.cos(ang)*speed; b.vy = Math.sin(ang)*speed;
    b.life = o.life || 240;
    b.r = o.r || 3.4;
    b.color = o.color || factionOf(e.faction).ink;
    b.homing = o.homing || 0;
    b.curve = o.curve || 0;
    b.dmg = o.dmg || 1;
    b.glyph = o.glyph || 0;
    return b;
  }
  const EMPTY = {};

  // ==========================================================================
  // Attack library. Every entry telegraphs before it commits (1.3), and every
  // cue routes through the faction voice so the roster stays readable by ear.
  // ==========================================================================
  const ATTACKS = {
    slow_shot(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 16) e.telegraph = 1 - e.fireTimer/16; return; }
      e.telegraph = 0;
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      fireEnemyBullet(e, a, 3.1, {r:3.4});
      e.fireTimer = rand(120, 190);
      sfxAttack(e.faction);
    },
    aimed_shot(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 22) e.telegraph = 1 - e.fireTimer/22; return; }
      e.telegraph = 0;
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      fireEnemyBullet(e, a, 4.2, {r:3.2});
      e.fireTimer = rand(80, 140);
      sfxAttack(e.faction);
    },
    curse_bolt(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 24) e.telegraph = 1 - e.fireTimer/24; return; }
      e.telegraph = 0;
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      fireEnemyBullet(e, a, 2.4, {r:4.2, homing:0.035, life:300, glyph:1});
      e.fireTimer = rand(150, 220);
      sfxAttack(e.faction);
    },
    spread_cone(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 28) e.telegraph = 1 - e.fireTimer/28; return; }
      e.telegraph = 0;
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      for(let i=-2;i<=2;i++) fireEnemyBullet(e, a + i*0.17, 2.7, {r:3});
      e.fireTimer = rand(170, 250);
      sfxAttack(e.faction);
    },
    charge_beam(e, dt){
      if(e.state !== 2){
        e.fireTimer -= dt;
        if(e.fireTimer <= 0){ e.state = 2; e.telegraph = 0; e.ax = 0; }
        return;
      }
      e.telegraph += dt;
      if(e.telegraph < 46){
        // Visible charge; the aim locks at the end of it so the dodge window
        // is real rather than a coin flip.
        e.ax = Math.atan2(player.y-e.y, player.x-e.x);
        return;
      }
      if(e.telegraph < 46 + 34){
        if(e.telegraph < 50) sfxAttack(e.faction);
        // The beam itself is resolved in the collision pass via e.state===2.
        return;
      }
      e.state = 0; e.telegraph = 0; e.fireTimer = rand(200, 300);
    },
    ring_pulse(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 30) e.telegraph = 1 - e.fireTimer/30; return; }
      e.telegraph = 0;
      const n = 12;
      for(let i=0;i<n;i++) fireEnemyBullet(e, (i/n)*Math.PI*2 + e.t*0.01, 2.4, {r:3.2, life:200});
      spawnShockwave(e.x, e.y, 90, factionOf(e.faction).ink, 26, 2);
      e.fireTimer = rand(200, 290);
      sfxAttack(e.faction);
    },
    wide_pulse(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 40) e.telegraph = 1 - e.fireTimer/40; return; }
      e.telegraph = 0;
      // Slow and wide: cannot be outrun on speed alone, only sidestepped.
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      for(let i=-4;i<=4;i++) fireEnemyBullet(e, a + i*0.13, 1.5, {r:5, life:360});
      e.fireTimer = rand(240, 330);
      sfxAttack(e.faction);
    },
    micro_missiles(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 24) e.telegraph = 1 - e.fireTimer/24; return; }
      e.telegraph = 0;
      for(let i=0;i<4;i++){
        fireEnemyBullet(e, rand(0, Math.PI*2), 1.8, {r:2.4, homing:0.05, life:150});
      }
      e.fireTimer = rand(180, 260);
      sfxAttack(e.faction);
    },
    proximity_detonate(e, dt){
      const d = Math.hypot(player.x-e.x, player.y-e.y);
      const trigger = e.def.radius*5.5;
      if(e.state === 0){
        e.telegraph = clamp(1 - (d - trigger)/120, 0, 0.6);
        if(d < trigger){ e.state = 1; e.stateTimer = 34; sfxAttack(e.faction); }
      } else {
        e.stateTimer -= dt;
        e.telegraph = 1 - e.stateTimer/34;
        if(e.stateTimer <= 0){ killEnemy(e, false); }
      }
    },
    self_destruct_low(e, dt){
      if(e.hp <= e.maxHp*0.3 && e.state === 0){
        e.state = 1; e.stateTimer = 40; sfxAttack(e.faction);
      }
      if(e.state === 1){
        e.stateTimer -= dt;
        e.telegraph = 1 - e.stateTimer/40;
        if(e.stateTimer <= 0){ killEnemy(e, false); }
      }
    },
    spawn_minion(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 26) e.telegraph = 1 - e.fireTimer/26; return; }
      e.telegraph = 0;
      const childId = e.def.spawns;
      const def = ENEMY_BY_ID[childId];
      if(def && enemies.n < MAX_ENEMIES - 6){
        const child = spawnEnemy(def, e.x + rand(-26,26), e.y + rand(-26,26));
        if(child) child.ownerId = e.seed;
        sfxSpawn(e.faction);
      }
      e.fireTimer = rand(150, 240);
    },
    bloom_ring(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 30) e.telegraph = 1 - e.fireTimer/30; return; }
      e.telegraph = 0;
      const def = ENEMY_BY_ID[e.def.spawns];
      if(def){
        for(let i=0;i<5 && enemies.n < MAX_ENEMIES-8;i++){
          const a = (i/5)*Math.PI*2;
          const c = spawnEnemy(def, e.x + Math.cos(a)*46, e.y + Math.sin(a)*46);
          if(c) c.ownerId = e.seed;
        }
        sfxSpawn(e.faction);
      }
      e.fireTimer = rand(280, 380);
    },
    heal_aura(e, dt){
      e.t += dt;
      if(e.t < 40) return;
      e.t = 0;
      const near = nearEnemies(e.x, e.y, 150);
      for(let i=0;i<near.length;i++){
        const o = near[i];
        if(o === e || o.hp >= o.maxHp) continue;
        if(Math.hypot(o.x-e.x, o.y-e.y) > 150) continue;
        o.hp = Math.min(o.maxHp, o.hp + 1);
        spawnParticles(o.x, o.y, 'rgba(120,255,170,0.7)', 3, 1.2, 16);
      }
    },
    buff_aura(e, dt){
      // Nearby units fire faster while this survives. Applied as a flag the
      // fire timers read, not as a per-unit stat mutation.
      e.auraBuff = 1;
    },
    shield_aura(e, dt){
      e.tag = 2;
      e.t += dt;
      if(e.t < 30) return;
      e.t = 0;
      const near = nearEnemies(e.x, e.y, 170);
      for(let i=0;i<near.length;i++){
        const o = near[i];
        if(o === e || o.maxShieldHp > 0) continue;
        if(o.faction !== e.faction) continue;
        if(Math.hypot(o.x-e.x, o.y-e.y) > 170) continue;
        o.shieldHp = Math.max(o.shieldHp, 1);
        o.maxShieldHp = Math.max(o.maxShieldHp, 1);
        o.linkTo = e;
      }
    },
    tether(e, dt){
      const d = Math.hypot(player.x-e.x, player.y-e.y);
      if(d < 220){
        e.tag = 3;
        // Brief movement-slow rather than damage, so it teaches spacing.
        applySlow(0.55, 10);
      } else { e.tag = 0; }
    },
    sonar_reveal(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 24) e.telegraph = 1 - e.fireTimer/24; return; }
      e.telegraph = 0;
      spawnShockwave(e.x, e.y, Math.max(W,H)*0.6, '#6fa0ff', 44, 1.6);
      for(let i=0;i<enemies.n;i++){
        const o = enemies.items[i];
        if(o.alpha < 1){ o.alpha = 1; o.stateTimer = Math.min(o.stateTimer, 20); }
      }
      revealTimer = 160;
      e.fireTimer = rand(280, 380);
      sfxAttack(e.faction);
    },
    intercept(e, dt){
      // Actively swats the player's own projectiles out of the air.
      e.t += dt;
      if(e.t < 8) return;
      e.t = 0;
      for(let i=0;i<bullets.n;i++){
        const b = bullets.items[i];
        if(Math.hypot(b.x-e.x, b.y-e.y) < e.r + 22){
          spawnParticles(b.x, b.y, 'rgba(255,217,138,0.9)', 4, 2, 14);
          bullets.releaseAt(i);
          sfxAttack(e.faction);
          break;
        }
      }
    },
    bullet_warp(e, dt){
      // Bends nearby projectiles rather than blocking them.
      for(let i=0;i<bullets.n;i++){
        const b = bullets.items[i];
        const dx = b.x-e.x, dy = b.y-e.y;
        const d2 = dx*dx + dy*dy;
        if(d2 > 24000 || d2 < 1) continue;
        const d = Math.sqrt(d2);
        const f = (1 - d/155) * 0.35 * dt;
        b.vx += (-dy/d)*f; b.vy += (dx/d)*f;
        b.warp = 1;
      }
    },
    flash_burst(e, dt){
      const d = Math.hypot(player.x-e.x, player.y-e.y);
      if(e.state === 0 && d < 210){ e.state = 1; e.stateTimer = 40; }
      if(e.state === 1){
        e.stateTimer -= dt;
        e.telegraph = 1 - e.stateTimer/40;
        if(e.stateTimer <= 0){ killEnemy(e, false); }
      }
    },
    copy_ability(e, dt){
      e.fireTimer -= dt;
      if(e.fireTimer > 0){ if(e.fireTimer < 26) e.telegraph = 1 - e.fireTimer/26; return; }
      e.telegraph = 0;
      // Mirrors the player's most recent ability back at reduced strength.
      const a = Math.atan2(player.y-e.y, player.x-e.x);
      e.tag = lastPlayerAbility;   // read by the Mirror Match achievement
      if(lastPlayerAbility === 'ultimate'){
        for(let i=0;i<10;i++) fireEnemyBullet(e, (i/10)*Math.PI*2, 2.6, {r:3.2});
      } else if(lastPlayerAbility === 'dash'){
        const sp = e.def.speed*3;
        e.vx = Math.cos(a)*sp; e.vy = Math.sin(a)*sp;
      } else {
        for(let i=-1;i<=1;i++) fireEnemyBullet(e, a + i*0.16, 3.4, {r:2.8});
      }
      e.fireTimer = rand(150, 220);
      sfxAttack(e.faction);
    },
    entropy_grow(e, dt){
      // Measurably stronger the longer it is allowed to live.
      e.growth += 0.0009*dt;
      const g = 1 + Math.min(e.growth, 1.4);
      e.scale = g;
      e.r = e.def.radius*g;
      e.dmgMul = g;
      if(e.growth > 0.5 && e.fireTimer <= 0){
        const a = Math.atan2(player.y-e.y, player.x-e.x);
        fireEnemyBullet(e, a, 3.2, {r:3.4});
        e.fireTimer = rand(120, 180);
        sfxAttack(e.faction);
      }
      e.fireTimer -= dt;
    },
    rotate_immunity(e, dt){
      // Immune to exactly one damage type at a time, on a readable rotation.
      e.t += dt;
      e.immuneTo = 1 + (Math.floor(e.t/150) % 3);
    },
    duplicate(e, dt){
      e.t += dt;
      if(e.state === 0 && e.t > 60){
        e.state = 1;
        const def = e.def;
        if(enemies.n < MAX_ENEMIES-4){
          const twin = spawnEnemy(def, e.x + rand(-40,40), e.y + rand(-30,30));
          if(twin){ twin.state = 2; twin.linkTo = e; e.linkTo = twin; }
        }
      }
    }
  };

  // ==========================================================================
  // Death-response library. 1.3 follow-through: debris, shockwaves and light
  // that outlast the hitbox resolving, so nothing switches off mid-explosion.
  // ==========================================================================
  const ONDEATH = {
    small(e){
      spawnParticles(e.x, e.y, `hsla(${e.hue},90%,65%,0.9)`, 10, 2.6, 26, true);
      addLight(e.x, e.y, factionOf(e.faction).ink, 0.5, 90, 0.12);
    },
    burst(e){
      spawnParticles(e.x, e.y, `hsla(${e.hue},90%,65%,0.9)`, 20, 4, 34, true);
      spawnShockwave(e.x, e.y, e.r*3, factionOf(e.faction).ink, 20, 2);
      addLight(e.x, e.y, factionOf(e.faction).ink, 0.8, 130, 0.1);
    },
    split_two(e){
      ONDEATH.burst(e);
      const def = ENEMY_BY_ID[e.def.splitInto];
      if(!def) return;
      // A unit that splits into smaller copies of ITSELF only does so once,
      // otherwise a single Shard Bud is an infinite enemy fountain.
      const selfSplit = def.id === e.def.id;
      if(selfSplit && e.tag === 9) return;
      for(let i=0;i<2 && enemies.n < MAX_ENEMIES-2;i++){
        const c = spawnEnemy(def, e.x + rand(-16,16), e.y + rand(-16,16));
        if(!c) break;
        c.vx = rand(-1.4,1.4); c.vy = rand(-1.4,1.4); c.squash = 0.8;
        if(selfSplit){
          c.tag = 9; c.scale = 0.62; c.r = def.radius*0.62;
          c.hp = c.maxHp = Math.max(1, Math.round(e.maxHp*0.45));
        }
      }
    },
    shrapnel_ring(e){
      ONDEATH.burst(e);
      const n = 8;
      for(let i=0;i<n;i++) fireEnemyBullet(e, (i/n)*Math.PI*2, 3.4, {r:3, life:150, color:'#ff5050'});
      addShake(5);
      spawnShockwave(e.x, e.y, 70, '#ff5050', 22, 2.5);
    },
    homing_sparks(e){
      ONDEATH.burst(e);
      for(let i=0;i<6;i++){
        fireEnemyBullet(e, (i/6)*Math.PI*2, 2.2, {r:2.6, life:110, homing:0.06});
      }
    },
    spore_cloud(e){
      ONDEATH.burst(e);
      spawnHazard(e.x, e.y, e.hue, 190, e.def.contactDmg);
    },
    blast_large(e){
      spawnParticles(e.x, e.y, `hsla(${e.hue},90%,65%,0.95)`, 34, 6, 44, true);
      spawnShockwave(e.x, e.y, 130, factionOf(e.faction).ink, 30, 3.5);
      addLight(e.x, e.y, factionOf(e.faction).ink, 1.1, 200, 0.07);
      addShake(9);
      // Damaging blast, telegraphed by the wind-up in self_destruct_low.
      if(invuln <= 0 && Math.hypot(player.x-e.x, player.y-e.y) < 110) damagePlayer(1);
    },
    recursion(e){
      ONDEATH.burst(e);
      if(e.tag === 9) return;          // already recursed once
      const c = spawnEnemy(e.def, e.x, e.y);
      if(c){ c.tag = 9; c.scale = 0.6; c.r = e.def.radius*0.6; c.hp = c.maxHp = Math.max(1, Math.round(e.maxHp*0.5)); }
    },
    release_shield(e){
      ONDEATH.blast_large(e);
      for(let i=0;i<enemies.n;i++){
        const o = enemies.items[i];
        if(o.linkTo === e){ o.shieldHp = 0; o.maxShieldHp = 0; o.linkTo = null; }
      }
    },
    dissolve_children(e){
      ONDEATH.blast_large(e);
      for(let i=enemies.n-1;i>=0;i--){
        const o = enemies.items[i];
        if(o.ownerId === e.seed && o !== e){
          spawnParticles(o.x, o.y, `hsla(${o.hue},90%,65%,0.8)`, 6, 2, 18);
          releaseEnemyAt(i);
        }
      }
    },
    flash_white(e){
      ONDEATH.burst(e);
      // 1.7: a screen-brightening death still goes through the WCAG limiter.
      requestFlash(0.4);
      spawnShockwave(e.x, e.y, 180, '#ffffff', 26, 3);
    }
  };

  const ENEMY_BY_ID = {};
  ENEMIES.forEach(e => { ENEMY_BY_ID[e.id] = e; });
  const ENEMIES_BY_FACTION = {};
  FACTIONS.forEach(f => { ENEMIES_BY_FACTION[f.id] = ENEMIES.filter(e => e.faction === f.id); });

  // Attacks that need the enemy roster to already be defined (they look
  // archetypes up by id) live here rather than duplicating the table above.
  ATTACKS.devour = function(e, dt){
    e.t += dt;
    if(e.t < 20) return;
    e.t = 0;
    const near = nearEnemies(e.x, e.y, e.r + 60);
    for(let i=0;i<near.length;i++){
      const o = near[i];
      if(o === e || o.isBoss || o.r > 18) continue;
      if(Math.hypot(o.x-e.x, o.y-e.y) > e.r + 26) continue;
      // Swallow it: heal and grow, and let the player see the trade.
      e.hp = Math.min(e.maxHp + 4, e.hp + 2);
      e.maxHp = Math.max(e.maxHp, e.hp);
      e.scale = Math.min(1.8, e.scale + 0.08);
      e.r = e.def.radius*e.scale;
      spawnParticles(o.x, o.y, `hsla(${o.hue},90%,65%,0.8)`, 8, 2.4, 20);
      popup(e.x, e.y - e.r - 8, '+', factionOf(e.faction).ink, 0.9);
      removeEnemy(o);
      sfxAttack(e.faction);
      break;
    }
  };

  ATTACKS.regen_unless_spawn = function(e, dt){
    // Regenerates only while its own spawn ring is still alive, so clearing
    // the adds is the actual mechanic rather than out-damaging a heal.
    let ring = 0;
    for(let i=0;i<enemies.n;i++){ if(enemies.items[i].ownerId === e.seed) ring++; }
    e.ringCount = ring;
    if(ring > 0 && e.hp < e.maxHp){
      e.hp = Math.min(e.maxHp, e.hp + 0.02*dt);
      if(Math.random() < 0.06) spawnParticles(e.x, e.y, 'rgba(120,255,170,0.7)', 2, 1.2, 18);
    }
  };

  ATTACKS.alternate_shield = function(e, dt){
    e.stateTimer -= dt;
    if(e.stateTimer <= 0){
      if(e.shieldHp > 0){
        e.shieldHp = 0; e.maxShieldHp = 0; e.stateTimer = 260;
        showBanner(nm(e.def,'name'), T('miniBoss'));
      } else {
        e.shieldHp = e.maxShieldHp = 6; e.stateTimer = 200;
        sfxAttack(e.faction);
      }
    }
  };

  // 7.5 / Section 8 #70: the capstone cycles one signature attack drawn from
  // every earlier faction, in order, so the fight is a recap of everything the
  // roster has taught rather than a bigger health bar.
  const UNBOUND_CYCLE = ['shrapnel_volley','curse_bolt','spread_cone','bloom_ring','charge_beam','wide_pulse','ring_pulse'];
  ATTACKS.shrapnel_volley = function(e, dt){
    e.fireTimer -= dt;
    if(e.fireTimer > 0){ if(e.fireTimer < 26) e.telegraph = 1 - e.fireTimer/26; return; }
    e.telegraph = 0;
    const n = 9;
    for(let i=0;i<n;i++) fireEnemyBullet(e, (i/n)*Math.PI*2 + rand(-0.2,0.2), 3.0, {r:3.2, color:'#ffc24b'});
    e.fireTimer = rand(150, 210);
    sfxAttack(e.faction);
  };
  ATTACKS.boss_cycle = function(e, dt){
    e.stateTimer -= dt;
    if(e.stateTimer <= 0){
      e.phaseIdx = (e.phaseIdx + 1) % UNBOUND_CYCLE.length;
      e.stateTimer = 300;
      e.fireTimer = 40;
      e.state = 0; e.telegraph = 0;
      // 13.6: a one-shot stinger with deliberate quiet either side of it.
      sfxStinger(e.phaseIdx + 1);
      const f = FACTIONS[e.phaseIdx] || FACTIONS[0];
      e.hue = f.hue < 0 ? (performance.now()*0.06)%360 : f.hue;
      showBanner(nm(e.def,'name'), nm(f,'name'));
    }
    const key = UNBOUND_CYCLE[e.phaseIdx];
    const fn = ATTACKS[key];
    if(fn) fn(e, dt);
  };

  // 12.2: unlocks mix a shard price with a skill milestone, so both the player
  // who grinds and the player who pushes their ceiling can make progress.

  const UPGRADE_BY_ID = {};
  UPGRADES.forEach(u => { UPGRADE_BY_ID[u.id] = u; });
  function upgradeLevel(id){ return save.upgrades[id] || 0; }
  /** Accumulates one upgrade's effect straight from its own config, so the
      price path reads the same declared stat every other system does. */
  function upgradeStatTotal(stat){
    let v = 0;
    for(let i=0;i<UPGRADES.length;i++){
      const u = UPGRADES[i];
      if(u.effect.stat !== stat) continue;
      v += u.effect.perLevel * upgradeLevel(u.id);
    }
    return v;
  }
  function upgradeCost(u, level){
    const disc = 1 - Math.min(0.4, upgradeStatTotal('costDiscount') + shipPassiveDiscount());
    return Math.max(1, Math.round(u.baseCost * Math.pow(u.costMult, level) * disc));
  }
  function shipPassiveDiscount(){
    return getShip(save.selected).passive === 'shop_discount' ? 0.12 : 0;
  }

  // ==========================================================================
  // Section 10 — 50 achievements across 5 categories.
  // One evaluator, fifty data rows: each row names a condition KEY and a goal,
  // and the condition library knows how to read the current value for it. That
  // also gives every row a progress bar for free.
  // ==========================================================================
  const ACH_CATS = [
    {id:'combat',     label:'catCombat'},
    {id:'survival',   label:'catSurvival'},
    {id:'collection', label:'catCollection'},
    {id:'ship',       label:'catShip'},
    {id:'secret',     label:'catSecret'}
  ];

  // Run-scoped and lifetime counters the conditions read.
  let runStats = null;
  function newRunStats(){
    return {
      kills:0, rocks:0, bosses:0, maxCombo:1, powerups:0, grazes:0,
      damageTaken:0, flawlessWaves:0, flawlessStreak:0, waveDamage:0,
      startMs:0, shotsFired:0, firstShotMs:0, oneHpEvents:0,
      upgradesBought:0, overkill:0, chainBest:0, chainTimes:[],
      bossFastest:Infinity, bossNoDamage:0, bossStartMs:0, bossDamage:0,
      wave:1, won:false, mirrorMatch:0, easterEgg:0, nightOwl:0,
      shipId:'vanguard', shipClass:'assault', lowHealthShip:0,
      factionsSeen:{}, deepest:0, revives:0, startBestWave:save.bestWave||0
    };
  }
  let sessionShardsSpent = 0;

  const CONDITIONS = {
    // --- combat
    killsRun:        s => s.kills,
    killsLifetime:   s => save.lifetimeKills,
    overkill:        s => s.overkill,
    chainKills:      s => s.chainBest,
    flawlessWaves:   s => s.flawlessWaves,
    flawlessStreak:  s => s.flawlessStreak,
    bossesRun:       s => s.bosses,
    bossesLifetime:  s => save.lifetimeBosses,
    bossSpeed:       s => (s.bossFastest <= 20000 ? 1 : 0),
    bossNoDamage:    s => s.bossNoDamage,
    comboRun:        s => s.maxCombo,
    untouchedWave:   s => s.flawlessWaves,
    lastStand:       s => (s.won && s.revives > 0) ? 1 : 0,
    // --- survival
    waveRun:         s => s.wave,
    runMinutes:      s => (s.startMs ? (performance.now()-s.startMs)/60000 : 0),
    hardestWin:      s => (s.won && save.difficulty === 'hard') ? 1 : 0,
    beatBest:        s => (s.wave > s.startBestWave) ? 1 : 0,
    winLowHealth:    s => (s.won && s.lowHealthShip) ? 1 : 0,
    reachFaction:    (s,a) => s.factionsSeen[a.key] ? 1 : 0,
    defeatCapstone:  s => save.achievements.__capstone ? 1 : 0,
    // --- collection / economy
    lifetimeShards:  s => save.lifetimeShards,
    categoryMaxed:   s => maxedCategories(),
    allMaxed:        s => allUpgradesMaxed() ? 1 : 0,
    openedUpgrades:  s => save.hintsSeen.openedUpgrades ? 1 : 0,
    spendSession:    s => sessionShardsSpent,
    winNoUpgrades:   s => (s.won && s.upgradesBought === 0 && totalUpgradeLevels() === 0) ? 1 : 0,
    powerupsRun:     s => s.powerups,
    // --- ship mastery
    runWithStarter:  s => (s.shipId === 'vanguard' && s.wave >= 5) ? 1 : 0,
    shipsUnlocked:   s => save.unlocked.length,
    allShips:        s => (save.unlocked.length >= SHIPS.length) ? 1 : 0,
    winWithClass:    (s,a) => (s.won && s.shipClass === a.key) ? 1 : 0,
