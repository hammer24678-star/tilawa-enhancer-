    glWrite++;
  }
  function glAddLight(x, y, radius, intensity, c){
    if(GLR.lightCount >= GL_MAX_LIGHTS) return;
    const i = GLR.lightCount++;
    const d = GLR.lightData;
    d[i*8] = x; d[i*8+1] = y; d[i*8+2] = radius; d[i*8+3] = intensity;
    d[i*8+4] = c[0]; d[i*8+5] = c[1]; d[i*8+6] = c[2];
  }
  function glAddWarp(x, y, radius, strength){
    if(GLR.warpCount >= GL_MAX_WARPS) return;
    const i = GLR.warpCount++;
    const d = GLR.warpData;
    d[i*4] = x; d[i*4+1] = y; d[i*4+2] = radius; d[i*4+3] = strength;
  }

  // --------------------------------------------------------------------------
  // Scene assembly — two ordered phases, lit then additive.
  // --------------------------------------------------------------------------
  function glCollect(sx, sy){
    glReset();
    const lowTier = perfLevel() === 'low';

    // ---- lights ----------------------------------------------------------
    for(let i=0;i<lights.n && GLR.lightCount < GL_MAX_LIGHTS-1;i++){
      const l = lights.items[i];
      glAddLight(l.x+sx, l.y+sy, l.r, clamp(l.intensity, 0, 1.6), cssRGB(l.color));
    }
    // The player's own engine is always a light, so the ship is the brightest
    // thing in its own neighbourhood and casts real falloff onto nearby hulls.
    if(running && player){
      glAddLight(player.x+sx, player.y+sy, 210, 0.8, cssRGB(currentShip.color));
    }

    // ======================= PHASE 1: LIT =================================
    for(let i=0;i<enemies.n;i++){
      const e = enemies.items[i];
      if(!e.active || !onScreen(e.x, e.y, e.r+50)) continue;
      const sh = GL_SHAPE[factionOf(e.faction).motif] || GL_SHAPE.rock;
      const hue = e.def.hue < 0 ? (performance.now()*0.06 + e.seed*40) % 360 : e.hue;
      const c = hslRGB(hue, 0.85, 0.62);
      if(e.isBoss){
        glAddLight(e.x+sx, e.y+sy, e.r*7, 0.85, c);
      } else if(e.telegraph > 0.35 && GLR.lightCount < GL_MAX_LIGHTS-2){
        // The wind-up itself throws light, so a telegraph is visible even
        // when it is off to the side of where you are looking.
        glAddLight(e.x+sx, e.y+sy, e.r*5, 0.55*e.telegraph, c);
      }
      const boost = e.flash > 0 ? 3.2 : 1.0;
      const sq = 1 + e.squash*0.35;
      glPush(e.x+sx, e.y+sy, e.r*sq, e.r/sq, e.rot, (e.seed*0.137) % 1,
             sh[0], sh[1], c[0]*boost, c[1]*boost, c[2]*boost, e.alpha,
             0.17, e.isBoss ? 1.0 : 0.55, 1.0, 1.0);
    }
    if(running && player){
      const c = cssRGB(currentShip.color);
      const stretch = 1 + Math.min(0.35, Math.hypot(player.vx, player.vy)*0.03);
      const rr = player.r + 5;
      const flick = (invuln > 0 && Math.floor(invuln/6)%2 === 0) ? 0.45 : 1.0;
      glPush(player.x+sx, player.y+sy, rr*stretch, rr/stretch, player.a,
             0, SHAPE_SHIP, 0, c[0]*1.4, c[1]*1.4, c[2]*1.4, flick,
             0.20, 0.75, 1.0, 1.0);
      if(decoy){
        glPush(decoy.x+sx, decoy.y+sy, rr, rr, player.a, 0, SHAPE_SHIP, 0,
               c[0], c[1], c[2], 0.4, 0.18, 0.4, 0.6, 1.0);
      }
    }
    for(let i=0;i<powerups.n;i++){
      const p = powerups.items[i];
      if(!onScreen(p.x, p.y, 40)) continue;
      if(p.ttl < 120 && Math.floor(p.ttl/6) % 2 === 0) continue;
      const c = cssRGB(POWER_COLOR[p.type] || '#3df0ff');
      const pulse = 1 + Math.sin(p.pulse)*0.15;
      const a = p.ttl < 240 ? 0.45 + 0.55*(p.ttl/240) : 1;
      glPush(p.x+sx, p.y+sy, p.r*pulse, p.r*pulse, p.pulse*0.4, 0, 1, 6,
             c[0]*1.3, c[1]*1.3, c[2]*1.3, a, 0.22, 0.8, 0.8, 1.0);
      glAddLight(p.x+sx, p.y+sy, 90, 0.3, c);
    }
    glLitCount = glWrite;

    // ==================== PHASE 2: ADDITIVE ===============================
    // Trails first so they sit under the things that cast them.
    if(!lowTier){
      for(let i=0;i<enemies.n;i++){
        const e = enemies.items[i];
        if(!e.active || !e.trailX) continue;
        const c = cssRGB(factionOf(e.faction).ink);
        for(let k=1;k<TRAIL_LEN;k++){
          const idx = (e.trailN - k + TRAIL_LEN*2) % TRAIL_LEN;
          if(!e.trailX[idx]) continue;
          const t = 1 - k/TRAIL_LEN;
          const sz = e.r*0.55*t;
          glPush(e.trailX[idx]+sx, e.trailY[idx]+sy, sz, sz, 0, 0,
                 SHAPE_GLOW, 0, c[0], c[1], c[2], t*0.35, 0, 1.0, 0, 0);
        }
      }
      if(running && player && player.trailX){
        const c = cssRGB(currentShip.color);
        for(let k=1;k<TRAIL_LEN;k++){
          const idx = (player.trailN - k + TRAIL_LEN*2) % TRAIL_LEN;
          if(!player.trailX[idx]) continue;
          const t = 1 - k/TRAIL_LEN;
          glPush(player.trailX[idx]+sx, player.trailY[idx]+sy, 8*t, 8*t, 0, 0,
                 SHAPE_GLOW, 0, c[0], c[1], c[2], t*0.45, 0, 0.9, 0, 0);
        }
      }
    }
    // Enemy state rings.
    for(let i=0;i<enemies.n;i++){
      const e = enemies.items[i];
      if(!e.active || !onScreen(e.x, e.y, e.r+60)) continue;
      if(e.shieldHp > 0){
        const c = cssRGB('#be8cff');
        glPush(e.x+sx, e.y+sy, e.r+8, e.r+8, e.t*0.01, 0, SHAPE_RING, 0,
               c[0], c[1], c[2], 0.8, 0.14, 0.7, 0, 0);
      }
      if(e.telegraph > 0){
        const p = clamp(e.telegraph > 1 ? e.telegraph/46 : e.telegraph, 0, 1);
        const rr = e.r + 6 + p*20;
        glPush(e.x+sx, e.y+sy, rr, rr, 0, 0, SHAPE_RING, 0,
               1, 1, 1, 0.22 + p*0.5, 0.09, 0.9, 0, 0);
      }
    }
    if(running && player && shieldTimer > 0){
      const c = cssRGB('#ffc24b');
      const rr = player.r + 14;
      glPush(player.x+sx, player.y+sy, rr, rr, 0, 0, SHAPE_RING, 0,
             c[0], c[1], c[2], 0.85, 0.12, 0.9, 0, 0);
    }
    // Engine flare, scaled by actual thrust.
    if(running && player){
      const thrust = Math.min(1, Math.hypot(player.vx, player.vy)/5);
      if(thrust > 0.08){
        const ex = player.x - Math.cos(player.a)*(player.r+6) + sx;
        const ey = player.y - Math.sin(player.a)*(player.r+6) + sy;
        const sz = 10 + thrust*16;
        glPush(ex, ey, sz, sz, 0, 0, SHAPE_GLOW, 0,
               0.24, 0.94, 1.0, 0.9, 0, 1.1 + thrust*0.9, 0, 0);
      }
    }
    for(let i=0;i<hazards.n;i++){
      const h = hazards.items[i];
      if(!onScreen(h.x, h.y, h.r+20)) continue;
      const a = clamp(h.life/h.maxLife, 0, 1);
      const c = hslRGB(h.hue, 0.85, 0.55);
      glPush(h.x+sx, h.y+sy, h.r, h.r, 0, 0, SHAPE_GLOW, 0,
             c[0], c[1], c[2], a*0.45, 0, 0.8, 0, 0);
    }
    for(let i=0;i<particles.n;i++){
      const p = particles.items[i];
      if(!onScreen(p.x, p.y, 20)) continue;
      const life = Math.max(p.life/p.maxLife, 0);
      const c = cssRGB(p.color);
      const sz = p.r * (0.8 + life*1.8);
      glPush(p.x+sx, p.y+sy, sz, sz, 0, 0, SHAPE_GLOW, 0,
             c[0], c[1], c[2], life, 0, p.hot ? 1.3 : 0.7, 0, 0);
    }
    for(let i=0;i<enemyBullets.n;i++){
      const b = enemyBullets.items[i];
      if(!onScreen(b.x, b.y, 18)) continue;
      const c = cssRGB(b.color);
      const sz = b.r*2.4;
      glPush(b.x+sx, b.y+sy, sz, sz, 0, 0, SHAPE_GLOW, 0,
             c[0], c[1], c[2], 1, 0, 1.5, 0, 0);
    }
    for(let i=0;i<bullets.n;i++){
      const b = bullets.items[i];
      if(!onScreen(b.x, b.y, 16)) continue;
      const c = b.crit ? cssRGB('#ffc24b') : cssRGB('#9ef4ff');
      const sz = b.crit ? 8 : 6;
      glPush(b.x+sx, b.y+sy, sz, sz, 0, 0, SHAPE_GLOW, 0,
             c[0], c[1], c[2], 1, 0, 1.7, 0, 0);
    }
    for(let i=0;i<shockwaves.n;i++){
      const s = shockwaves.items[i];
      const life = clamp(s.life/s.maxLife, 0, 1);
      const c = cssRGB(s.color);
      glPush(s.x+sx, s.y+sy, s.r, s.r, 0, 0, SHAPE_RING, 0,
             c[0], c[1], c[2], life*0.9,
             clamp(s.width/Math.max(s.r,1)*2.5, 0.03, 0.4), 1.0, 0, 0);
      // Every blast front also refracts the frame behind it.
      if(!lowTier) glAddWarp((s.x+sx)*DPR, (s.y+sy)*DPR, s.r*DPR, life*0.85);
    }
  }

  // --------------------------------------------------------------------------
  // Frame execution: scene -> bright -> blur -> composite.
  // --------------------------------------------------------------------------
  function glBindTarget(t){
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
    gl.viewport(0, 0, t ? t.w : GLR.w, t ? t.h : GLR.h);
  }
  function glFullscreen(prog){
    gl.useProgram(prog.p);
    gl.bindVertexArray(GLR.vao.full);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function glDrawFrame(dt){
    if(!GLR.ok) return false;
    glResize();
    if(!GLR.ok) return false;

    const sx = shake > 0.3 ? (Math.random()-0.5)*shake : 0;
    const sy = shake > 0.3 ? (Math.random()-0.5)*shake : 0;
    glCollect(sx, sy);

    const now = performance.now()*0.001;
    const f = currentFaction;
    const nebA = cssRGB(f.nebula[0]), nebB = cssRGB(f.nebula[1]);
    const grade = cssRGB(f.ink);

    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);

    // ---- 1. scene ---------------------------------------------------------
    glBindTarget(GLR.sceneFbo);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    const bg = GLR.prog.bg;
    gl.useProgram(bg.p);
    gl.uniform2f(bg.u.u_res, GLR.w, GLR.h);
    gl.uniform1f(bg.u.u_time, now);
    gl.uniform1f(bg.u.u_scroll, bgScrollAcc);
    gl.uniform3f(bg.u.u_colA, nebA[0], nebA[1], nebA[2]);
    gl.uniform3f(bg.u.u_colB, nebB[0], nebB[1], nebB[2]);
    // Tier 5 and up gain the two extra parallax layers, matching 3.3.
    gl.uniform1f(bg.u.u_layers, perfLevel()==='low' ? 3 : (activeTier() >= 5 ? 5 : 3));
    gl.bindVertexArray(GLR.vao.full);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    if(glWrite > 0){
      gl.bindBuffer(gl.ARRAY_BUFFER, GLR.buf.inst);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, GLR.instData, 0, glWrite*FLOATS_PER_INSTANCE);

      const sp = GLR.prog.sprite;
      gl.useProgram(sp.p);
      gl.uniform2f(sp.u.u_res, GLR.w, GLR.h);
      gl.uniform1i(sp.u.u_lightCount, GLR.lightCount);
      gl.uniform3f(sp.u.u_ambient, 0.62, 0.66, 0.80);
      if(GLR.lightCount > 0){
        // Two tightly packed uniform arrays rather than a struct array, which
        // some drivers lay out badly. Both are pre-allocated.
        const pos = GLR.lightPosBuf, col = GLR.lightColBuf;
        for(let i=0;i<GLR.lightCount;i++){
          pos[i*4]   = GLR.lightData[i*8];
          pos[i*4+1] = GLR.lightData[i*8+1];
          pos[i*4+2] = GLR.lightData[i*8+2];
          pos[i*4+3] = GLR.lightData[i*8+3];
          col[i*3]   = GLR.lightData[i*8+4];
          col[i*3+1] = GLR.lightData[i*8+5];
          col[i*3+2] = GLR.lightData[i*8+6];
        }
        gl.uniform4fv(sp.u.u_lightPosR, pos);
        gl.uniform3fv(sp.u.u_lightCol, col);
      }
      gl.bindVertexArray(GLR.vao.sprite);
      gl.enable(gl.BLEND);
      // Lit geometry blends normally; emissive geometry is purely additive,
      // which is what lets bright cores stack past 1.0 for the bloom pass.
      if(glLitCount > 0){
        gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, glLitCount);
      }
      const addCount = glWrite - glLitCount;
      if(addCount > 0){
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        glDrawRange(glLitCount, addCount);
      }
      gl.bindVertexArray(null);
    }

    // ---- 2. bright pass + blur -------------------------------------------
    const bloomOn = bloomAlpha() > 0.01;
    if(bloomOn){
      gl.disable(gl.BLEND);
      glBindTarget(GLR.brightFbo);
      const br = GLR.prog.bright;
      gl.useProgram(br.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, GLR.sceneFbo.tex);
      gl.uniform1i(br.u.u_tex, 0);
      gl.uniform1f(br.u.u_threshold, 0.70);
      gl.bindVertexArray(GLR.vao.full);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      const bl = GLR.prog.blur;
      gl.useProgram(bl.p);
      gl.uniform1i(bl.u.u_tex, 0);
      const passes = perfLevel()==='high' ? 2 : 1;
      let src = GLR.brightFbo;
      for(let p=0; p<passes; p++){
        glBindTarget(GLR.blurFboA);
        gl.bindTexture(gl.TEXTURE_2D, src.tex);
        gl.uniform2f(bl.u.u_dir, 1/GLR.bw, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        glBindTarget(GLR.blurFboB);
        gl.bindTexture(gl.TEXTURE_2D, GLR.blurFboA.tex);
        gl.uniform2f(bl.u.u_dir, 0, 1/GLR.bh);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        src = GLR.blurFboB;
      }
    }

    // ---- 3. composite to the screen --------------------------------------
    glBindTarget(null);
    gl.disable(gl.BLEND);
    const cp = GLR.prog.comp;
    gl.useProgram(cp.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, GLR.sceneFbo.tex);
    gl.uniform1i(cp.u.u_scene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, (bloomOn ? GLR.blurFboB : GLR.brightFbo).tex);
    gl.uniform1i(cp.u.u_bloom, 1);
    gl.uniform2f(cp.u.u_res, GLR.w, GLR.h);
    gl.uniform1f(cp.u.u_time, now);
    gl.uniform1f(cp.u.u_bloomAmount, bloomOn ? 1.0*bloomAlpha() : 0.0);
    // Chromatic aberration and grain are motion- and comfort- sensitive, so they
    // follow the same reduced-motion switch every other effect does.
    gl.uniform1f(cp.u.u_chroma, reducedMotion() ? 0.0 : (perfLevel()==='low' ? 0.0 : 0.008));
    gl.uniform1f(cp.u.u_grain, perfLevel()==='low' ? 0.0 : 0.045);
    gl.uniform1f(cp.u.u_vignette, 0.42);
    gl.uniform1f(cp.u.u_flash, clamp(flashAlpha, 0, 0.9));
    gl.uniform3f(cp.u.u_grade, grade[0]*0.022, grade[1]*0.022, grade[2]*0.022);
    gl.uniform1i(cp.u.u_warpCount, reducedMotion() ? 0 : GLR.warpCount);
    if(GLR.warpCount > 0) gl.uniform4fv(cp.u.u_warps, GLR.warpData);
    gl.bindVertexArray(GLR.vao.full);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
    return true;
  }

  /** WebGL2 has no baseInstance, so the additive range is drawn by pointing
      the instance attributes at an offset into the same buffer. */
  const GL_ATTR_OFFSETS = [0, 16, 32, 48];
  function glDrawRange(first, count){
    const stride = FLOATS_PER_INSTANCE*4;
    const base = first*stride;
    gl.bindBuffer(gl.ARRAY_BUFFER, GLR.buf.inst);
    for(let i=0;i<4;i++) gl.vertexAttribPointer(i+1, 4, gl.FLOAT, false, stride, base + GL_ATTR_OFFSETS[i]);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
    // Restore the base pointers for the next frame's lit range.
    for(let i=0;i<4;i++) gl.vertexAttribPointer(i+1, 4, gl.FLOAT, false, stride, GL_ATTR_OFFSETS[i]);
  }

  /** Text stays on a 2D overlay: a glyph atlas in GL would buy nothing here,
      and score popups need to stay crisp at any DPR. */
  function glDrawOverlay(){
    const c = ctx;
    if(!c) return;
    c.clearRect(0, 0, W, H);
    c.textBaseline = 'alphabetic';
    for(let i=0;i<popups.n;i++){
      const p = popups.items[i];
      c.globalAlpha = Math.max(p.life/50, 0);
      c.fillStyle = p.color;
      c.font = Math.round(11*p.scale) + "px 'Orbitron', sans-serif";
      c.textAlign = 'center';
      c.fillText(p.text, p.x, p.y);
    }
    c.globalAlpha = 1;
    if(bossActive) drawBossBar();
    if(save.settings.showFps){
      c.save();
      c.fillStyle = 'rgba(90,106,147,0.9)';
      c.font = "9px 'Space Mono', monospace";
      c.textAlign = 'center';
      c.fillText(fpsDisplay + ' FPS · GL · ' + enemies.n + 'e ' + particles.n + 'p · ' +
                 glWrite + ' inst · q' + quality.step, W/2, 16);
      c.restore();
    }
  }

  // ==========================================================================
  // Main gameplay render. Every entity is viewport-culled BEFORE any draw call
  // is issued for it (Section 5), and every blur routes through sb().
  // ==========================================================================
  function shipPath(c, shape, glyph, r){
    // Five class hulls x nine detail variants: every one of the 45 frames has
    // a silhouette of its own, not just a recolour (4.4).
    const g = glyph % 9;
    const wing = 0.55 + (g%3)*0.2;
    const tail = 0.5 + Math.floor(g/3)*0.18;
    c.beginPath();
    if(shape === 0){          // assault: forward dart
      c.moveTo(r, 0);
      c.lineTo(-r*0.55, r*wing);
      c.lineTo(-r*tail, 0);
      c.lineTo(-r*0.55, -r*wing);
    } else if(shape === 1){   // interceptor: swept needle
      c.moveTo(r*1.15, 0);
      c.lineTo(-r*0.2, r*wing*0.6);
      c.lineTo(-r*0.75, r*wing);
      c.lineTo(-r*tail*0.7, 0);
      c.lineTo(-r*0.75, -r*wing);
      c.lineTo(-r*0.2, -r*wing*0.6);
    } else if(shape === 2){   // bulwark: broad wedge
      c.moveTo(r*0.85, 0);
      c.lineTo(r*0.2, r*wing*1.15);
      c.lineTo(-r*0.7, r*wing);
      c.lineTo(-r*tail, 0);
      c.lineTo(-r*0.7, -r*wing);
      c.lineTo(r*0.2, -r*wing*1.15);
    } else if(shape === 3){   // support: rounded hex
      for(let i=0;i<6;i++){
        const a = (i/6)*Math.PI*2;
        const rr = r*(i%2 ? 0.72 : 1)*(0.85 + wing*0.2);
        const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
        if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
      }
    } else {                  // exotic: split blade
      c.moveTo(r*1.1, 0);
      c.lineTo(0, r*wing);
      c.lineTo(-r*0.5, r*0.28);
      c.lineTo(-r*tail, 0);
      c.lineTo(-r*0.5, -r*0.28);
      c.lineTo(0, -r*wing);
    }
    c.closePath();
  }

  function drawShip(){
    if(!player) return;
    const shipDef = currentShip;
    const cls = SHIP_CLASSES.find(c => c.id === shipDef.cls) || SHIP_CLASSES[0];
    ctx.save();
    if(invuln > 0 && Math.floor(invuln/6)%2 === 0) ctx.globalAlpha = 0.4;

    // 3.5 motion trail
    if(player.trailX && perfLevel() !== 'low'){
      ctx.save();
      ctx.strokeStyle = shipDef.color;
      ctx.lineCap = 'round';
      for(let i=1;i<TRAIL_LEN;i++){
        const a = (player.trailN - i + TRAIL_LEN*2) % TRAIL_LEN;
        const b = (player.trailN - i + 1 + TRAIL_LEN*2) % TRAIL_LEN;
        if(!player.trailX[a] && !player.trailY[a]) continue;
        ctx.globalAlpha = (1 - i/TRAIL_LEN)*0.28;
        ctx.lineWidth = (1 - i/TRAIL_LEN)*5;
        ctx.beginPath();
        ctx.moveTo(player.trailX[a], player.trailY[a]);
        ctx.lineTo(player.trailX[b], player.trailY[b]);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.translate(player.x, player.y);
    ctx.rotate(player.a);
    // Squash & stretch: bank into the turn, stretch into the dash.
    const stretch = 1 + Math.min(0.35, Math.hypot(player.vx, player.vy)*0.03);
    ctx.scale(stretch, 1/Math.sqrt(stretch));
    ctx.transform(1, player.bank*0.35, 0, 1, 0, 0);

    if(shieldTimer > 0){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,194,75,0.65)';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#ffc24b'; ctx.shadowBlur = sb(14);
      ctx.beginPath(); ctx.arc(0,0,player.r+9,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      emitBloom(player.x, player.y, player.r+12, '#ffc24b', false);
    }
    ctx.shadowColor = shipDef.color; ctx.shadowBlur = sb(16);
    ctx.fillStyle = '#0d1226';
    ctx.strokeStyle = rapidTimer > 0 ? '#ffffff' : shipDef.color;
    ctx.lineWidth = 2;
    shipPath(ctx, cls.shape, shipDef.glyph, player.r + 4);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    emitBloom(player.x, player.y, player.r*1.6, shipDef.color, true);
    // Engine flare sits behind the hull and pulses with actual thrust.
    const thrust = Math.min(1, Math.hypot(player.vx, player.vy)/5);
    if(thrust > 0.1){
      emitBloom(player.x - Math.cos(player.a)*(player.r+6),
                player.y - Math.sin(player.a)*(player.r+6),
                8 + thrust*10, '#3df0ff', true);
    }

    // Drones
    const droneCount = (droneTimer > 0 ? 1 : 0) + (stats ? stats.drones : 0);
    for(let k=0;k<droneCount;k++){
      const a = droneAngle + (k/droneCount)*Math.PI*2;
      const dx2 = player.x + Math.cos(a)*34, dy2 = player.y + Math.sin(a)*34;
      ctx.save();
      ctx.strokeStyle = 'rgba(75,255,224,0.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(dx2, dy2); ctx.stroke();
      ctx.translate(dx2, dy2);
      ctx.shadowColor = '#4bffe0'; ctx.shadowBlur = sb(12);
      ctx.strokeStyle = '#4bffe0'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(6,0); ctx.lineTo(0,6); ctx.lineTo(-6,0); ctx.lineTo(0,-6); ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = 'rgba(75,255,224,0.15)'; ctx.fill();
      ctx.restore();
      emitBloom(dx2, dy2, 10, '#4bffe0', true);
    }

    if(decoy){
      ctx.save();
      ctx.globalAlpha = 0.4 + Math.sin(performance.now()/90)*0.15;
      ctx.translate(decoy.x, decoy.y);
      ctx.strokeStyle = shipDef.color; ctx.lineWidth = 1.5;
      shipPath(ctx, cls.shape, shipDef.glyph, player.r + 4);
      ctx.stroke();
      ctx.restore();
    }
  }

  function enemyPath(c, motif, e, r){
    const n = 10;
    c.beginPath();
    if(motif === 'rock' || motif === 'pressure'){
      for(let i=0;i<n;i++){
        const a = (i/n)*Math.PI*2;
        const rad = r*e.verts[i];
        const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
        if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
      }
    } else if(motif === 'portal'){
      for(let i=0;i<8;i++){
        const a = (i/8)*Math.PI*2;
        const rad = r*(i%2 ? 0.5 : 1);
        const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
        if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
      }
    } else if(motif === 'plate'){
      c.moveTo(-r*0.8, -r*0.6); c.lineTo(r*0.8, -r*0.6);
      c.lineTo(r, 0); c.lineTo(r*0.8, r*0.6);
      c.lineTo(-r*0.8, r*0.6); c.lineTo(-r, 0);
    } else if(motif === 'spore'){
      for(let i=0;i<6;i++){
        const a = (i/6)*Math.PI*2;
        const rad = r*(0.7 + e.verts[i]*0.35);
        const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
        if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
      }
    } else if(motif === 'flare'){
      for(let i=0;i<12;i++){
        const a = (i/12)*Math.PI*2;
        const rad = r*(i%2 ? 0.42 : 1);
        const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
        if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
      }
    } else {  // glitch
      for(let i=0;i<7;i++){
        const a = (i/7)*Math.PI*2;
        const rad = r*(0.55 + ((i*e.seed)%5)/5*0.7);
        const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
        if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
      }
    }
    c.closePath();
  }

  function drawEnemy(e){
    const def = e.def, f = factionOf(e.faction);
    const r = e.r;
    if(!onScreen(e.x, e.y, r + 40)) return;          // cull before drawing
    const hue = def.hue < 0 ? (performance.now()*0.06 + e.seed*40) % 360 : e.hue;
    const ink = def.hue < 0 ? `hsl(${hue},90%,70%)` : f.ink;

    if(e.trailX && perfLevel() !== 'low'){
      ctx.save();
      ctx.strokeStyle = ink; ctx.lineCap = 'round';
      for(let i=1;i<TRAIL_LEN;i++){
        const a = (e.trailN - i + TRAIL_LEN*2) % TRAIL_LEN;
        const b = (e.trailN - i + 1 + TRAIL_LEN*2) % TRAIL_LEN;
        if(!e.trailX[a]) continue;
        ctx.globalAlpha = (1 - i/TRAIL_LEN)*0.22;
        ctx.lineWidth = (1 - i/TRAIL_LEN)*4;
        ctx.beginPath();
        ctx.moveTo(e.trailX[a], e.trailY[a]);
        ctx.lineTo(e.trailX[b], e.trailY[b]);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = e.alpha;
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);
    // Squash on spawn and on being hit — the first animation principle doing
    // the heavy lifting for "this thing is alive".
    const sq = 1 + e.squash*0.35;
    ctx.scale(sq, 1/sq);
    ctx.shadowColor = ink;
    ctx.shadowBlur = e.flash > 0 ? sb(22) : sb(9);
    ctx.strokeStyle = e.flash > 0 ? '#ffffff' : `hsla(${hue},85%,72%,0.92)`;
    ctx.lineWidth = e.isBoss ? 2.8 : 1.7;
    enemyPath(ctx, f.motif, e, r);
    ctx.stroke();
    ctx.fillStyle = `hsla(${hue},60%,32%,0.22)`;
    ctx.fill();
    ctx.restore();

    emitBloom(e.x, e.y, r*1.3, ink, e.isBoss);

    // --- state signalling: colour AND shape, never colour alone (1.7) -----
    if(e.shieldHp > 0){
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.strokeStyle = 'rgba(190,140,255,0.7)';
      ctx.shadowColor = '#be8cff'; ctx.shadowBlur = sb(12);
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<=6;i++){
        const a = (i/6)*Math.PI*2 + e.t*0.01;
        const x = Math.cos(a)*(r+7), y = Math.sin(a)*(r+7);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.restore();
    }
    if(def.frontShield){
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.rot);
      ctx.strokeStyle = 'rgba(234,242,255,0.55)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r+5, -1.1, 1.1); ctx.stroke();
      ctx.restore();
    }
    if(e.telegraph > 0){
      // 1.3 anticipation: a wind-up the eye can find before the hit lands.
      const p = clamp(e.telegraph > 1 ? e.telegraph/46 : e.telegraph, 0, 1);
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.25 + p*0.5)+')';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([5,6]);
      ctx.beginPath(); ctx.arc(0,0, r + 6 + p*18, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      if(e.state === 2 && e.telegraph < 46){
        ctx.strokeStyle = 'rgba(255,120,60,'+(0.2+p*0.5)+')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(e.ax)*Math.max(W,H), Math.sin(e.ax)*Math.max(W,H));
        ctx.stroke();
      }
      ctx.restore();
    }
    if(e.state === 2 && e.telegraph >= 46 && e.telegraph < 80){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,140,70,0.85)';
      ctx.shadowColor = '#ff5a28'; ctx.shadowBlur = sb(20);
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.ax)*Math.max(W,H), e.y + Math.sin(e.ax)*Math.max(W,H));
      ctx.stroke();
      ctx.restore();
      emitBloom(e.x, e.y, 30, '#ff5a28', true);
    }
    if(e.immuneTo){
      ctx.save();
      ctx.fillStyle = '#eaf2ff';
      ctx.font = "10px 'Orbitron', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(STATE_GLYPH.immune + e.immuneTo, e.x, e.y - r - 8);
      ctx.restore();
    }
    if(stats && stats.scanner && e.hp < e.maxHp){
      ctx.save();
      ctx.fillStyle = 'rgba(255,194,75,0.85)';
      ctx.fillRect(e.x - r*0.7, e.y - r - 6, r*1.4*(e.hp/e.maxHp), 2);
      ctx.restore();
    }
  }

  function drawBossBar(){
    if(!boss || !boss.active) return;
    const w = Math.min(W*0.62, 420), h = 14, x = (W-w)/2, y = 78;
    const f = factionOf(boss.faction);
    ctx.save();
    ctx.fillStyle = 'rgba(10,14,28,0.72)'; ctx.fillRect(x-2, y-2, w+4, h+4);
    ctx.fillStyle = 'rgba(255,46,136,0.12)'; ctx.fillRect(x, y, w, h);
    const pct = clamp(boss.hp/boss.maxHp, 0, 1);
    ctx.fillStyle = f.ink;
    ctx.shadowColor = f.ink; ctx.shadowBlur = sb(10);
    ctx.fillRect(x, y, w*pct, h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(234,242,255,0.5)'; ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#eaf2ff';
    ctx.font = "10px 'Orbitron', sans-serif";
    ctx.textAlign = 'center';
    let label = nm(boss.def, 'name');
    if(boss.shieldHp > 0) label += '  ' + STATE_GLYPH.shielded;
    ctx.fillText(label, x + w/2, y - 6);
    ctx.restore();
  }

  // Cached grain tile — 2.8: built once, never rebuilt per frame.
  let grainTile = null;
  function buildGrain(){
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const img = g.createImageData(64,64);
    for(let i=0;i<img.data.length;i+=4){
      const v = 128 + (Math.random()*44 - 22);
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 16;
    }
    g.putImageData(img, 0, 0);
    grainTile = c;
  }

  function draw(dt){
    drawBackground(dt);
    // The GL path renders the whole scene and its own text overlay. Any
    // failure inside it returns false and the Canvas2D path below runs
    // exactly as it did before, so a driver that rejects a shader costs
    // fidelity and nothing else.
    if(GL_ON && glDrawFrame(dt)){ glDrawOverlay(); return; }
    if(!ctx) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if(shake > 0.3){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // 3.2 dynamic point lighting, under everything else so it tints the
    // silhouettes drawn on top of it.
    if(lights.n && bloomAlpha() > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for(let i=0;i<lights.n;i++){
        const l = lights.items[i];
        if(!onScreen(l.x, l.y, l.r)) continue;
        drawGlow(ctx, l.x, l.y, l.r, l.color, clamp(l.intensity,0,1)*0.5*bloomAlpha());
      }
      ctx.restore();
    }

    // Hazards (area denial) sit below the entities.
    for(let i=0;i<hazards.n;i++){
      const h = hazards.items[i];
      if(!onScreen(h.x, h.y, h.r+20)) continue;
      const a = clamp(h.life/h.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a*0.28;
      ctx.fillStyle = `hsl(${h.hue},80%,55%)`;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = a*0.6;
      ctx.strokeStyle = `hsl(${h.hue},90%,70%)`;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4,5]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // 2.6 batching: particles are drawn in one pass with a single fillStyle
    // switch per colour run rather than interleaving state per particle.
    let lastColor = null;
    for(let i=0;i<particles.n;i++){
      const p = particles.items[i];
      if(!onScreen(p.x, p.y, 12)) continue;
      if(p.color !== lastColor){ ctx.fillStyle = p.color; lastColor = p.color; }
      ctx.globalAlpha = Math.max(p.life/p.maxLife, 0);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      if(p.hot && bloomAlpha() > 0 && p.r > 1.8) emitBloom(p.x, p.y, p.r*4, p.color, true);
    }
    ctx.globalAlpha = 1;

    for(let i=0;i<shockwaves.n;i++){
      const s = shockwaves.items[i];
      ctx.save();
      ctx.globalAlpha = clamp(s.life/s.maxLife, 0, 1)*0.7;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.width;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    for(let i=0;i<powerups.n;i++){
      const p = powerups.items[i];
      if(!onScreen(p.x, p.y, 30)) continue;
      const col = POWER_COLOR[p.type] || '#3df0ff';
      // Blink out over the last two seconds so the expiry is legible.
      if(p.ttl < 120 && Math.floor(p.ttl/6) % 2 === 0) continue;
      ctx.save();
      ctx.globalAlpha = p.ttl < 240 ? 0.45 + 0.55*(p.ttl/240) : 1;
      ctx.translate(p.x, p.y);
      const pulse = 1 + Math.sin(p.pulse)*0.15;
      ctx.scale(pulse, pulse);
      ctx.shadowBlur = sb(16); ctx.shadowColor = col;
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#0d1226'; ctx.fill();
      ctx.fillStyle = col;
      ctx.font = "11px 'Orbitron', sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(POWER_ICON[p.type] || '?', 0, 1);
      ctx.restore();
      ctx.globalAlpha = 1;
      emitBloom(p.x, p.y, p.r*2, col, true);
    }
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = '#eaf2ff';
    for(let i=0;i<bullets.n;i++){
      const b = bullets.items[i];
      if(!onScreen(b.x, b.y, 12)) continue;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.crit ? 3.4 : 2.6, 0, Math.PI*2); ctx.fill();
      emitBloom(b.x, b.y, b.crit ? 13 : 9, b.crit ? '#ffc24b' : '#3df0ff', true);
    }
    lastColor = null;
    for(let i=0;i<enemyBullets.n;i++){
      const b = enemyBullets.items[i];
      if(!onScreen(b.x, b.y, 14)) continue;
      if(b.color !== lastColor){ ctx.fillStyle = b.color; lastColor = b.color; }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      emitBloom(b.x, b.y, b.r*3, b.color, true);
    }

    for(let i=0;i<enemies.n;i++) drawEnemy(enemies.items[i]);
    if(running) drawShip();

    for(let i=0;i<popups.n;i++){
      const p = popups.items[i];
      ctx.globalAlpha = Math.max(p.life/50, 0);
      ctx.fillStyle = p.color;
      ctx.font = Math.round(11*p.scale) + "px 'Orbitron', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    flushBloom();

    // 3.6 screen-space colour grading: one low-alpha overlay per faction
    // biome instead of recolouring every sprite.
    ctx.save();
    ctx.fillStyle = currentFaction.grade;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Low-hull warning: pulse plus an unmistakable edge, not hue alone.
    if(running && lives <= 1){
      const pulse = 0.12 + 0.08*Math.sin(performance.now()/200);
      const g = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.78);
      g.addColorStop(0, 'rgba(255,46,136,0)');
      g.addColorStop(1, 'rgba(255,46,136,'+pulse+')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    // Vignette — cached gradient (2.8), rebuilt only on resize.
    if(!vignette || vignetteW !== W || vignetteH !== H){
      vignetteW = W; vignetteH = H;
      vignette = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.42)');
    }
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    if(perfLevel() !== 'low'){
      if(!grainTile){ buildGrain(); grainPattern = null; }
      if(!grainPattern) grainPattern = ctx.createPattern(grainTile, 'repeat');
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.translate(-((Math.random()*64)|0), -((Math.random()*64)|0));
      ctx.fillStyle = grainPattern;
      ctx.fillRect(0, 0, W+64, H+64);
      ctx.restore();
    }

    if(bossActive) drawBossBar();
    if(flashAlpha > 0.01){
      ctx.fillStyle = 'rgba(255,255,255,'+flashAlpha+')';
      ctx.fillRect(0, 0, W, H);
    }
    // Radar: off-screen markers for enemies and powerups.
    if(running && stats && (stats.radar || revealTimer > 0)){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,194,75,0.7)';
      ctx.lineWidth = 1.4;
      for(let i=0;i<powerups.n;i++){
        const p = powerups.items[i];
        if(onScreen(p.x, p.y, -10)) continue;
        const a = Math.atan2(p.y-H/2, p.x-W/2);
        ctx.beginPath();
        ctx.arc(W/2 + Math.cos(a)*Math.min(W,H)*0.42, H/2 + Math.sin(a)*Math.min(W,H)*0.42, 4, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    }
    if(save.settings.showFps){
      ctx.save();
      ctx.fillStyle = 'rgba(90,106,147,0.9)';
      ctx.font = "9px 'Space Mono', monospace";
      ctx.textAlign = 'center';
      ctx.fillText(fpsDisplay + ' FPS · ' + enemies.n + 'e ' + particles.n + 'p · q' + quality.step, W/2, 16);
      ctx.restore();
    }
  }
  let vignette = null, vignetteW = 0, vignetteH = 0, grainPattern = null;

  // ==========================================================================
  // 4.8 — one explicit menu state machine. Overlay visibility is derived from
  // it, which removes the whole class of bug where two panels end up open and
  // interactable at the same time.
  // ==========================================================================
  const MODALS = {
    settings:     $('settingsOverlay'),
    upgrades:     $('upgradesOverlay'),
    hangar:       $('hangarOverlay'),
    bestiary:     $('bestiaryOverlay'),
    achievements: $('achievementsOverlay')
  };
  let menuState = 'root';
  function setMenuState(next){
    menuState = next;
    for(const k in MODALS) MODALS[k].classList.toggle('open', k === next);
    pauseOverlay.style.display = next === 'paused' ? 'flex' : 'none';
    relicOverlay.style.display = next === 'relic' ? 'flex' : 'none';
    sfxUI(); vibrate(6);
  }
  function closeModal(){
    // 4.5: every screen has one obvious way back, and it always lands
    // somewhere valid — the pause menu mid-run, the main menu otherwise.
    setMenuState(running ? (paused ? 'paused' : 'root') : 'root');
    if(!running) overlay.classList.remove('hidden');
  }

  // --------------------------------------------------------------------------
  // HUD (4.1: glanceable — score, wave, combo, hull, shards, ultimate)
  // --------------------------------------------------------------------------
  let lastScoreShown = -1, lastWaveShown = -1, lastComboShown = -1;
  let lastLivesShown = -1, lastMaxLivesShown = -1;
  function bump(el){
    el.classList.remove('bump');
    void el.offsetWidth;           // restart the animation
    el.classList.add('bump');
  }
  function updateHUD(){
    const sc = Math.floor(score);
    if(sc !== lastScoreShown){ scoreVal.textContent = sc; lastScoreShown = sc; }
    if(wave !== lastWaveShown){ waveVal.textContent = wave; lastWaveShown = wave; bump(waveVal); }
    if(combo !== lastComboShown){
      comboVal.textContent = 'x' + combo;
      if(combo > lastComboShown && combo > 1) bump(comboVal);
      lastComboShown = combo;
    }
    shardHudEl.textContent = runShards + ' ' + T('shardsShort');
    // 2.4: only touch the DOM when the value actually changed — this runs
    // every frame, and rebuilding the pips was pure layout churn.
    if(lives === lastLivesShown && maxLives === lastMaxLivesShown) return;
    lastLivesShown = lives; lastMaxLivesShown = maxLives;
    livesEl.innerHTML = '';
    const shown = Math.min(maxLives, 12);
    for(let i=0;i<shown;i++){
      const d = document.createElement('div');
      d.className = 'life' + (i < lives ? '' : ' lost');
      livesEl.appendChild(d);
    }
    if(maxLives > 12){
      const more = document.createElement('div');
      more.style.cssText = 'font-size:8px;color:var(--dim);align-self:center;';
      more.textContent = '+' + (maxLives-12);
      livesEl.appendChild(more);
    }
  }
  function updateUltUI(){
    ultFillEl.style.width = Math.round(ultCharge*100) + '%';
    ultBarEl.classList.toggle('ready', ultReady);
    ultBtn.classList.toggle('ready', ultReady);
    ultBtn.classList.toggle('cooldown', !ultReady);
  }
  function updateBuffs(){
    const arr = [];
    if(rapidTimer > 0)  arr.push('R' + Math.ceil(rapidTimer/60));
    if(shieldTimer > 0) arr.push('S' + Math.ceil(shieldTimer/60));
    if(spreadTimer > 0) arr.push('M' + Math.ceil(spreadTimer/60));
    if(homingTimer > 0) arr.push('H' + Math.ceil(homingTimer/60));
    if(droneTimer > 0)  arr.push('D' + Math.ceil(droneTimer/60));
    for(const k in runRelics){
      if(!runRelics[k]) continue;
      const def = RELICS.find(r => r.id === k);

  /** Small offscreen render of a ship or enemy silhouette for the gallery
      cards, so the roster screens use the same shape vocabulary as the game. */
  function glyphCanvas(kind, def, size){
    const c = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = size*dpr; c.height = size*dpr;
    c.style.width = size+'px'; c.style.height = size+'px';
    const g = c.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.translate(size/2, size/2);
    if(kind === 'ship'){
      const cls = SHIP_CLASSES.find(x => x.id === def.cls) || SHIP_CLASSES[0];
      g.strokeStyle = def.color; g.fillStyle = 'rgba(13,18,38,0.9)'; g.lineWidth = 1.6;
      shipPath(g, cls.shape, def.glyph, size*0.34);
      g.fill(); g.stroke();
    } else {
      const f = factionOf(def.faction);
      const fake = {verts:null, seed:def.id.length, t:0};
      fake.verts = new Float32Array(10);
      for(let i=0;i<10;i++) fake.verts[i] = 0.75 + ((i*7 + def.id.length) % 5)/10;
      g.strokeStyle = def.hue < 0 ? '#ff6fd8' : `hsl(${def.hue},85%,70%)`;
      g.fillStyle = 'rgba(13,18,38,0.85)'; g.lineWidth = 1.5;
      enemyPath(g, f.motif, fake, size*0.34);
      g.fill(); g.stroke();
    }
    return c;
  }

  let hangarTab = 'all', hangarPage = 0;

  function shipsForTab(){
    return hangarTab === 'all' ? SHIPS : SHIPS.filter(s => s.cls === hangarTab);
  }
  function unlockText(ship){
    const u = ship.unlock || {};
    const parts = [];
    if(u.shards) parts.push(u.shards + ' ' + T('shardsShort'));
    if(u.wave) parts.push(T('needWave') + ' ' + u.wave);
    if(u.bosses) parts.push(T('needBoss') + ' ' + u.bosses);
    if(u.kills) parts.push(T('needKills') + ' ' + u.kills);
    if(u.ach) parts.push(T('needAch') + ' ' + u.ach);
    if(u.runs) parts.push(T('needRuns') + ' ' + u.runs);
    if(u.combo) parts.push('COMBO ' + u.combo);
    if(u.grazes) parts.push('GRAZE ' + u.grazes);
    if(u.shardsLifetime) parts.push(u.shardsLifetime + ' ' + T('shardsShort') + '+');
    return parts.join(' · ');
  }
  function unlockMet(ship){
    const u = ship.unlock || {};
    if(u.wave && save.bestWave < u.wave) return false;
    if(u.bosses && (save.lifetimeBosses||0) < u.bosses) return false;
    if(u.kills && (save.lifetimeKills||0) < u.kills) return false;
    if(u.ach && countUnlockedAchievements() < u.ach) return false;
    if(u.runs && save.totalRuns < u.runs) return false;
    if(u.combo && (save.bestCombo||0) < u.combo) return false;
    if(u.grazes && (save.bestGrazes||0) < u.grazes) return false;
    if(u.shardsLifetime && (save.lifetimeShards||0) < u.shardsLifetime) return false;
    return true;
  }
  function renderHangar(){
    $('hangarShards').textContent = T('shards') + ': ' + save.shards;
    const tabs = [{id:'all', text:T('all')}].concat(SHIP_CLASSES.map(c => ({id:c.id, text:T(c.label)})));
    buildTabs($('hangarTabs'), tabs, hangarTab, id => { hangarTab = id; hangarPage = 0; renderHangar(); });

    const grid = $('shipGrid');
    grid.innerHTML = '';
    list.slice(hangarPage*PAGE_SIZE, hangarPage*PAGE_SIZE + PAGE_SIZE).forEach(ship => {
      const owned = save.unlocked.indexOf(ship.id) >= 0;
      const selected = save.selected === ship.id;
      const card = document.createElement('div');
      card.className = 'shipCard' + (selected ? ' selected' : '') + (owned ? '' : ' locked');
      card.appendChild(glyphCanvas('ship', ship, 44));
      const n = document.createElement('div');
      n.className = 'shipName'; n.style.color = ship.color; n.textContent = nm(ship,'name');

                             : (T('unlockFor') + ' ' + unlockText(ship));
      card.appendChild(n); card.appendChild(cl); card.appendChild(st);
      card.addEventListener('click', () => handleShipTap(ship, card));
      grid.appendChild(card);
    });
    buildPager($('hangarPager'), hangarPage, pages, p => { hangarPage = p; renderHangar(); });
    const sel = getShip(save.selected);

  function handleShipTap(ship, el){
    if(save.unlocked.indexOf(ship.id) >= 0){
      if(save.selected !== ship.id){
        save.selected = ship.id;
        currentShip = ship;
        persistSave(); renderHangar(); renderMenu();
        sfxUI(); vibrate(8);
      }
      return;
    }
    const cost = (ship.unlock && ship.unlock.shards) || 0;
    if(save.shards >= cost && unlockMet(ship)){
      save.shards -= cost;
      save.unlocked.push(ship.id);
      save.selected = ship.id;
      currentShip = ship;
      sfxPower(); vibrate(20);
      persistSave(); renderHangar(); renderMenu();
      checkAchievements();
    } else {
      el.classList.add('denied');
      setTimeout(() => el.classList.remove('denied'), 300);
      sfxDeny(); vibrate(12);
    }
  }

      {key:'perf', label:'setPerf', get:() => T(save.settings.perf),

  function endGame(){
    if(!running) return;
    running = false; spawning = false;
    const cfg = diffCfg();
    const elapsed = performance.now() - runStats.startMs;
    save.lifetimePlayMs = (save.lifetimePlayMs||0) + elapsed;

    let earned = Math.floor(score/40) + runShards + bossesDefeated*150;
    earned = Math.floor(earned * cfg.shardMult * (1 + (stats.riskPremium||0)*(save.difficulty === 'hard' ? 1 : 0)));
    // 12.5: an assisted run still pays and still progresses, it just does not
    // count toward the leaderboard or the achievements that gate on skill.
    if(assistActive()) earned = Math.floor(earned*0.75);
    const forfeitRate = runStats.won ? 0 : 0.2*(1 - Math.min(1, stats.vaultKeeper||0));
    const kept = Math.floor(earned * (1 - forfeitRate));
    const lostToWreck = earned - kept;
    if(wagered > 0 && runStats.won) save.shards += wagered*2;
    save.shards += kept;
    save.lifetimeShards = (save.lifetimeShards||0) + kept;
    save.totalRuns += 1;
    save.bestCombo = Math.max(save.bestCombo||0, runStats.maxCombo);
    save.bestGrazes = Math.max(save.bestGrazes||0, runStats.grazes);
    const isNewBest = score > save.bestScore;
    save.bestScore = Math.max(save.bestScore, Math.floor(score));
    if(!assistActive()){
      save.leaderboard.push({score:Math.floor(score), ship:nm(currentShip,'name'), diff:save.difficulty});
      save.leaderboard.sort((a,b) => b.score-a.score);
      save.leaderboard = save.leaderboard.slice(0,5);
    }
    // 12.1: interest on banked shards, so even a bad run leaves the next one
    // better off than it started.
    if(stats.interest) save.shards += Math.floor(save.shards * stats.interest);
    checkAchievements();
    persistSave();

    endTitleEl.textContent = runStats.won ? T('runComplete') : T('drifterLost');
    finalScoreEl.textContent = Math.floor(score);
    finalScoreEl.classList.add('show');
    runSummaryEl.innerHTML = '';
    const rows = [
      [T('shardsEarned'), '+' + kept],
      [T('reached'), T('wave') + ' ' + wave],
      [T('enemiesDestroyed'), runStats.kills],
      [T('bossesDefeated'), bossesDefeated]
    ];
    if(lostToWreck > 0) rows.push([T('lostInWreck'), '-' + lostToWreck]);
    if(wagered > 0) rows.push([T('wagered'), runStats.won ? ('+' + wagered*2) : ('-' + wagered)]);
    if(isNewBest) rows.unshift([T('newBest'), '']);
    rows.forEach((r, i) => {
      const d = document.createElement('div');
      if(i === 0 && isNewBest) d.className = 'newBest';
      d.textContent = r[1] === '' ? r[0] : (r[0] + '  ' + r[1]);
      runSummaryEl.appendChild(d);
    });
    renderMenu();
    menuView.style.display = 'none';
    endView.style.display = 'flex';
    overlay.classList.remove('hidden');
    setMenuState('root');
    setGameplayUIVisible(false);
  }

  function togglePause(){
    if(!running) return;
    if(menuState === 'relic') return;

  // ==========================================================================
  // Main loop — fixed timestep for the simulation, decoupled from render.
  // ==========================================================================
  let wagered = 0;
  let lastT = performance.now(), accumulator = 0;
  const STEP_MS = 1000/60;
  let fpsAccumTime = 0, fpsFrameCount = 0, fpsDisplay = 60;
  let budgetAccum = 0, budgetFrames = 0, overBudgetStreak = 0, glBailStreak = 0;
  let rafId = null, loopRunning = false;

  function loop(t){
    rafId = requestAnimationFrame(loop);
    let frameTime = t - lastT;
    lastT = t;
    if(frameTime > 250) frameTime = 250;

    fpsAccumTime += frameTime; fpsFrameCount++;
    if(fpsAccumTime >= 500){
      fpsDisplay = Math.round(fpsFrameCount/(fpsAccumTime/1000));
      fpsAccumTime = 0; fpsFrameCount = 0;
    }
    // 2.7: a rolling average, forgiving of transient spikes but not of a
    // sustained trend, stepping quality down in the documented order.
    budgetAccum += frameTime; budgetFrames++;
    if(budgetFrames >= 45){
      const avg = budgetAccum/budgetFrames;
      budgetAccum = 0; budgetFrames = 0;
      if(avg > 20.5){
        overBudgetStreak++;
        if(overBudgetStreak >= 2){ stepQualityDown(); overBudgetStreak = 0; }
        // A WebView that quietly landed on a software rasteriser runs the GL
        // path slower than Canvas2D would. Once the quality ladder is spent
        // and frames are still catastrophic, fall back for good — once, and
        // only on 'auto', so it can never ping-pong and the player can still
        // pick GL again explicitly in settings.
        if(GL_ON && avg > 45 && quality.step >= QUALITY_STEPS.length &&
           (save.settings.renderer || 'auto') === 'auto' && !save.glAutoFellBack){
          glBailStreak++;
          if(glBailStreak >= 3){
            save.glAutoFellBack = true;
            save.settings.renderer = '2d';
            persistSave();
            console.warn('NOVA GL: sustained ' + Math.round(avg) +
                         'ms frames with quality exhausted - reverting to Canvas2D');
            setTimeout(() => { try{ location.reload(); }catch(e){} }, 250);
          }
        }
      } else {
        overBudgetStreak = 0;
        glBailStreak = 0;
      }
    }

    accumulator += frameTime;
    let steps = 0;
    while(accumulator >= STEP_MS && steps < 5){
      if(!paused) update(1);
      accumulator -= STEP_MS;
      steps++;
    }
    draw(Math.min(frameTime/STEP_MS, 3));
    if(running && !paused) updateHUD();
  }
  function startLoop(){
    if(loopRunning) return;
    loopRunning = true;
    lastT = performance.now();
    accumulator = 0;
    rafId = requestAnimationFrame(loop);
  }
  function stopLoop(){
    loopRunning = false;
    if(rafId != null){ cancelAnimationFrame(rafId); rafId = null; }
  }
  // Section 5: no rAF work while the WebView is backgrounded, so the app burns
  // neither battery nor CPU off-screen.
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      stopLoop();
      if(running && !paused) togglePause();
      if(actx) actx.suspend().catch(()=>{});
    } else {
      startLoop();
    }
  });

  // ==========================================================================
  // Save migration and boot
  // ==========================================================================
  // The V3 roster is a strict subset of the V4 one, so a returning player's
  // frames, upgrade levels and progress map forward rather than being dropped.
  const V3_SHIP_MAP = {
    'default':'vanguard', 'vanguard':'aegis', 'interceptor':'lancer',
    'phantom':'phantom', 'juggernaut':'juggernaut'
  };
  const V3_UPGRADE_MAP = {
    lives:'reinforced_hull', firerate:'rapid_cycler', dash:'backup_systems',
    magnet:'magnet_coil', shield:'kinetic_barrier', shardgain:'salvage_protocol',
    bulletspeed:'velocity_rounds', combo:'combo_insurance', buffdur:'powerup_extender',
    luck:'lucky_cache', pierce:'piercing_rounds', scoreamp:'combo_amplifier',
    revive:'emergency_ejection'
  };
  const V3_ACH_MAP = {
    firstblood:'first_blood', firstboss:'boss_slayer', wave10:'ten_waves_deep',
    combo20:'combo_master', richrun:'shard_collector', richrun2:'shard_hoarder'
  };
  function migrateV3(old){
    save.shards = old.shards || 0;
    save.bestScore = old.bestScore || 0;
    save.lifetimeShards = old.lifetimeShards || 0;
    save.totalRuns = old.totalRuns || 0;
    save.difficulty = old.difficulty || 'normal';
    save.leaderboard = Array.isArray(old.leaderboard) ? old.leaderboard.slice(0,5) : [];
    save.settings = Object.assign({}, DEFAULT_SETTINGS, old.settings || {});
    const unlocked = ['vanguard'];
    (old.unlocked || []).forEach(id => {
      const mapped = V3_SHIP_MAP[id];
      if(mapped && unlocked.indexOf(mapped) < 0) unlocked.push(mapped);
    });
    save.unlocked = unlocked;
    save.selected = V3_SHIP_MAP[old.selected] || 'vanguard';
    if(save.unlocked.indexOf(save.selected) < 0) save.selected = 'vanguard';
    save.upgrades = {};
    for(const k in (old.upgrades || {})){
      const id = V3_UPGRADE_MAP[k];
      const def = UPGRADE_BY_ID[id];
      if(id && def && old.upgrades[k] > 0){
        save.upgrades[id] = Math.min(def.maxLevel, old.upgrades[k]);
      }
    }
    save.achievements = {};
    for(const k in (old.achievements || {})){
      const id = V3_ACH_MAP[k];
      if(id) save.achievements[id] = true;
    }
    save.v = 4;
  }

  /** Picks the renderer once, before anything asks #game for a 2D context —
      a canvas that has handed one out can never give a WebGL2 one. */
  function initRenderer(){
    let ok = false;
    // A player on a device with a broken driver can force the 2D path, and
    // the QA harness uses the same switch to exercise the fallback.
    const pref = save.settings.renderer || 'auto';
    const forced2D = pref === '2d' || window.NOVA_FORCE_2D === true;
    try{ ok = forced2D ? false : glInit(); }
    catch(e){ console.warn('NOVA GL: init threw, using Canvas2D', e); ok = false; }
    if(ok){
      GL_ON = true;
      ctx = fxCanvas.getContext('2d');       // text overlay only
      bgCanvas.style.display = 'none';       // the nebula is a shader now
    } else {
      GL_ON = false;
      gl = null;
      ctx = canvas.getContext('2d');
      fxCanvas.style.display = 'none';
    }
    return GL_ON;
  }
  // If the driver drops the context mid-run, hand the frame back to Canvas2D
  // rather than leaving the player on a black screen.
  canvas.addEventListener('webglcontextlost', () => {
    if(ctx === null || ctx.canvas !== canvas){
      bgCanvas.style.display = '';
      fxCanvas.style.display = '';
      markBgDirty();
    }
  }, false);

  async function loadSave(){
    try{
      const raw = await rawGet(SAVE_KEY);
      if(raw){
        const loaded = JSON.parse(raw);
        save = Object.assign(save, loaded);
        save.settings = Object.assign({}, DEFAULT_SETTINGS, loaded.settings || {});
        save.upgrades = Object.assign({}, loaded.upgrades || {});
        save.achievements = Object.assign({}, loaded.achievements || {});
        save.seenEnemies = Object.assign({}, loaded.seenEnemies || {});
        save.enemyKills = Object.assign({}, loaded.enemyKills || {});
        save.hintsSeen = Object.assign({}, loaded.hintsSeen || {});
        save.winsByClass = Object.assign({}, loaded.winsByClass || {});
        if(!Array.isArray(save.unlocked) || !save.unlocked.length) save.unlocked = ['vanguard'];
      } else {
        const legacy = await rawGet(LEGACY_SAVE_KEY);
        if(legacy){
          migrateV3(JSON.parse(legacy));
          await rawSet(SAVE_KEY, JSON.stringify(save));   // V3 is left untouched
        }
      }
    }catch(e){ /* no readable save: defaults stand, nothing is overwritten */ }

    initRenderer();
    if(!SHIP_BY_ID[save.selected]) save.selected = 'vanguard';
    currentShip = getShip(save.selected);
    LANG = save.settings.lang && save.settings.lang !== 'auto' ? save.settings.lang : detectLang();
    applyStaticI18n();
    applyPalette();
    resetQuality();

    initParallax();
    deriveStats();
    applyJoystickSizeToDOM();
    renderMenu();
    renderSettingsUI();
    hintEl.textContent = primaryHintText();

    validateContent();
  }

  /** Section 16: proves every config entry actually resolves to something the
      engine can run, rather than sitting in an array that is never reached.
      Reported on the console at boot; also exposed for the headless harness. */
  function validateContent(){
    const problems = [];
    ENEMIES.forEach(e => {
      if(!MOVEMENTS[e.movement]) problems.push('enemy ' + e.id + ' movement ' + e.movement);
      if(e.attack && !ATTACKS[e.attack]) problems.push('enemy ' + e.id + ' attack ' + e.attack);
      if(e.attack2 && !ATTACKS[e.attack2]) problems.push('enemy ' + e.id + ' attack2 ' + e.attack2);
      if(!ONDEATH[e.onDeath]) problems.push('enemy ' + e.id + ' onDeath ' + e.onDeath);
      if(e.spawns && !ENEMY_BY_ID[e.spawns]) problems.push('enemy ' + e.id + ' spawns ' + e.spawns);
      if(e.splitInto && !ENEMY_BY_ID[e.splitInto]) problems.push('enemy ' + e.id + ' splitInto ' + e.splitInto);
      if(!FACTION_BY_ID[e.faction]) problems.push('enemy ' + e.id + ' faction ' + e.faction);
    });
    SHIPS.forEach(s => {
      if(!PASSIVES[s.passive]) problems.push('ship ' + s.id + ' passive ' + s.passive);
      if(!SHIP_CLASSES.some(c => c.id === s.cls)) problems.push('ship ' + s.id + ' class ' + s.cls);
    });
    ACHIEVEMENTS.forEach(a => {
      if(!CONDITIONS[a.cond]) problems.push('achievement ' + a.id + ' cond ' + a.cond);
      if(!ACH_CATS.some(c => c.id === a.cat)) problems.push('achievement ' + a.id + ' cat ' + a.cat);
    });
    UPGRADES.forEach(u => {
      if(!UPGRADE_CATS.some(c => c.id === u.category)) problems.push('upgrade ' + u.id + ' category ' + u.category);
      if(!u.effect || !u.effect.stat) problems.push('upgrade ' + u.id + ' effect');
    });
    // Every enemy must be buyable by some wave's budget, or it is unreachable.
    const reachable = {};
    for(let w=1; w<=120; w++){
      const savedWave = wave; wave = w;
      buyableFor(activeTier()).forEach(d => { reachable[d.id] = 1; });
      miniBossPool(activeTier()).forEach(d => { reachable[d.id] = 1; });
      if(w >= 40 && (w-40) % 25 === 0) reachable.the_unbound = 1;
      wave = savedWave;
    }
    ENEMIES.forEach(e => {
      if(reachable[e.id]) return;
      // Spawned-only units (larvae, spores, splits) are reached through their
      // parent rather than the wave budget.
      const viaParent = ENEMIES.some(p => p.spawns === e.id || p.splitInto === e.id);
      if(!viaParent) problems.push('enemy ' + e.id + ' unreachable');
    });
    window.NOVA_VALIDATION = {
      problems: problems,
      counts: {enemies:ENEMIES.length, ships:SHIPS.length,
               achievements:ACHIEVEMENTS.length, upgrades:UPGRADES.length,
               factions:FACTIONS.length, movements:Object.keys(MOVEMENTS).length,
               attacks:Object.keys(ATTACKS).length, onDeath:Object.keys(ONDEATH).length,
               passives:Object.keys(PASSIVES).length}
    };
    if(problems.length) console.warn('NOVA content validation:', problems);
    return problems;
  }

      allEnemyIds: function(){ return ENEMIES.map(function(e){ return e.id; }); },
      allShipIds: function(){ return SHIPS.map(function(s){ return s.id; }); },
      equip: function(id){ if(SHIP_BY_ID[id]){ save.selected = id; currentShip = SHIP_BY_ID[id]; if(save.unlocked.indexOf(id)<0) save.unlocked.push(id); return true; } return false; },
      buyAll: function(){ UPGRADES.forEach(function(u){ save.upgrades[u.id] = u.maxLevel; }); deriveStats(); },
      stats: function(){ return stats; }
    };
  }

  setGameplayUIVisible(false);
  loadSave().then(() => { startLoop(); });
})();
</script>
</body>
</html>
