  function totalUpgradeLevels(){
    let n = 0;
    for(const u of UPGRADES) n += upgradeLevel(u.id);
    return n;
  }
  function maxedCategories(){
    let n = 0;
    for(const c of UPGRADE_CATS){
      const list = UPGRADES.filter(u => u.category === c.id);
      if(list.length && list.every(u => upgradeLevel(u.id) >= u.maxLevel)) n++;
    }
    return n;
  }
  function allUpgradesMaxed(){ return UPGRADES.every(u => upgradeLevel(u.id) >= u.maxLevel); }
  function countUnlockedAchievements(){
    let n = 0;
    for(const a of ACHIEVEMENTS){ if(a.id !== 'legend_of_the_drift' && save.achievements[a.id]) n++; }
    return n;
  }
  function achValue(a){
    const fn = CONDITIONS[a.cond];
    if(!fn) return 0;
    const s = runStats || newRunStats();
    return fn(s, a) || 0;
  }
  function achProgress(a){ return clamp(achValue(a)/a.goal, 0, 1); }

  /** Single evaluation pass. Called from the run-state call sites where the
      numbers are known and final (kill, wave clear, boss defeat, damage,
      run end) rather than polled every frame. */
  function checkAchievements(){
    for(let i=0;i<ACHIEVEMENTS.length;i++){
      const a = ACHIEVEMENTS[i];
      if(save.achievements[a.id]) continue;
      if(achValue(a) >= a.goal) unlockAchievement(a.id);
    }
  }

  // ==========================================================================
  // Passive library. Anything a ship does that cannot be written as a number
  // lives here as an optional hook; the engine calls the hook, never a branch
  // on the ship id.
  // ==========================================================================
  const PASSIVES = {
    none: {},
    anti_shield:      {stats(st){ st.shieldBreak = 2.5; }},
    pierce_all:       {stats(st){ st.pierce += 1; }},
    explosive_rounds: {stats(st){ st.splash = Math.max(st.splash, 26); }},
    crit_bonus:       {stats(st){ st.critChance += 0.12; st.critMult += 0.6; }},
    ramp_fire:        {stats(st){ st.rampFire += 0.09; }},
    twin_stream:      {stats(st){ st.extraShots += 1; }},
    low_hp_damage:    {tick(){ const f = 1 + (1 - lives/Math.max(1,maxLives))*0.9; stats.damageDyn = f; }},
    dash_invuln:      {stats(st){ st.dashInvuln += 26; }},
    dash_trail:       {dash(){ dashTrailTimer = 34; }},
    dash_combo_scale: {dash(ctx){ ctx.power *= 1 + Math.min(combo/25, 1.1); }},
    dash_fast_recharge:{stats(st){ st.dashCd *= 0.72; }},
    nearmiss_boost:   {stats(st){ st.nearmiss += 0.25; }},
    double_dash:      {stats(st){ st.dashCharges += 1; }},
    start_shield:     {stats(st){ st.startShield += 1; st.shieldRegen += 0.3; }},
    knockback_resist: {stats(st){ st.knockbackReduce += 0.5; st.contactReduce += 0.2; }},
    pulse_ring:       {tick(dt){
      pulseTimer -= dt;
      if(pulseTimer <= 0){
        pulseTimer = 170;
        spawnShockwave(player.x, player.y, 130, '#ffc24b', 24, 3);
        addLight(player.x, player.y, '#ffc24b', 0.6, 150, 0.12);
        damageEnemiesInRadius(player.x, player.y, 130, 2, 'pulse');
        sfxUltimate();
      }
    }},
    shield_recharge:  {tick(dt){
      if(runStats && runStats.waveDamage === 0){
        cleanTimer += dt;
        if(cleanTimer > 420 && shieldTimer <= 0){ shieldTimer = 420; cleanTimer = 0; sfxPower(); }
      } else { cleanTimer = 0; }
    }},
    immune_per_wave:  {waveStart(){ waveImmune = true; }},
    ally_health:      {stats(st){ st.droneRate += 0.3; st.drones += 0; }},
    fortress:         {stats(st){ st.contactReduce += 0.3; st.lowHpReduce += 0.25; st.knockbackReduce += 0.5; }},
    magnet_big:       {stats(st){ st.magnet += 95; }},
    shard_bonus:      {stats(st){ st.shardGain += 0.3; }},
    extra_drone:      {stats(st){ if(st.drones > 0) st.drones += 1; }},
    buff_duration:    {stats(st){ st.buffDur += 0.45; }},
    reveal_powerups:  {stats(st){ st.radar = 1; }},
    double_powerup:   {}, // handled at the pickup site via passiveIs()
    shop_discount:    {},
    regen:            {stats(st){ st.regen += 0.03; }},
    free_upgrade:     {},
    phase_through:    {stats(st){ st.dashInvuln += 14; st.phaseThrough = 1; }},
    decoy:            {dash(){ spawnDecoy(); }},
    gravity_pull:     {tick(dt){
      for(let i=0;i<enemies.n;i++){
        const e = enemies.items[i];
        if(e.r > 18 || e.isBoss) continue;
        const dx = player.x-e.x, dy = player.y-e.y, d = Math.hypot(dx,dy);
        if(d > 240 || d < 1) continue;
        e.x += (dx/d)*0.28*dt; e.y += (dy/d)*0.28*dt;
      }
      for(let i=0;i<powerups.n;i++){
        const p = powerups.items[i];
        const dx = player.x-p.x, dy = player.y-p.y, d = Math.hypot(dx,dy);
        if(d > 300 || d < 1) continue;
        p.x += (dx/d)*0.9*dt; p.y += (dy/d)*0.9*dt;
      }
    }},
    split_form:       {stats(st){ st.extraShots += 1; st.damageMul = (st.damageMul||1)*0.72; st.dashCd *= 0.8; }},
    every_fourth_crit:{fire(){ shotIndex++; return (shotIndex % 4) === 0; }},
    melee_dash:       {dash(){ meleeDashTimer = 26; }},
    damage_to_shield: {hit(){ shieldCharge = Math.min(1, shieldCharge + 0.34); if(shieldCharge >= 1){ shieldCharge = 0; shieldTimer = Math.max(shieldTimer, 300); popup(player.x, player.y-26, 'FORGED', '#b48cff'); } }},
    random_stat:      {waveStart(){
      // Rerolls one derived stat each wave. High variance by design.
      const keys = ['fireRateMul','speedMul','damageAdd','dashCdMul'];
      paradoxKey = pick(keys);
      paradoxVal = rand(0.65, 1.55);
    }},
    omega: {stats(st){
      // A piece of every other frame's signature kit.
      st.pierce += 1; st.critChance += 0.08; st.critMult += 0.3;
      st.dashInvuln += 16; st.dashCharges += 1; st.magnet += 60;
      st.shardGain += 0.15; st.buffDur += 0.2; st.contactReduce += 0.15;
      st.splash = Math.max(st.splash, 16); st.extraShots += 1; st.regen += 0.015;
    }}
  };
  function shipPassive(){ return PASSIVES[currentShip.passive] || PASSIVES.none; }
  function passiveIs(id){ return currentShip.passive === id; }
  function passiveHook(name, arg){
    const p = shipPassive();
    if(p && typeof p[name] === 'function') return p[name](arg);
    return undefined;
  }

  // --------------------------------------------------------------------------
  // The single stat applier. Ship base -> upgrade deltas -> ascension track ->
  // passive hook -> run relics. One place, one order, no per-item branches.
  // --------------------------------------------------------------------------
  let stats = null;
  const mods = {};
  function deriveStats(){
    for(const k in mods) delete mods[k];
    for(let i=0;i<UPGRADES.length;i++){
      const u = UPGRADES[i];
      const lvl = upgradeLevel(u.id);
      if(!lvl) continue;
      const e = u.effect;
      mods[e.stat] = (mods[e.stat] || 0) + e.perLevel*lvl;
    }
    // 12.4: the ascension track is a small permanent bonus, deliberately
    // narrower than the tree it replaces.
    const asc = save.prestige || 0;
    const ship = currentShip;
    const st = {
      lives:        ship.lives + (mods.maxLives||0) + Math.floor(asc/3),
      fireRate:     ship.fireRate * (1 + (mods.fireCooldown||0)),
      bulletSpeed:  ship.bulletSpeed * (1 + (mods.bulletSpeed||0)),
      damage:       1 + (mods.damage||0) + asc*0.05,
      damageMul:    1,
      damageDyn:    1,
      pierce:       (mods.pierce||0),
      splash:       (mods.splash||0),
      critChance:   (mods.critChance||0),
      critMult:     1.8 + (mods.critMult||0),
      homing:       (mods.homing||0),
      extraShots:   (mods.extraShots||0),
      spread:       (mods.spread||0),
      comboRate:    1 + (mods.comboRate||0),
      comboDecay:   1 + (mods.comboDecay||0),
      execute:      (mods.execute||0),
      rampFire:     (mods.rampFire||0),
      shieldBreak:  1,
      startShield:  (mods.startShield||0),
      shieldRegen:  (mods.shieldRegen||0),
      contactReduce:(mods.contactReduce||0),
      lowHpReduce:  (mods.lowHpReduce||0),
      dodgeChance:  (mods.dodgeChance||0),
      knockbackReduce:(mods.knockbackReduce||0),

      dashPower:    ship.dashPower,
      dashInvuln:   26 + (mods.dashInvuln||0),
      blinkDash:    (mods.blinkDash||0),
      vectorThrust: (mods.vectorThrust||0),
      anchorBreak:  (mods.anchorBreak||0),
      speed:        ship.speedMult * (1 + (mods.speed||0)) * (1 + asc*0.01),
      turnRate:     ship.turnRate * (1 + (mods.turnRate||0)),
      momentum:     (mods.momentum||0),
      driftComp:    (mods.driftComp||0),
      nearmiss:     (mods.nearmiss||0),
      inertiaDamp:  (mods.inertiaDamp||0),

    const p = PASSIVES[ship.passive];
    if(p && p.stats) p.stats(st);
    // Run relics stack on top of everything above.
    st.damage += (runRelics.power||0);
    st.extraShots += (runRelics.twin||0);
    st.speed *= 1 + 0.15*(runRelics.engine||0);
    st.critChance += 0.06*(runRelics.focus||0);
    st.dashCd *= Math.pow(0.85, runRelics.thruster||0);
    // 12.5: the assist dial is the player's own, sits outside difficulty, and
    // is deliberately excluded from leaderboard and achievement eligibility.

  function activeTier(){
    return clamp(1 + Math.floor((wave-1)/5), 1, 9);
  }
  /** 7.2: factions overlap for a two-to-three wave transition window rather
      than hard-cutting, so escalation reads as continuous. */
  function activeFactions(){
    const t = activeTier();
    const out = [];
    for(let i=0;i<FACTIONS.length;i++){
      const f = FACTIONS[i];
      if(t >= f.tiers[0] - 0.5 && t <= f.tiers[1] + 0.5) out.push(f);
    }
    if(!out.length) out.push(FACTIONS[clamp(t-1, 0, FACTIONS.length-1)]);
    return out;
  }
  function primaryFaction(){
    const act = activeFactions();
    // The newest band in play is the one that sets the atmosphere.
    return act[act.length-1];
  }

  // 7.1: a spawn budget, not a fixed enemy count. The spawner buys from the
  // active factions' rosters until the budget is spent; cheap common units
  // cost little, heavy ones cost a lot, and wave composition falls out of that
  // instead of seventy hand-authored layouts.
  function waveBudget(w, cfg){
    return Math.round((16 + w*3.2) * cfg.spawnMult);
  }
  function buyableFor(tier){
    const act = activeFactions();
    const out = [];
    for(let i=0;i<act.length;i++){
      const list = ENEMIES_BY_FACTION[act[i].id];
      for(let j=0;j<list.length;j++){
        const d = list[j];
        if(d.isMiniBoss) continue;
        if(d.tier > tier + 1) continue;
        out.push(d);
      }
    }
    return out;
  }

  function showBanner(text, sub){
    waveBanner.textContent = text;
    if(sub){
      const s = document.createElement('span');
      s.className = 'sub'; s.textContent = sub;
      waveBanner.appendChild(s);
    }
    waveBanner.classList.add('show');
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => waveBanner.classList.remove('show'), 1100);
  }

  const spawnQueue = [];
  function spawnWave(){
    transitioning = true;
    const cfg = diffCfg();
    const tier = activeTier();
    currentFaction = primaryFaction();
    bgDirty = true;

    // 7.5: a named encounter roughly every five waves, escalating in mechanics
    // rather than in stat bloat. Wave 40 is the capstone.
    if(wave % 5 === 0){
      const def = pickMiniBoss(tier);
      if(def){
        showBanner(nm(def,'name'), nm(factionOf(def.faction),'name'));
        sfxStinger(Math.min(6, Math.floor(wave/5)));
        setTimeout(() => { if(running){ spawnBossEncounter(def); } transitioning = false; }, 800);
        return;
      }
    }

    showBanner(T('wave') + ' ' + wave, nm(currentFaction,'name'));
    let budget = waveBudget(wave, cfg);
    const pool = buyableFor(tier);
    if(!pool.length){ transitioning = false; return; }

    spawnQueue.length = 0;
    // 7.4: protect the floor. At most a third of the budget may go to the
    // single most expensive archetype available, so no wave is wall-to-wall
    // worst case even on a bad roll.
    let maxCost = 0;
    for(let i=0;i<pool.length;i++){ if(pool[i].cost > maxCost) maxCost = pool[i].cost; }
    let heavySpend = 0;
    const heavyCap = budget*0.34;
    let guard = 0;
    const usedIds = {};
    const candidates = [];
    while(budget > 0 && guard++ < 240){
      // Bias toward variety: unseen archetypes get first refusal.
      candidates.length = 0;
      for(let i=0;i<pool.length;i++){
        const d = pool[i];
        if(d.cost <= budget && !usedIds[d.id]) candidates.push(d);
      }
      if(!candidates.length){
        for(let i=0;i<pool.length;i++){ if(pool[i].cost <= budget) candidates.push(pool[i]); }
      }
      if(!candidates.length) break;
      const d = pick(candidates);
      if(d.cost >= maxCost && heavySpend + d.cost > heavyCap) continue;
      if(d.cost >= maxCost) heavySpend += d.cost;
      usedIds[d.id] = 1;
      spawnQueue.push(d);
      budget -= d.cost;
    }
    // Guarantee at least one approachable, killable unit every wave (1.5).
    let cheapest = pool[0];
    for(let i=0;i<pool.length;i++){ if(pool[i].cost < cheapest.cost) cheapest = pool[i]; }
    let hasCheap = false;
    for(let i=0;i<spawnQueue.length;i++){ if(spawnQueue[i].cost <= cheapest.cost + 1){ hasCheap = true; break; } }
    if(!hasCheap) spawnQueue.push(cheapest);

    let i = 0;
    const total = spawnQueue.length;
    const stepMs = clamp(1400/Math.max(1,total), 80, 260);
    (function drip(){
      if(!running || bossActive){ transitioning = false; return; }
      if(i >= total){ transitioning = false; return; }
      spawnGroup(spawnQueue[i++]);
      setTimeout(drip, stepMs);
    })();
  }

  function miniBossPool(tier){
    const act = activeFactions();
    const pool = [];
    for(let i=0;i<act.length;i++){
      const list = ENEMIES_BY_FACTION[act[i].id];
      for(let j=0;j<list.length;j++){
        const d = list[j];
        if(d.isMiniBoss && !d.capstone && d.tier <= tier + 1) pool.push(d);
      }
    }
    if(!pool.length){
      for(let i=0;i<ENEMIES.length;i++){ if(ENEMIES[i].isMiniBoss && !ENEMIES[i].capstone){ pool.push(ENEMIES[i]); break; } }
    }
    return pool;
  }
  function pickMiniBoss(tier){
    if(wave >= 40 && (wave - 40) % 25 === 0) return ENEMY_BY_ID.the_unbound;
    const pool = miniBossPool(tier);
    // Escalate: prefer the one the player has met least often, so a repeat
    // boss wave is a new fight rather than the same one with more health.
    pool.sort((a,b) => (save.enemyKills[a.id]||0) - (save.enemyKills[b.id]||0));
    return pool[0];
  }

  function spawnEdgePos(){
    const edge = (Math.random()*4)|0;
    if(edge === 0) return {x: rand(0,W), y: -40};
    if(edge === 1) return {x: W+40, y: rand(0,H)};
    if(edge === 2) return {x: rand(0,W), y: H+40};
    return {x: -40, y: rand(0,H)};
  }

  function spawnGroup(def){
    const n = def.group || 1;
    const base = spawnEdgePos();
    let first = null;
    for(let i=0;i<n;i++){
      const e = spawnEnemy(def, base.x + rand(-46,46), base.y + rand(-46,46));
      if(!e) break;
      if(!first) first = e;
      if(def.movement === 'orbit_cluster'){
        e.anchorX = base.x; e.anchorY = base.y; e.phase = i;
        const a = Math.atan2(H/2-base.y, W/2-base.x);
        e.vx = Math.cos(a)*def.speed; e.vy = Math.sin(a)*def.speed;
      }
      if(i > 0 && first){
        if(def.movement === 'mirror_twin' || def.linkShare){ first.linkTo = e; e.linkTo = first; }
        else if(def.movement === 'escort'){ e.linkTo = first; }
      }
    }
    sfxSpawn(def.faction);
  }

  let enemySeq = 1;
  function spawnEnemy(def, x, y){
    const e = enemies.acquire();
    if(!e) return null;
    const cfg = diffCfg();
    const px = (x == null) ? spawnEdgePos() : null;
    e.active = true; e.def = def; e.faction = def.faction;
    e.x = px ? px.x : x; e.y = px ? px.y : y;
    e.r = def.radius; e.scale = 1;
    // 7.3 dual-track scaling: health and speed creep conservatively, while
    // pattern complexity comes from WHICH archetypes the budget can afford.
    const waveScale = 1 + (wave-1)*0.035;
    e.maxHp = e.hp = Math.max(1, Math.round(def.hp * waveScale * cfg.hpMult));
    const sp = def.speed * (1 + (wave-1)*0.012) * cfg.speedMult;
    const ang = Math.atan2(H/2 - e.y + rand(-80,80), W/2 - e.x + rand(-80,80));
    e.vx = Math.cos(ang)*sp; e.vy = Math.sin(ang)*sp;
    e.hue = def.hue < 0 ? (performance.now()*0.05)%360 : def.hue;
    e.rot = rand(0, Math.PI*2); e.vr = rand(-0.04, 0.04);
    e.t = 0; e.fireTimer = rand(50, 140); e.phase = 0;
    e.seed = enemySeq++; e.state = 0; e.stateTimer = rand(20, 60);
    e.shieldHp = e.maxShieldHp = def.shield || 0;
    e.cloak = def.cloak ? 1 : 0;
    e.alpha = def.cloak ? 0.1 : 1;
    e.telegraph = 0; e.flash = 0; e.squash = 0.55;
    e.anchorX = e.x; e.anchorY = e.y; e.linkTo = null; e.ownerId = 0;
    e.trailN = 0; e.growth = 0; e.tag = 0; e.dmgMul = 1; e.immuneTo = 0;
    e.auraBuff = 0; e.ringCount = 0; e.grazed = 0; e.ax = 0;
    e.isBoss = !!def.isMiniBoss; e.phaseIdx = 0; e.spawnT = performance.now();
    if(!e.verts) e.verts = new Float32Array(10);
    for(let i=0;i<10;i++) e.verts[i] = 0.72 + Math.random()*0.46;
    if(!save.seenEnemies[def.id]){ save.seenEnemies[def.id] = 1; persistSave(); }
    if(runStats) runStats.factionsSeen[def.faction] = 1;
    return e;
  }

  function spawnBossEncounter(def){

  function releaseEnemyAt(i){

  // --------------------------------------------------------------------------
  // Input — real-time control (1.1): every action reads back within a frame.
  // --------------------------------------------------------------------------
  const keys = {};
  let mouseX = 0, mouseY = 0, mouseUsed = false;
  let touchActive = false, moveTouchId = null;
  const touchVec = {x:0, y:0}, moveOrigin = {x:0, y:0};
  let aimTouchActive = false, aimTouchId = null;
  const aimVecTouch = {x:0, y:0}, aimOrigin = {x:0, y:0};

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(e.code === 'Space'){ e.preventDefault(); triggerDash(); }
    if(e.key === 'Shift'){ e.preventDefault(); triggerUltimate(); }
    if(e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ togglePause(); }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; mouseUsed = true; });

  function handleStart(e){
    mouseUsed = false;
    for(let i=0;i<e.changedTouches.length;i++){
      const t = e.changedTouches[i];
      if(t.target && t.target.closest && t.target.closest('button')) continue;
      const id = t.identifier;
      if(t.clientX < W*0.5){
        if(moveTouchId === null){
          moveTouchId = id;
          moveOrigin.x = t.clientX; moveOrigin.y = t.clientY;
          touchActive = true;
          joyBase.style.display = 'block'; joyKnob.style.display = 'block';
          joyBase.style.left = moveOrigin.x+'px'; joyBase.style.top = moveOrigin.y+'px';
          joyKnob.style.left = moveOrigin.x+'px'; joyKnob.style.top = moveOrigin.y+'px';
        }
      } else if(aimTouchId === null){
        aimTouchId = id;
        aimOrigin.x = t.clientX; aimOrigin.y = t.clientY;
        aimTouchActive = true;
        joyBase2.style.display = 'block'; joyKnob2.style.display = 'block';
        joyBase2.style.left = aimOrigin.x+'px'; joyBase2.style.top = aimOrigin.y+'px';
        joyKnob2.style.left = aimOrigin.x+'px'; joyKnob2.style.top = aimOrigin.y+'px';
      }
    }
  }
  function handleMove(e){
    const max = 50 * joystickMult();
    for(let i=0;i<e.changedTouches.length;i++){
      const t = e.changedTouches[i];
      const id = t.identifier;
      if(id === moveTouchId){
        const dx = t.clientX-moveOrigin.x, dy = t.clientY-moveOrigin.y;
        const dist = Math.min(Math.hypot(dx,dy), max), ang = Math.atan2(dy,dx);
        touchVec.x = Math.cos(ang)*(dist/max); touchVec.y = Math.sin(ang)*(dist/max);
        joyKnob.style.left = (moveOrigin.x+Math.cos(ang)*dist)+'px';
        joyKnob.style.top  = (moveOrigin.y+Math.sin(ang)*dist)+'px';
      } else if(id === aimTouchId){
        const dx = t.clientX-aimOrigin.x, dy = t.clientY-aimOrigin.y;
        const dist = Math.min(Math.hypot(dx,dy), max);
        if(dist > 6){
          const ang = Math.atan2(dy,dx);
          aimVecTouch.x = Math.cos(ang); aimVecTouch.y = Math.sin(ang);
          joyKnob2.style.left = (aimOrigin.x+Math.cos(ang)*dist)+'px';
          joyKnob2.style.top  = (aimOrigin.y+Math.sin(ang)*dist)+'px';
        }
      }
    }
  }
  function handleEnd(e){
    for(let i=0;i<e.changedTouches.length;i++){
      const id = e.changedTouches[i].identifier;
      if(id === moveTouchId){
        moveTouchId = null; touchActive = false; touchVec.x = touchVec.y = 0;
        joyBase.style.display = 'none'; joyKnob.style.display = 'none';
      } else if(id === aimTouchId){
        aimTouchId = null; aimTouchActive = false;
        joyBase2.style.display = 'none'; joyKnob2.style.display = 'none';
      }
    }
  }
  wrap.addEventListener('touchstart', handleStart, {passive:true});
  wrap.addEventListener('touchmove', handleMove, {passive:true});
  wrap.addEventListener('touchend', handleEnd, {passive:true});
  wrap.addEventListener('touchcancel', handleEnd, {passive:true});

  dashBtn.addEventListener('touchstart', e => { e.preventDefault(); triggerDash(); }, {passive:false});
  dashBtn.addEventListener('click', () => triggerDash());
  ultBtn.addEventListener('touchstart', e => { e.preventDefault(); triggerUltimate(); }, {passive:false});
  ultBtn.addEventListener('click', () => triggerUltimate());

  function applyJoystickSizeToDOM(){
    const mult = joystickMult();
    const baseSize = 110*mult, knobSize = 64*mult;
    joyBase.style.width = joyBase.style.height = baseSize+'px';
    joyBase2.style.width = joyBase2.style.height = baseSize+'px';
    joyKnob.style.width = joyKnob.style.height = knobSize+'px';
    joyKnob2.style.width = joyKnob2.style.height = knobSize+'px';
  }
  function dirFromInput(){
    let dx = 0, dy = 0;
    if(keys['a'] || keys['arrowleft'])  dx -= 1;
    if(keys['d'] || keys['arrowright']) dx += 1;
    if(keys['w'] || keys['arrowup'])    dy -= 1;
    if(keys['s'] || keys['arrowdown'])  dy += 1;
    if(touchActive){ dx += touchVec.x; dy += touchVec.y; }
    return {dx:dx, dy:dy};
  }

  // --------------------------------------------------------------------------
  // Player abilities
  // --------------------------------------------------------------------------
  function applySlow(factor, frames){
    if(stats && stats.anchorBreak) return;
    slowFactor = Math.min(slowFactor, factor);
    slowTimer = Math.max(slowTimer, frames);
  }
  function triggerDash(){
    if(!running || paused) return;
    if(dashCharges <= 0) return;
    dashCharges--;
    if(dashCooldown <= 0) dashCooldown = stats.dashCd;
    const ang = player.a;
    const ctx2 = {power: stats.dashPower};
    passiveHook('dash', ctx2);
    if(stats.blinkDash){
      // 1.1: a teleport still respects the arena bounds so it never feels
      // like the input was eaten.
      player.x = clamp(player.x + Math.cos(ang)*110, player.r, W-player.r);
      player.y = clamp(player.y + Math.sin(ang)*110, player.r, H-player.r);
      spawnParticles(player.x, player.y, 'rgba(61,240,255,0.8)', 14, 4, 22, true);
    } else {
      player.vx += Math.cos(ang)*ctx2.power;
      player.vy += Math.sin(ang)*ctx2.power;
    }
    invuln = Math.max(invuln, stats.dashInvuln);
    slowTimer = 0; slowFactor = 1;
    vectorUsed = false;
    spawnParticles(player.x - Math.cos(ang)*10, player.y - Math.sin(ang)*10, 'rgba(61,240,255,0.8)', 14, 4, 22, true);
    addLight(player.x, player.y, currentShip.color, 0.4, 80, 0.15);
    lastPlayerAbility = 'dash';
    sfxDash(); vibrate(12);
    showContextHint('hintDash');
  }
  function triggerUltimate(){
    if(!running || paused || !ultReady) return;
    ultReady = false; ultCharge = 0;
    lastPlayerAbility = 'ultimate';
    // 1.3 anticipation is the charge bar itself; impact is here.
    spawnShockwave(player.x, player.y, Math.max(W,H)*0.55, currentShip.color, 34, 5);
    addLight(player.x, player.y, currentShip.color, 1.2, 260, 0.06);
    addShake(14);
    requestFlash(0.2);
    damageEnemiesInRadius(player.x, player.y, Math.max(W,H)*0.55, 6 + stats.damage*2, 'ultimate');
    for(let i=enemyBullets.n-1;i>=0;i--){
      const b = enemyBullets.items[i];
      if(Math.hypot(b.x-player.x, b.y-player.y) < 280){
        spawnParticles(b.x, b.y, 'rgba(234,242,255,0.8)', 2, 1.6, 14);
        enemyBullets.releaseAt(i);
      }
    }
    sfxUltimate(); vibrate(60);
  }
  function spawnDecoy(){
    decoy = {x:player.x, y:player.y, life:210};
  }

  function damageEnemiesInRadius(x, y, r, dmg, source){
    const near = nearEnemies(x, y, r);
    for(let i=near.length-1;i>=0;i--){
      const e = near[i];
      if(!e.active) continue;
      const d = Math.hypot(e.x-x, e.y-y);
      if(d > r + e.r) continue;
      hurtEnemy(e, dmg, source, x, y);
    }
  }

  /** All damage to an enemy funnels here so shields, immunities, linked pairs
      and the bestiary counters have exactly one place to be honoured. */
  function hurtEnemy(e, dmg, source, hx, hy){
    if(!e.active || e.hp <= 0) return false;
    if(e.state === 1 && e.def.movement === 'phase_shift') return false;  // untargetable phase
    // Null Sentinel: immune to one damage type at a time (1=shot,2=splash,3=ult)
    if(e.immuneTo){
      const kind = source === 'ultimate' ? 3 : (source === 'splash' || source === 'pulse' ? 2 : 1);
      if(kind === e.immuneTo){
        spawnParticles(hx == null ? e.x : hx, hy == null ? e.y : hy, 'rgba(234,242,255,0.6)', 3, 1.5, 10);
        popup(e.x, e.y - e.r - 6, STATE_GLYPH.immune, '#eaf2ff', 0.9);
        return false;
      }
    }
    let d = dmg;
    if(e.shieldHp > 0){
      d *= (stats ? stats.shieldBreak : 1);
      e.shieldHp -= d;
      spawnParticles(hx == null ? e.x : hx, hy == null ? e.y : hy, 'rgba(190,140,255,0.9)', 5, 2, 16);
      if(e.shieldHp <= 0){ e.shieldHp = 0; spawnShockwave(e.x, e.y, e.r*2, '#be8cff', 16, 2); }
      e.flash = 6;
      return false;
    }
    // Execution Protocol pays off specifically on nearly-dead targets.
    if(stats && stats.execute && e.hp <= e.maxHp*0.25) d *= 1 + stats.execute;
    e.hp -= d;
    e.flash = 8;
    e.squash = Math.min(1, e.squash + 0.35);
    if(e.def.linkShare && e.linkTo && e.linkTo.active){
      e.linkTo.hp -= d*0.6;
      e.linkTo.flash = 6;
      if(e.linkTo.hp <= 0) killEnemy(e.linkTo, true);
    }
    if(e.hp <= 0){
      if(d >= e.maxHp*5 && runStats) runStats.overkill = 1;
      killEnemy(e, true, d);
      return true;
    }
    return false;
  }

  // --------------------------------------------------------------------------
  // Kills, pickups, player damage — the run-state call sites achievements and
  // the bestiary hook into (Section 14).
  // --------------------------------------------------------------------------
  function killEnemy(e, byPlayer, dmg){
    if(!e.active) return;
    const def = e.def;
    const big = e.r > 24 || e.isBoss;
    const faction = e.faction;
    const x = e.x, y = e.y;

    const fn = ONDEATH[def.onDeath] || ONDEATH.small;
    fn(e);
    sfxDeath(faction, big);
    vibrate(big ? 30 : 8);
    // 1.3: shake scaled to the event, never flat. A Chunk barely registers.
    addShake(e.isBoss ? 20 : (big ? 6 : 2.5));
    if(e.isBoss){ hitStop = 5; }

    if(byPlayer){
      combo += 1;
      if(combo > (runStats ? runStats.maxCombo : 0) && runStats) runStats.maxCombo = combo;
      comboTimer = (90 + 20) * (stats ? stats.comboDecay : 1);
      const greed = 1 + 0.25*(runRelics.greed||0);
      const gained = Math.round(100 * combo * greed * (stats ? stats.comboRate : 1));
      score += gained;
      popup(x, y, '+'+gained, null, big ? 1.25 : 1);
      if(combo > 1 && combo % 3 === 0) sfxCombo();

      // Ultimate charges off kills, so the panic button is earned in-run.
      ultCharge = Math.min(1, ultCharge + (e.isBoss ? 0.5 : (big ? 0.05 : 0.022)));
      if(ultCharge >= 1 && !ultReady){
        ultReady = true;
        showContextHint('hintUlt');
        sfxStinger(2);
      }

      if(runStats){
        runStats.kills++;
        if(faction === 'drifter_swarm') runStats.rocks++;
        const now = performance.now();
        runStats.chainTimes.push(now);
        while(runStats.chainTimes.length && now - runStats.chainTimes[0] > 1000) runStats.chainTimes.shift();
        if(runStats.chainTimes.length > runStats.chainBest) runStats.chainBest = runStats.chainTimes.length;
        if(def.attack === 'copy_ability' && e.tag === lastPlayerAbility) runStats.mirrorMatch = 1;
      }
      save.lifetimeKills = (save.lifetimeKills||0) + 1;
      if(faction === 'drifter_swarm') save.lifetimeRocks = (save.lifetimeRocks||0) + 1;
      save.enemyKills[def.id] = (save.enemyKills[def.id]||0) + 1;

      // Shard economy: salvage chance, combo economy, ship passives.
      let shardDrop = 0;
      if(Math.random() < (stats ? stats.salvageChance : 0)) shardDrop += 2 + (wave*0.2);
      if(e.isBoss) shardDrop += 120 * (1 + (stats ? stats.bossShards : 0));
      if(shardDrop > 0) spawnPowerup(x, y, 'shard', Math.round(shardDrop));

      if(runRelics.vampire && Math.random() < 0.15*runRelics.vampire){
        shieldTimer = Math.min(shieldTimer + 90, 420);
        spawnParticles(player.x, player.y, 'rgba(255,143,192,0.7)', 8, 2, 20);
      }
      if(runRelics.chain && Math.random() < 0.2*runRelics.chain){
        const near = nearEnemies(x, y, 190);
        for(let i=0;i<near.length;i++){
          const o = near[i];
          if(o !== e && o.active){
            spawnParticles(o.x, o.y, 'rgba(190,140,255,0.9)', 6, 2, 16);
            hurtEnemy(o, dmg || 1, 'chain', o.x, o.y);
            break;
          }
        }
      }
      maybeSpawnPower(x, y);
    }

    if(e.isBoss){
      bossesDefeated++;
      save.lifetimeBosses = (save.lifetimeBosses||0) + 1;
      if(runStats){
        runStats.bosses++;
        const t = performance.now() - runStats.bossStartMs;
        if(t < runStats.bossFastest) runStats.bossFastest = t;
        if(runStats.bossDamage === 0) runStats.bossNoDamage++;
      }
      const bonus = Math.round(2000 * (1 + wave*0.05));
      score += bonus;
      popup(x, y-24, '+'+bonus, '#ffc24b', 1.4);
      requestFlash(0.3);
      if(def.capstone){
        if(runStats) runStats.won = true;
        save.achievements.__capstone = true;
        showBanner(T('runComplete'), nm(def,'name'));
        registerWin();
      } else {
        showBanner(T('sectorClear'), nm(factionOf(faction),'name'));
      }
      boss = null; bossActive = false;
      // 1.4: a deliberate breather beat after every boss before the next ramp.
      transitioning = true;
      setTimeout(() => { if(running){ advanceWave(true); } }, def.capstone ? 2400 : 1600);
    }

    removeEnemy(e);
    updateHUD();
    checkAchievements();
  }

  function registerWin(){
    if(!runStats) return;
    runStats.won = true;
    save.winsByClass = save.winsByClass || {};
    if(!assistActive()) save.winsByClass[runStats.shipClass] = 1;
    persistSave();
  }

  function maybeSpawnPower(x, y){
    const luck = stats ? stats.luck : 0;
    if(Math.random() >= 0.16 + luck) return;
    const pool = ['rapid','rapid','shield','shield','spread','spread','homing','homing','drone'];
    if(Math.random() < 0.10) pool.push('bomb');
    if(Math.random() < 0.05) pool.push('life');
    spawnPowerup(x, y, pick(pool), 0);
  }
  function spawnPowerup(x, y, type, amount){
    const p = powerups.acquireOrRecycle();
    if(!p) return;
    p.x = x; p.y = y;
    p.vx = rand(-0.5,0.5); p.vy = rand(-0.5,0.5);
    p.type = type; p.r = 12; p.pulse = 0; p.life = amount || 0;
    // Uncollected drops fade rather than sitting forever: an unbounded field of
    // pickups both reads as clutter and starves the pool of later drops.
    p.ttl = 900;
  }

  function applyPowerup(type, x, y, amount){
    const bm = stats.buffDur;
    const dbl = passiveIs('double_powerup') && Math.random() < 0.35;
    if(runStats) runStats.powerups++;
    if(type === 'shard'){
      const gain = Math.max(1, Math.round(amount * (1 + stats.shardGain*Math.min(combo,20)/20)));
      runShards += gain;
      popup(x, y, '+'+gain, '#78ffaa');
      sfxPower();
      showContextHint('hintShard');
      return;
    }
    if(type === 'rapid'){ rapidTimer = 360*bm*(dbl?1.6:1); popup(x,y,'RAPID','#3df0ff'); }
    else if(type === 'shield'){ shieldTimer = 420*bm*(dbl?1.6:1); popup(x,y,'SHIELD','#ffc24b'); showContextHint('hintShield'); }
    else if(type === 'spread'){ spreadTimer = 420*bm*(dbl?1.6:1); popup(x,y,'SPREAD','#78ffaa'); }
    else if(type === 'homing'){ homingTimer = 420*bm*(dbl?1.6:1); popup(x,y,'HOMING','#be8cff'); }
    else if(type === 'drone'){
      if(droneTimer <= 0){ droneAngle = 0; droneFireTimer = 0; }
      droneTimer = 900*bm*(dbl?1.6:1); popup(x,y,'DRONE','#4bffe0');
      showContextHint('hintDrone');
    }
    else if(type === 'bomb'){
      let cleared = 0;
      damageEnemiesInRadius(W/2, H/2, Math.max(W,H), 999, 'ultimate');
      cleared = 1;
      enemyBullets.clear();
      addShake(16); requestFlash(0.45);
      popup(x, y, T('boom'), '#ff5050', 1.4);
      spawnShockwave(W/2, H/2, Math.max(W,H)*0.7, '#ff5050', 34, 5);
      if(cleared) score += 400;
    }
    else if(type === 'life'){
      if(lives < maxLives){ lives += 1; popup(x,y,'+1','#ff8fc0'); }
      else { score += 500; popup(x,y,'+500','#ff8fc0'); }
      updateHUD();
    }
    spawnParticles(x, y, 'rgba(234,242,255,0.85)', 16, 3, 26, true);
    addLight(x, y, POWER_COLOR[type] || '#3df0ff', 0.5, 100, 0.12);
    sfxPower();
  }

  function damagePlayer(amount){
    if(invuln > 0) return false;
    // Debris Deflection: a clean, fully negated hit reads as a save, not a bug.
    if(Math.random() < stats.dodgeChance){
      popup(player.x, player.y-24, 'DEFLECT', '#3df0ff');
      spawnParticles(player.x, player.y, 'rgba(61,240,255,0.8)', 10, 2.5, 20);
      invuln = Math.max(invuln, 14);
      sfxHit();
      return false;
    }
    if(shieldTimer > 0){
      shieldTimer = 0;
      addShake(8);
      spawnShockwave(player.x, player.y, 60, '#ffc24b', 18, 3);
      spawnParticles(player.x, player.y, 'rgba(255,194,75,0.9)', 22, 4, 30, true);
      invuln = Math.max(invuln, 30 + stats.iframeOnHit);
      passiveHook('hit');
      sfxHit(); vibrate(20);
      return false;
    }
    let dmg = amount || 1;
    // 12.5: the player's own assist dial, applied last and only here.
    dmg *= (1 - stats.assist);
    dmg *= (1 - Math.min(0.6, stats.contactReduce));
    if(lives <= 2) dmg *= (1 - Math.min(0.6, stats.lowHpReduce));
    const lost = Math.max(1, Math.round(dmg));

    lives -= lost;
    combo = 1;
    invuln = 110 + stats.iframeOnHit;
    addShake(14);
    spawnParticles(player.x, player.y, 'rgba(255,46,136,0.9)', 28, 5, 38, true);
    addLight(player.x, player.y, '#ff2e88', 0.7, 140, 0.1);
    passiveHook('hit');
    sfxHit(); vibrate(30);
    if(runStats){ runStats.damageTaken += lost; runStats.waveDamage += lost; runStats.bossDamage += lost; runStats.flawlessStreak = 0; }
    updateHUD();
    if(lives === 1 && runStats) runStats.oneHpEvents++;

    if(lives <= 0){
      if(stats.lastWord && !lastWordUsed){
        lastWordUsed = true;
        damageEnemiesInRadius(player.x, player.y, 260, 8, 'ultimate');
        spawnShockwave(player.x, player.y, 260, '#ff2e88', 30, 5);
        addShake(18);
      }
      if(stats.revive && !revivedUsed){
        revivedUsed = true;
        if(runStats) runStats.revives++;
        lives = 1; shieldTimer = 180; invuln = 150;
        addShake(18);
        spawnParticles(player.x, player.y, '#ffc24b', 34, 5, 46, true);
        popup(player.x, player.y-24, T('revived'), '#ffc24b', 1.3);
        sfxPower(); vibrate(80);
        updateHUD();
        return false;
      }
      endGame();
      return true;
    }
    return false;
  }

  function advanceWave(afterBoss){
    wave += 1;
    if(runStats){
      runStats.wave = wave;
      if(runStats.waveDamage === 0){
        runStats.flawlessWaves++;
        runStats.flawlessStreak++;
        if(stats.waveBonus) runShards += Math.round(20*wave*stats.waveBonus);
      }
      runStats.waveDamage = 0;
    }
    if(stats.waveHeal && lives < maxLives && Math.random() < stats.waveHeal){
      lives = Math.min(maxLives, lives + 1);
    }
    waveImmune = false;
    passiveHook('waveStart');
    if(wave > save.bestWave){ save.bestWave = wave; persistSave(); }
    updateHUD();
    checkAchievements();
    transitioning = true;
    maybeOfferRelic(() => spawnWave());
  }

  function maybeOfferRelic(cb){
    if(wave % 3 === 0){ showRelicPicker(cb); }
    else { cb(); }
  }

  // ==========================================================================
  // Simulation. Fixed timestep (2.3): everything here scales by dt, nothing by
  // a bare frame count, so a 60Hz and a 120Hz device play the same game.
  // ==========================================================================
  let hitStop = 0;

  function update(dt){
    if(!running) return;
    // 1.3 impact: a short freeze on a heavy hit, spent before anything moves.
    if(hitStop > 0){ hitStop -= dt; return; }

    if(runStats) runStats.wave = wave;

    // ---- player ----------------------------------------------------------
    const input = dirFromInput();
    let dx = input.dx, dy = input.dy;
    const mag = Math.hypot(dx, dy);
    if(slowTimer > 0){ slowTimer -= dt; if(slowTimer <= 0) slowFactor = 1; }
    let speedMul = stats.speed * slowFactor;
    if(paradoxKey === 'speedMul') speedMul *= paradoxVal;
    const accel = 0.55 * speedMul;
    if(mag > 0.05){
      player.vx += (dx/Math.max(mag,1))*accel;
      player.vy += (dy/Math.max(mag,1))*accel;
    }
    // Simulated space (1.1): the hull carries momentum instead of stopping dead.
    const drag = Math.pow(0.92 + stats.momentum*0.03, dt);
    player.vx *= drag; player.vy *= drag;
    // Drift Compensator: bleed speed specifically when the stick is pushed
    // against current travel, which is exactly where overshoot is felt.
    if(stats.driftComp && mag > 0.05){
      const dot = (dx*player.vx + dy*player.vy)/(Math.max(mag,0.001)*Math.max(Math.hypot(player.vx,player.vy),0.001));
      if(dot < -0.2){
        const bleed = Math.pow(1 - stats.driftComp*0.5, dt);
        player.vx *= bleed; player.vy *= bleed;
      }
    }
    // Vector Thrust: one mid-dash redirect, while the dash i-frames are live.
    if(stats.vectorThrust && !vectorUsed && invuln > 6 && mag > 0.05){
      const cur = Math.atan2(player.vy, player.vx);
      const want = Math.atan2(dy, dx);
      if(Math.abs(angDiff(want, cur)) > 0.8){
        const s2 = Math.hypot(player.vx, player.vy);
        if(s2 > 4){
          player.vx = Math.cos(want)*s2; player.vy = Math.sin(want)*s2;
          vectorUsed = true;
          spawnParticles(player.x, player.y, 'rgba(190,140,255,0.8)', 8, 3, 18, true);
        }
      }
    }
    const maxSpeed = 6.4 * speedMul * (nearMissBoost > 0 ? 1.35 : 1);
    const sp = Math.hypot(player.vx, player.vy);
    if(sp > maxSpeed){ player.vx = player.vx/sp*maxSpeed; player.vy = player.vy/sp*maxSpeed; }
    player.x += player.vx*dt; player.y += player.vy*dt;
    player.x = clamp(player.x, player.r, W-player.r);
    player.y = clamp(player.y, player.r, H-player.r);
    if(nearMissBoost > 0) nearMissBoost -= dt;

    // Aim
    let desiredAngle = player.a;
    let turnRate = stats.turnRate;
    if(aimTouchActive){
      desiredAngle = Math.atan2(aimVecTouch.y, aimVecTouch.x); turnRate = 0.5;
    } else if(mouseUsed && !touchActive){
      desiredAngle = Math.atan2(mouseY-player.y, mouseX-player.x); turnRate = 0.5;
    } else if(mag > 0.05){
      desiredAngle = Math.atan2(dy, dx);
      if(save.settings.aimAssist){
        const t = nearestTarget(player.x, player.y);
        if(t){
          const dtar = Math.hypot(t.x-player.x, t.y-player.y);
          if(dtar < 320){
            const d = angDiff(Math.atan2(t.y-player.y, t.x-player.x), desiredAngle);
            if(Math.abs(d) < 0.6) desiredAngle += d*0.3;
          }
        }
      }
    }
    player.a += angDiff(desiredAngle, player.a) * clamp(turnRate*dt, 0, 1);
    // Squash & stretch: the hull banks into a turn instead of pivoting flat.
    player.bank += (clamp(angDiff(desiredAngle, player.a)*1.4, -0.6, 0.6) - player.bank)*0.2*dt;

    if(mag > 0.05 && particleMult() > 0.5){
      spawnParticles(player.x - Math.cos(player.a)*14, player.y - Math.sin(player.a)*14,
        'rgba(61,240,255,0.5)', 1, 1.2, 20, true);
    }
    pushTrail(player);

    // ---- firing ----------------------------------------------------------
    fireTimer -= dt;
    let rate = stats.fireRate;
    if(paradoxKey === 'fireRateMul') rate *= paradoxVal;
    if(rapidTimer > 0) rate *= 0.55;
    if(stats.rampFire){
      rampHeat = Math.min(1, rampHeat + 0.012*dt);
      rate *= 1 - stats.rampFire*rampHeat*4;
    }
    rate = Math.max(2, rate);
    if(fireTimer <= 0){
      fireTimer = rate;
      fireShot();
    }
    if(!keys[' '] && mag <= 0.05) rampHeat = Math.max(0, rampHeat - 0.004*dt);

    // ---- timers ----------------------------------------------------------
    if(rapidTimer > 0) rapidTimer -= dt;
    if(shieldTimer > 0) shieldTimer -= dt;
    if(spreadTimer > 0) spreadTimer -= dt;
    if(homingTimer > 0) homingTimer -= dt;
    if(invuln > 0) invuln -= dt;
    if(dashTrailTimer > 0) dashTrailTimer -= dt;
    if(meleeDashTimer > 0) meleeDashTimer -= dt;
    if(revealTimer > 0) revealTimer -= dt;
    if(dashCharges < stats.dashCharges){
      dashCooldown -= dt;
      if(dashCooldown <= 0){
        dashCharges = Math.min(stats.dashCharges, dashCharges + 1);
        if(dashCharges < stats.dashCharges) dashCooldown = stats.dashCd;
      }
    }
    if(runRelics.fortify && shieldTimer < 300){
      shieldTimer = Math.min(shieldTimer + 0.05*runRelics.fortify*dt, 300);
    }
    if(stats.shieldRegen && shieldTimer <= 0){
      shieldRegenAcc += stats.shieldRegen*dt;
      if(shieldRegenAcc > 260){ shieldRegenAcc = 0; shieldTimer = 300; }
    }
    if(stats.regen){
      regenAcc += stats.regen*dt;
      if(regenAcc >= 60){ regenAcc = 0; if(lives < maxLives){ lives++; updateHUD(); } }
    }
    if(flashAlpha > 0) flashAlpha *= Math.pow(0.85, dt);
    if(shake > 0) shake *= Math.pow(0.88, dt);
    passiveHook('tick', dt);
    updateDashBtnUI();

    if(comboTimer > 0) comboTimer -= dt;
    else if(combo > 1){ combo = 1; updateHUD(); }

    // ---- drones ----------------------------------------------------------
    const droneCount = (droneTimer > 0 ? 1 : 0) + stats.drones;
    if(droneCount > 0){
      if(droneTimer > 0) droneTimer -= dt;
      droneAngle += 0.05*dt;
      droneFireTimer -= dt*stats.droneRate;
      if(droneFireTimer <= 0){
        for(let k=0;k<droneCount;k++){
          const a = droneAngle + (k/droneCount)*Math.PI*2;
          const ddx = player.x + Math.cos(a)*34, ddy = player.y + Math.sin(a)*34;
          const t = nearestTarget(ddx, ddy);
          if(!t) continue;
          const b = bullets.acquire();
          if(!b) break;
          const ang = Math.atan2(t.y-ddy, t.x-ddx);
          b.x = ddx; b.y = ddy; b.vx = Math.cos(ang)*8; b.vy = Math.sin(ang)*8;
          b.life = 60; b.homing = false; b.pierce = 0; b.dmg = stats.damage*0.7;
          b.fromDrone = true; b.splash = 0; b.crit = false; b.r = 2.2; b.warp = 0;
        }
        droneFireTimer = 40;
      }
    }
    updateBuffs();

    // ---- spatial grid, rebuilt once per step (2.2) ------------------------
    gridBuild();

    // ---- player bullets --------------------------------------------------
    for(let i=bullets.n-1;i>=0;i--){
      const b = bullets.items[i];
      if(b.homing){
        const t = nearestTarget(b.x, b.y);
        if(t){
          const cur = Math.atan2(b.vy, b.vx);
          const na = cur + clamp(angDiff(Math.atan2(t.y-b.y, t.x-b.x), cur), -0.16*dt, 0.16*dt);
          const s = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na)*s; b.vy = Math.sin(na)*s;
        }
      }
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      if(b.life <= 0 || !onScreen(b.x, b.y, 30)){ bullets.releaseAt(i); continue; }

      const near = nearEnemies(b.x, b.y, 40);
      let consumed = false;
      for(let j=0;j<near.length;j++){
        const e = near[j];
        if(!e.active) continue;
        if(e.alpha < 0.3 && e.cloak) continue;      // cannot hit what is not there
        const hitR = e.r*(e.def.frontShield ? 1 : 0.95);
        if(Math.hypot(b.x-e.x, b.y-e.y) > hitR) continue;
        // A directional shield must be flanked: hits from the facing arc bounce.
        if(e.def.frontShield){
          const toB = Math.atan2(b.y-e.y, b.x-e.x);
          if(Math.abs(angDiff(toB, e.rot)) < 1.1){
            spawnParticles(b.x, b.y, 'rgba(234,242,255,0.7)', 3, 1.6, 12);
            bullets.releaseAt(i); consumed = true;
            break;
          }
        }
        let dmg = b.dmg * (stats.damageMul||1) * (stats.damageDyn||1);
        if(b.crit) dmg *= stats.critMult;
        if(e.shieldHp > 0 && stats.shieldBreak > 1) dmg *= 1;
        const killed = hurtEnemy(e, dmg, b.splash ? 'splash' : 'shot', b.x, b.y);
        if(b.splash > 0){
          spawnShockwave(b.x, b.y, b.splash, '#ff8f3d', 14, 2);
          damageEnemiesInRadius(b.x, b.y, b.splash, dmg*0.5, 'splash');
        }
        if(b.pierce > 0){ b.pierce -= 1; }
        else { bullets.releaseAt(i); consumed = true; }
        if(!killed) spawnParticles(b.x, b.y, `hsla(${e.hue},90%,65%,0.9)`, 4, 2.2, 16, true);
        break;
      }
      if(consumed) continue;
    }

    // ---- enemies ---------------------------------------------------------
    buffSourceCount = 0;
    for(let i=0;i<enemies.n;i++){
      const o = enemies.items[i];
      if(o.auraBuff === 1) buffSources[buffSourceCount++] = o;
    }
    for(let i=enemies.n-1;i>=0;i--){
      if(i >= enemies.n) continue;      // a callback shrank the pool under us
      const e = enemies.items[i];
      if(!e.active) continue;
      const def = e.def;
      if(e.flash > 0) e.flash -= dt;
      if(e.squash > 0) e.squash = Math.max(0, e.squash - 0.06*dt);
      if(def.cloak && e.def.movement === 'stationary'){
        const d = Math.hypot(player.x-e.x, player.y-e.y);
        e.alpha = d < def.radius*7 ? Math.min(1, e.alpha + 0.08*dt) : Math.max(0.08, e.alpha - 0.04*dt);
      }
      const mv = MOVEMENTS[def.movement];
      if(mv) mv(e, dt);
      if(def.attack){
        const buffed = enemyBuffed(e) ? 1.6 : 1;
        const at = ATTACKS[def.attack];
        if(at) at(e, dt*buffed);
      }
      if(def.attack2){
        const at2 = ATTACKS[def.attack2];
        if(at2) at2(e, dt);
      }
      if(e.hp <= 0){ killEnemy(e, true, 1); continue; }

      // A charging beam resolves against the player here rather than as a
      // projectile, so the telegraph and the hit share one source of truth.
      if(e.state === 2 && e.telegraph >= 46 && e.telegraph < 80 && invuln <= 0){
        const d = Math.hypot(player.x-e.x, player.y-e.y);
        const ad = angDiff(Math.atan2(player.y-e.y, player.x-e.x), e.ax);
        if(Math.abs(d*Math.sin(ad)) < 16 && Math.cos(ad) > 0.3){ damagePlayer(1); }
      }

      // contact
      const contactR = e.r*0.85 + player.r*0.6;
      const pd = Math.hypot(player.x-e.x, player.y-e.y);
      if(pd < contactR){
        if(invuln <= 0 && !stats.phaseThrough){
          let dmgAmt = def.contactDmg * e.dmgMul;
          if(def.edgeBonus && Math.abs(Math.cos(e.rot - Math.atan2(player.y-e.y, player.x-e.x))) > 0.7) dmgAmt *= 2;
          if(waveImmune){ waveImmune = false; popup(player.x, player.y-26, STATE_GLYPH.immune, '#ffdca8'); }
          else if(damagePlayer(dmgAmt)) return;
        }
        // Knockback both ways, scaled by the damping upgrades.
        const kb = (1 - clamp(stats.knockbackReduce + stats.inertiaDamp*0.5, 0, 0.9));
        const a = Math.atan2(player.y-e.y, player.x-e.x);
        player.vx += Math.cos(a)*1.6*kb; player.vy += Math.sin(a)*1.6*kb;
        if(meleeDashTimer > 0){ hurtEnemy(e, stats.damage*6, 'shot', e.x, e.y); meleeDashTimer = 0; }
        if(!def.isMiniBoss && e.r < 14 && invuln > 0) hurtEnemy(e, 1, 'shot', e.x, e.y);
      } else if(pd < contactR + 26 && runStats){
        // "Graze": a near-miss the player can feel, and Slipstream can spend.
        if(!e.grazed){ e.grazed = 1; runStats.grazes++; if(stats.nearmiss) nearMissBoost = 40; }
      }
      if(pd > contactR + 60) e.grazed = 0;
      if(dashTrailTimer > 0 && pd < 60) hurtEnemy(e, stats.damage*0.6, 'shot', e.x, e.y);
    }

    // ---- enemy bullets ---------------------------------------------------
    for(let i=enemyBullets.n-1;i>=0;i--){
      const b = enemyBullets.items[i];
      if(b.homing){
        const cur = Math.atan2(b.vy, b.vx);
        const tx = decoy ? decoy.x : player.x, ty = decoy ? decoy.y : player.y;
        const na = cur + clamp(angDiff(Math.atan2(ty-b.y, tx-b.x), cur), -b.homing*dt, b.homing*dt);
        const s = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na)*s; b.vy = Math.sin(na)*s;
      }
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      if(b.life <= 0 || !onScreen(b.x, b.y, 40)){ enemyBullets.releaseAt(i); continue; }
      const d = Math.hypot(player.x-b.x, player.y-b.y);
      if(d < b.r + player.r*0.55){
        if(invuln <= 0){
          enemyBullets.releaseAt(i);
          if(damagePlayer(b.dmg)) return;
          continue;
        }
      } else if(d < b.r + player.r*0.55 + 22 && runStats && !b.grazed){
        b.grazed = 1; runStats.grazes++;
        if(stats.nearmiss) nearMissBoost = 40;
      }
    }

    // ---- hazards ---------------------------------------------------------
    for(let i=hazards.n-1;i>=0;i--){
      const h = hazards.items[i];
      h.life -= dt;
      if(h.life <= 0){ hazards.releaseAt(i); continue; }
      h.tick -= dt;
      if(h.tick <= 0 && invuln <= 0 && Math.hypot(player.x-h.x, player.y-h.y) < h.r + player.r*0.5){
        h.tick = 40;
        if(damagePlayer(h.dmg)) return;
      }
    }

    // ---- powerups --------------------------------------------------------
    const magnetR = stats.magnet;
    for(let i=powerups.n-1;i>=0;i--){
      const p = powerups.items[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.pulse += 0.1*dt;
      p.ttl -= dt;
      if(p.ttl <= 0){
        spawnParticles(p.x, p.y, 'rgba(90,106,147,0.6)', 4, 1.4, 16);
        powerups.releaseAt(i);
        continue;
      }
      const d = Math.hypot(player.x-p.x, player.y-p.y);
      if(d < p.r + player.r + magnetR + 40){
        // Magnet pulls rather than teleports, so the pickup still reads.
        const a = Math.atan2(player.y-p.y, player.x-p.x);
        p.x += Math.cos(a)*2.2*dt; p.y += Math.sin(a)*2.2*dt;
      }
      if(d < p.r + player.r){
        applyPowerup(p.type, p.x, p.y, p.life);
        powerups.releaseAt(i);
        checkAchievements();
      } else if(!onScreen(p.x, p.y, 60)){
        powerups.releaseAt(i);
      }
    }

    // ---- decoy -----------------------------------------------------------
    if(decoy){ decoy.life -= dt; if(decoy.life <= 0) decoy = null; }

    // ---- particles / popups / shockwaves / lights -------------------------
    for(let i=particles.n-1;i>=0;i--){
      const p = particles.items[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt);
      p.life -= dt;
      if(p.life <= 0) particles.releaseAt(i);
    }
    for(let i=popups.n-1;i>=0;i--){
      const p = popups.items[i];
      p.y -= 0.4*dt; p.life -= dt;
      if(p.life <= 0) popups.releaseAt(i);
    }
    for(let i=shockwaves.n-1;i>=0;i--){
      const s = shockwaves.items[i];
      s.life -= dt;
      s.r = s.maxR * (1 - s.life/s.maxLife);
      if(s.life <= 0) shockwaves.releaseAt(i);
    }
    for(let i=lights.n-1;i>=0;i--){
      const l = lights.items[i];
      l.intensity -= l.decay*dt;
      if(l.intensity <= 0) lights.releaseAt(i);
    }

    // ---- wave completion -------------------------------------------------
    if(enemies.n === 0 && spawning && !bossActive && !transitioning){
      waveTimer += dt;
      if(waveTimer > 50){ waveTimer = 0; advanceWave(false); }
    }

    score += dt*0.5;
    if(ultReady) ultCharge = 1;
    updateUltUI();
  }

  let shieldRegenAcc = 0, regenAcc = 0, nearMissBoost = 0, vectorUsed = false;

  // Command Node's aura, collected once per step rather than rescanned for
  // every unit that fires (that was the one genuinely O(n^2) path left).
  const buffSources = [];
  let buffSourceCount = 0;
  function enemyBuffed(e){
    for(let i=0;i<buffSourceCount;i++){
      const o = buffSources[i];
      if(o !== e && o.faction === e.faction && Math.hypot(o.x-e.x, o.y-e.y) < 200) return true;
    }
    return false;
  }

  function fireShot(){
    const dirs = [0];
    if(spreadTimer > 0 || stats.spread){ dirs.push(-0.22, 0.22); }
    if(stats.spread > 1){ dirs.push(-0.42, 0.42); }
    const forcedCrit = passiveHook('fire') === true;
    let fired = false;
    for(let d=0; d<dirs.length; d++){
      const lanes = 1 + stats.extraShots;
      for(let k=0;k<lanes;k++){
        const b = bullets.acquire();
        if(!b) break;
        const ang = player.a + dirs[d];
        const perpX = -Math.sin(ang), perpY = Math.cos(ang);
        const off = (k - (lanes-1)/2) * 8;
        let dmg = stats.damage * (d === 0 ? 1 : 0.7);
        if(paradoxKey === 'damageAdd') dmg *= paradoxVal;
        b.x = player.x + Math.cos(ang)*16 + perpX*off;
        b.y = player.y + Math.sin(ang)*16 + perpY*off;
        b.vx = Math.cos(ang)*stats.bulletSpeed + player.vx*0.4;
        b.vy = Math.sin(ang)*stats.bulletSpeed + player.vy*0.4;
        b.life = 70; b.pierce = stats.pierce; b.dmg = dmg;
        b.homing = homingTimer > 0 || Math.random() < stats.homing;
        b.splash = stats.splash; b.r = 2.6; b.fromDrone = false; b.warp = 0;
        b.crit = forcedCrit || Math.random() < stats.critChance;
        fired = true;
      }
    }
    if(fired){
      sfxShoot();
      lastPlayerAbility = 'shot';
      if(runStats){
        runStats.shotsFired++;
        if(!runStats.firstShotMs) runStats.firstShotMs = performance.now() - runStats.startMs;
      }
    }
  }

  function nearestTarget(x, y){
    let best = null, bd = Infinity;
    const near = nearEnemies(x, y, 340);
    for(let i=0;i<near.length;i++){
      const e = near[i];
      if(!e.active || (e.cloak && e.alpha < 0.3)) continue;
      const d = Math.hypot(e.x-x, e.y-y);
      if(d < bd){ bd = d; best = e; }
    }
    return best;
  }

  // ==========================================================================
  // 3.3 / 3.4 / 2.4 — background layer.
  // Its own canvas, so the nebula and parallax are not repaid on the hot
  // gameplay canvas every frame, and it is only redrawn when the parallax has
  // actually moved a meaningful amount or the faction atmosphere changed.
  // ==========================================================================
  const PARALLAX = [
    {count:70, speed:0.06, size:[0.4,1.1], alpha:0.45, minTier:1},
    {count:50, speed:0.14, size:[0.6,1.5], alpha:0.6,  minTier:1},
    {count:30, speed:0.28, size:[0.9,2.1], alpha:0.85, minTier:1},
    // Tier 5+ gains a mid-distance debris field and a very-near glass dust
    // layer, so the late factions are visibly denser than Tier 1 (3.3).
    {count:26, speed:0.5,  size:[1.2,2.8], alpha:0.5,  minTier:5, debris:true},
    {count:34, speed:0.95, size:[0.5,1.3], alpha:0.32, minTier:5, dust:true}
  ];
  let layers = [];
  let bgScrollAcc = 0, bgLastScroll = 0;
  let nebulaCanvas = null, nebulaCtx = null, nebulaFaction = null;

  function initParallax(){
    layers = PARALLAX.map(cfg => {
      const n = Math.round(cfg.count * (perfLevel()==='low' ? 0.5 : (perfLevel()==='high' ? 1.2 : 1)));
      const xs = new Float32Array(n), ys = new Float32Array(n), rs = new Float32Array(n), ph = new Float32Array(n);
      for(let i=0;i<n;i++){
        xs[i] = Math.random()*W; ys[i] = Math.random()*H;
        rs[i] = rand(cfg.size[0], cfg.size[1]);
        ph[i] = Math.random()*Math.PI*2;
      }
      return {cfg:cfg, n:n, xs:xs, ys:ys, rs:rs, ph:ph};
    });
  }

  function buildNebula(){
    const f = currentFaction;
    if(nebulaCanvas && nebulaFaction === f.id && nebulaCanvas.width === Math.round(W*0.5)) return;
    if(!nebulaCanvas){
      nebulaCanvas = document.createElement('canvas');
      nebulaCtx = nebulaCanvas.getContext('2d');
    }
    // Half resolution: it is a soft gradient wash, nobody can see the pixels.
    nebulaCanvas.width = Math.max(1, Math.round(W*0.5));
    nebulaCanvas.height = Math.max(1, Math.round(H*0.5));
    nebulaFaction = f.id;
    const c = nebulaCtx, w = nebulaCanvas.width, h = nebulaCanvas.height;
    c.clearRect(0,0,w,h);
    c.fillStyle = '#070914';
    c.fillRect(0,0,w,h);
    const blobs = [
      {x:0.3, y:0.2, r:0.62, col:f.nebula[0]},
      {x:0.8, y:0.78, r:0.55, col:f.nebula[1]},
      {x:0.55, y:0.5, r:0.42, col:f.nebula[0]}
    ];
    for(const b of blobs){
      const g = c.createRadialGradient(b.x*w, b.y*h, 0, b.x*w, b.y*h, b.r*Math.max(w,h));
      g.addColorStop(0, b.col);
      g.addColorStop(1, 'rgba(7,9,20,0)');
      c.fillStyle = g;
      c.fillRect(0,0,w,h);
    }
  }

  function drawBackground(dt){
    const tier = activeTier();
    const scrollRate = 1 + wave*0.04;
    bgScrollAcc += 0.35*scrollRate*dt;
    // Under GL the nebula and starfield are a fullscreen shader; only the
    // scroll clock is shared.
    if(GL_ON) return;
    const moved = Math.abs(bgScrollAcc - bgLastScroll);
    const threshold = perfLevel()==='low' ? 1.6 : 0.7;
    if(!bgDirty && moved < threshold) return;   // 2.4: skip the whole pass
    bgLastScroll = bgScrollAcc;
    bgDirty = false;

    buildNebula();
    bgCtx.clearRect(0,0,W,H);
    bgCtx.drawImage(nebulaCanvas, 0, 0, W, H);

    for(let li=0; li<layers.length; li++){
      const L = layers[li], cfg = L.cfg;
      if(tier < cfg.minTier) continue;
      bgCtx.globalAlpha = cfg.alpha;
      bgCtx.fillStyle = currentFaction.star;
      for(let i=0;i<L.n;i++){
        L.ys[i] += cfg.speed*scrollRate*dt;
        if(L.ys[i] > H + 4){ L.ys[i] = -4; L.xs[i] = Math.random()*W; }
        const tw = 0.55 + Math.sin(bgScrollAcc*0.06 + L.ph[i])*0.45;
        bgCtx.globalAlpha = cfg.alpha*tw;
        if(cfg.debris){
          // Mid-distance debris reads as chunks, not points.
          bgCtx.fillRect(L.xs[i], L.ys[i], L.rs[i]*2.2, L.rs[i]*1.1);
        } else {
          bgCtx.beginPath();
          bgCtx.arc(L.xs[i], L.ys[i], L.rs[i], 0, Math.PI*2);
          bgCtx.fill();
        }
      }
    }
    bgCtx.globalAlpha = 1;
  }
  function markBgDirty(){ bgDirty = true; }

  // ==========================================================================
  // 2.5 / 3.1 — pre-rendered glow sprites and the two-bucket bloom.
  //
  // ctx.shadowBlur is the single most expensive Canvas2D operation available,
  // so real-time blur is reserved for the `high` tier via sb(). Everywhere
  // else, glow is a baked radial-gradient sprite drawn with drawImage — the
  // same visual language at a fraction of the per-call cost.
  // ==========================================================================
  const glowCache = new Map();
  const GLOW_SIZE = 64;
  function glowSprite(color){
    let s = glowCache.get(color);
    if(s) return s;
    if(glowCache.size > 40){ glowCache.clear(); }
    const c = document.createElement('canvas');
    c.width = c.height = GLOW_SIZE;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(GLOW_SIZE/2, GLOW_SIZE/2, 0, GLOW_SIZE/2, GLOW_SIZE/2, GLOW_SIZE/2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.35, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 1;
    g.fillStyle = grad;
    g.fillRect(0,0,GLOW_SIZE,GLOW_SIZE);
    glowCache.set(color, c);
    return c;
  }
  function drawGlow(target, x, y, radius, color, alpha){
    const s = glowSprite(color);
    target.globalAlpha = alpha;
    target.drawImage(s, x-radius, y-radius, radius*2, radius*2);
    target.globalAlpha = 1;
  }

  // Two bloom buckets: a "hot" one for emissive cores (bullets, engine flare,
  // explosion centres) composited bright with little blur, and a "cool" one for
  // ambient outlines composited soft and wide. Directed glow reads far better
  // than one flat pass over everything (3.1).
  let hotBuf = null, hotCtx = null, coolBuf = null, coolCtx = null, bloomScale = 0.25;
  function onResizeBuffers(){
    bloomScale = perfLevel()==='high' ? 0.3 : 0.22;
    const bw = Math.max(1, Math.round(W*bloomScale)), bh = Math.max(1, Math.round(H*bloomScale));
    if(!hotBuf){
      hotBuf = document.createElement('canvas'); hotCtx = hotBuf.getContext('2d');
      coolBuf = document.createElement('canvas'); coolCtx = coolBuf.getContext('2d');
    }
    hotBuf.width = bw; hotBuf.height = bh;
    coolBuf.width = bw; coolBuf.height = bh;
    nebulaFaction = null;      // force a rebuild at the new size
    initParallax();
    markBgDirty();
  }

  // Bloom emitters are queued during the entity pass and flushed once, so the
  // geometry is never drawn a second time just to make it glow.
  const bloomHot = [], bloomCool = [];
  const MAX_BLOOM_EMITTERS = 240*4;
  function emitBloom(x, y, r, color, hot){
    if(bloomAlpha() <= 0) return;
    const arr = hot ? bloomHot : bloomCool;
    if(arr.length >= MAX_BLOOM_EMITTERS) return;
    arr.push(x, y, r, color);
  }
  function flushBloom(){
    if(bloomAlpha() <= 0 || !hotBuf){ bloomHot.length = 0; bloomCool.length = 0; return; }
    const s = bloomScale;
    hotCtx.setTransform(1,0,0,1,0,0);
    coolCtx.setTransform(1,0,0,1,0,0);
    hotCtx.clearRect(0,0,hotBuf.width,hotBuf.height);
    coolCtx.clearRect(0,0,coolBuf.width,coolBuf.height);
    for(let i=0;i<bloomHot.length;i+=4){
      drawGlow(hotCtx, bloomHot[i]*s, bloomHot[i+1]*s, bloomHot[i+2]*s, bloomHot[i+3], 0.85);
    }
    for(let i=0;i<bloomCool.length;i+=4){
      drawGlow(coolCtx, bloomCool[i]*s, bloomCool[i+1]*s, bloomCool[i+2]*s*1.6, bloomCool[i+3], 0.4);
    }
    bloomHot.length = 0; bloomCool.length = 0;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    // Hot: brighter, tighter. Cool: dimmer, wider — the wider draw IS the blur.
    ctx.globalAlpha = 0.85 * bloomAlpha();
    ctx.drawImage(hotBuf, 0, 0, W, H);
    ctx.globalAlpha = 0.45 * bloomAlpha();
    ctx.drawImage(coolBuf, -W*0.02, -H*0.02, W*1.04, H*1.04);
    ctx.restore();
  }

  // ==========================================================================
  // WebGL2 renderer.
  //
  // Written directly against the GL API — no engine, no framework, no download,
  // so the file stays self-contained and the game still works with the device
  // offline. Everything the Canvas2D path faked is real here: per-pixel point
  // lighting with inverse-square falloff, an HDR scene buffer with a genuine
  // separable-gaussian bloom, screen-space refraction, and shapes drawn as
  // signed distance fields so they stay crisp at any resolution instead of
  // being stroked polygons.
  //
  // Every entity is one instance in a single interleaved buffer, so a full
  // frame is a handful of draw calls rather than thousands of canvas ops.
  //
  // If anything here fails — no WebGL2, a driver that rejects a shader, a lost
  // context — glInit() returns false and the Canvas2D path runs unchanged.
  // ==========================================================================
  let gl = null;
  const GLR = {
    ok:false, hdr:false,
    sceneFbo:null, sceneTex:null,
    brightFbo:null, brightTex:null,
    blurFboA:null, blurTexA:null, blurFboB:null, blurTexB:null,
    w:0, h:0, bw:0, bh:0,
    prog:{}, vao:{}, buf:{},
    instData:null, instCount:0, instCap:0,
    lightData:null, lightCount:0,
    warpData:null, warpCount:0
  };
  const GL_MAX_INSTANCES = 26000;   // sprites + particles in one buffer
  const GL_MAX_LIGHTS = 16;         // per-pixel lights in the sprite shader
  const GL_MAX_WARPS = 8;           // screen-space refraction sources
  const FLOATS_PER_INSTANCE = 16;

  function glCompile(type, src, label){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.warn('NOVA GL: ' + label + ' failed to compile\n' + gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }
  function glProgram(vsSrc, fsSrc, label){
    const vs = glCompile(gl.VERTEX_SHADER, vsSrc, label + '.vert');
    if(!vs) return null;
    const fs = glCompile(gl.FRAGMENT_SHADER, fsSrc, label + '.frag');
    if(!fs){ gl.deleteShader(vs); return null; }
    const p = gl.createProgram();

// organic rock outlines from the same two instructions.
float shapeRadius(float ang, float shape, float sides, float seed){
