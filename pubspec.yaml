name: tilawa_enhancer
description: "محسن التلاوة - تحسين صوت القرآن الكريم"
publish_to: 'none'
version: 2.7.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: 10.1.0     # S153: pin — 10.2+ breaks AGP subprojects
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.0  # S61
  webview_flutter: ^4.8.0  # S209: hosts the Nova Drift mini-game

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # S241: Tajawal — custom Arabic typeface (SIL OFL, Boutros International).
  # Bundled so Arabic text renders with proper, beautiful letterforms fully
  # offline; its Latin glyphs keep English looking consistent too.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
  assets:
    - assets/
    - assets/servers.json
    - assets/images/
    - assets/images/engines/
    - assets/engines/ # S65: Python engine scripts
    - assets/dsp/ # S228: Studio Engine (numpy/scipy) — audio editor only, not a restoration engine
    - assets/bin/ # S69: bundled proot binary
    - assets/alpine/ # S82: bundled Alpine + Python + DeepFilter
    - assets/reference_audio/ # S82: bundled reference audio
    - assets/game/ # S209: Nova Drift mini-game
