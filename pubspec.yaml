name: tilawa_enhancer
description: "محسن التلاوة - تحسين صوت القرآن الكريم"
publish_to: 'none'
version: 2.7.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^6.2.1    # NEVER above v6 — v7/v8 crash Samsung
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/engines/
