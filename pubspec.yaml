name: tilawa_enhancer
description: "محسن التلاوة - تحسين صوت القرآن الكريم"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^10.1.0    # S59c: v6 removed Registrar, v11 breaks API — v10 is safe
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.0  # S61

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/servers.json
    - assets/images/
    - assets/images/engines/
    - assets/engines/ # S65: Python engine scripts
    - assets/bin/ # S69: bundled proot binary
    - assets/alpine/ # S82: bundled Alpine + Python + DeepFilter
    - assets/reference_audio/ # S82: bundled reference audio
